    const m = Math.round(hyp(Nav.goal.x - G.player.x, Nav.goal.y - G.player.y) / 8);
    textOut(x, m + 'M', ex, ey - 17, PAL.amber, 1, 1);
  },
};

/* chunky turn arrow. kind: 0 straight 1 right 2 uturn 3 left 4 arriving */
function navArrow(x, cx, cy, kind, col, time) {
  const b = (px, py, w, h) => R(x, col, cx + px, cy + py, w, h);
  // 3-step solid arrowheads, tip one px beyond the last step
  const hUp    = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - (i + 1), ay - 3 + i, (i + 1) * 2, 1); };
  const hDown  = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - (i + 1), ay + 2 - i, (i + 1) * 2, 1); };
  const hRight = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax + 2 - i, ay - (i + 1), 1, (i + 1) * 2); };
  const hLeft  = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - 2 + i, ay - (i + 1), 1, (i + 1) * 2); };

  if (kind === 0) {                        // continue straight
    hUp(0, -4);  b(-2, -5, 4, 13);
  } else if (kind === 1) {                 // turn right
    b(-8, -2, 4, 10);  b(-8, -6, 12, 4);  hRight(4, -4);
  } else if (kind === 3) {                 // turn left
    b(4, -2, 4, 10);   b(-4, -6, 12, 4);  hLeft(-4, -4);
  } else if (kind === 2) {                 // u-turn
    b(3, -4, 4, 12);   b(-5, -8, 12, 4);  b(-5, -4, 4, 5);  hDown(-3, 1);
  } else {                                 // arriving — bobbing marker
    const bob = (Math.sin(time * 6) * 1.5) | 0;
    hDown(0, 3 + bob);  b(-2, -6 + bob, 4, 9);
    if ((time * 4 | 0) % 2) { b(-6, 7, 12, 2); }
  }
}

function triArrow(x, cx, cy, a, r, col, outline) {
  const c = Math.cos(a), s = Math.sin(a);
  const P = [[r, 0], [-r * 0.7, -r * 0.75], [-r * 0.7, r * 0.75]];
  x.beginPath();
  P.forEach(([lx, ly], i) => {
    const px = cx + lx * c - ly * s, py = cy + lx * s + ly * c;
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  });
  x.closePath();
  x.fillStyle = col; x.fill();
  x.strokeStyle = outline; x.lineWidth = 1; x.stroke();
}


/* ===== 72_dialog.js ===== */
/* ============================================================
   DIALOGUE STRIP -- one mechanism, both halves of the game
   ============================================================

   The constraint that shaped it: in the Delivery Shift the middle band is the
   road and cannot be covered while you are steering; in the Kitchen the middle
   band is the ingredient lattice. The only region non-critical in BOTH is the
   bottom strip -- and it is non-critical precisely because during a one-line
   reaction you are not reading the minimap or the nav unit.

   So the strip takes that band for as long as someone is speaking, and gives
   it back. It lands on furniture in both halves, which is the point: the
   furniture is what you can spare.

   PORTRAIT BOX: 56x56 is the minimap's rect reused, and it is a FLOOR, not a
   ceiling. A bust squeezed into 56 rows drops the face from 33px wide to 24px,
   and this project has already measured that a face works at ~44px and is mush
   around 21px. So a taller portrait OVERHANGS the strip upward while the strip
   itself stays 60 rows. That costs a 60x18 patch at the bottom-left corner --
   where the minimap already sits, the cheapest real estate on the screen --
   rather than a taller band across all 376px. Breaking the frame is an arcade
   idiom, not an accident.
*/
'use strict';

/* Which baked face speaks. One character exists so far, so this is a constant;
   when the cast grows it becomes a property of whoever is talking. */
const DLG_FACE = 'smokerbust';

const DLG_Y = 150, DLG_H = 60, DLG_X = 4;
const DLG_BOX = 56;                 // the minimap's rect: the floor
const DLG_RISE = 0.16;              // seconds to slide in

const Dialog = {
  active: false, t: 0, hold: 0, who: '', lines: [], sub: '', meter: null,
  face: null, hostile: false, hood: 0, blinkT: 0, blink: 0,

  /** raise the strip. `secs` is how long it stays up once it has arrived. */
  say(who, line, o) {
    o = o || {};
    this.active = true; this.t = 0; this.hold = o.secs || 3.2;
    this.who = who; this.lines = [].concat(line);
    this.sub = o.sub || ''; this.meter = o.meter == null ? null : o.meter;
    this.face = o.face || null; this.hostile = !!o.hostile;
    this.hood = o.hood || 0; this.blinkT = 1.4 + Math.random() * 1.6; this.blink = 0;
  },

  drop() { this.active = false; },

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    /* a blink every couple of seconds -- the one thing that stops a static
       portrait reading as a still image pasted over the game */
    this.blinkT -= dt;
    if (this.blink > 0) { this.blink -= dt; if (this.blink <= 0) this.blinkT = 1.4 + Math.random() * 1.8; }
    else if (this.blinkT <= 0) this.blink = 0.11;
    if (this.t > DLG_RISE + this.hold) this.active = false;
  },

  draw(x) {
    if (!this.active) return;
    const f = this.face && FACES[this.face];
    const fw = f ? Math.max(DLG_BOX, f.w + 4) : DLG_BOX;
    const fh = f ? Math.max(DLG_BOX, f.h + 4) : DLG_BOX;

    /* slide up, and ease out so it settles rather than snapping */
    const g = Math.min(1, this.t / DLG_RISE), e = 1 - (1 - g) * (1 - g);
    const dy = Math.round((1 - e) * (DLG_H + 8));

    x.save();
    x.translate(0, dy);

    const py = DLG_Y, h = DLG_H, px = DLG_X, w = VW - 8;
    R(x, 'rgba(10,6,16,0.55)', px + 3, py + 4, w, h);
    Hud.panel(x, px, py, w, h, '#6b5f84');

    const fx = px + 3, fy = py + 2 - (fh - DLG_BOX);      // grows up, never down
    R(x, PAL.ink, fx, fy, fw, fh);
    R(x, '#2a2438', fx + 1, fy + 1, fw - 2, fh - 2);
    for (let i = 0; i < fh - 2; i += 3)                   // faint backing, so the
      R(x, '#31293f', fx + 1, fy + 1 + i, fw - 2, 1);     // head is not on a void
    if (f) Faces.draw(x, this.face, fx + fw / 2, fy + ((fh - f.h) >> 1),
                      { hood: this.hood, blink: this.blink > 0 ? 1 : 0 });
    x.strokeStyle = '#6b5f84'; x.lineWidth = 1;
    x.strokeRect(fx + 0.5, fy + 0.5, fw - 1, fh - 1);

    /* speech bubble */
    const bx = fx + fw + 10, by = py + 6, bw = px + w - 6 - bx, bh = 34;
    R(x, PAL.ink, bx, by, bw, bh);
    R(x, PAL.bone, bx + 1, by + 1, bw - 2, bh - 2);
    R(x, PAL.boneDim, bx + 1, by + bh - 2, bw - 2, 1);
    for (let i = 0; i < 5; i++) {                          // tail into the portrait
      R(x, PAL.ink, bx - 1 - i, by + 11 + i, 2, 7 - i);
      R(x, PAL.bone, bx - i, by + 12 + i, 2, 5 - i);
    }

    /* speaker plate rides the bubble's top-left corner, clear of the head */
    const nw = textW(this.who, 1) + 8;
    R(x, PAL.ink, bx + 4, by - 4, nw, 9);
    R(x, this.hostile ? PAL.bad : PAL.amber, bx + 5, by - 3, nw - 2, 7);
    text(x, this.who, bx + 8, by - 2, PAL.ink, 1);

    const n = this.lines.length;
    for (let i = 0; i < n; i++)
      text(x, this.lines[i], bx + bw / 2, by + (n > 1 ? 9 : 14) + i * 11, PAL.ink, 1, 1);

    if (this.sub) text(x, this.sub, bx + 2, py + h - 12, this.hostile ? PAL.bad : PAL.boneDim, 1);
    if (this.meter != null) {
      const mw = 96, mx = px + w - mw - 6;
      R(x, PAL.ink, mx, py + h - 13, mw, 5);
      const v = clamp(this.meter, 0, 1);
      R(x, v > 0.5 ? PAL.amber : v > 0.22 ? '#e07a1f' : PAL.bad, mx + 1, py + h - 12, Math.round((mw - 2) * v), 3);
    }
    x.restore();
  },
};


/* ===== 74_kitchen.js ===== */
/* ============================================================
   KITCHEN SHIFT -- the other half of the game
   ============================================================

   Ported from reference/kitchen/kitchen.mjs, which is the approved LOOK. The
   regions keep the names its README gives them, so the docs and the code talk
   about the same things:

     TICKET RAIL   y 0..74     three dockets, x4 / x86 / x168, 78 wide
     OVERHEAD      x249..384   the dining room from above; the only place a
                   y 0..104    customer exists
     LATTICE       y104..164   TWELVE bins in 2x6, plus a base station either
                               side. Nothing on it ever moves between levels.
     PREP BOARD    y164..216   BUILD PROGRESS readout, the board, the button
     DIALOGUE STRIP            the shared strip, src/72_dialog.js

   One object, deliberately. The reference module had fifty top-level names,
   six times what a src module averages; in the bundle every one of them would
   share a scope with 140 others. Everything lives under `Kitchen`.

   The rules it plays by are GDD IV and docs/PURE-CARNAGE-DECISIONS.md:
     - the recipes are hidden: pips say how many steps, not which
     - a wrong pick flashes the PLATE red and holds until the right pick, costs
       the item's star and the ticket's clean bonus, and never undoes progress
     - focus is assigned (oldest ticket, next item) -- there is no input left
       for choosing it: select, wrap and serve are the three buttons
     - the tip is the patience; at zero the customer walks out
     - the rail holds three; more queue in the room and complain, and while
       anyone is queueing every live ticket drains half again as fast
*/
'use strict';

const Kitchen = {
  /* ---------------- geometry (reference/kitchen/README.md) ---------- */
  OV_X: 249, OV_H: 104,
  CELL_W: 46, CELL_H: 28, COL0: 5, ROW_Y: [105, 135],
  BX: 138, BW: 177,                      // the assembly board
  TICKET_W: 78,
  RAIL_MAX: 3, QUEUE_MAX: 3,
  COMPLAIN_MUL: 1.5,
  PIP_W: 8, PIP_G: 1,

  /* Ingredient colours for the drawn layers: pips, and the item on the board.
     The wells themselves are baked pixel art (LATTICE); these are the same
     foods' mid / high / low, taken from the reference ING table. */
  ING: {
    BEEF:    ['#6b4326', '#8a5a33', '#452a15', 'chunk'],
    BEANS:   ['#8d5a33', '#a87243', '#66401f', 'mass'],
    LETTUCE: ['#5aa14c', '#7ddc5a', '#3d7534', 'shred'],
    TOMATO:  ['#e05a2a', '#ff8552', '#9c3410', 'chunk'],
    ONION:   ['#e6ddc6', '#ffffff', '#a89e86', 'chunk'],
    CCQ:     ['#e8a33c', '#ffc466', '#a86a18', 'sauce'],
    PEPPERS: ['#3e8a47', '#63b86b', '#204a28', 'chunk'],
    CREAM:   ['#f2e9d0', '#ffffff', '#c2b89c', 'sauce'],
    CHEESE:  ['#e0b055', '#f5d478', '#b0812c', 'shred'],
    SAUCE:   ['#b8361a', '#d9502a', '#7a2210', 'sauce'],
    CHILI:   ['#7a2416', '#9c3a22', '#4f160c', 'mass'],
    CHICKEN: ['#c9a25e', '#e2bd77', '#8f6d33', 'chunk'],
    SHELL:   ['#e0b055', '#f0c96f', '#b78a3a'],
    SMALL:   ['#d8c69c', '#ecdcb4', '#b8a37c'],
    LARGE:   ['#d8c69c', '#ecdcb4', '#b8a37c'],
    CHIPS:   ['#e6bb63', '#f7d488', '#b0812c'],
  },

  STAR: ['...#...', '..###..', '#######', '.#####.', '..###..', '.##.##.', '##...##'],
  STAR_LOST: '#6b5f84',

  /* ---------------- runtime state ------------------------------------ */
  menu: null, diff: null, era: 1, demo: false,
  bins: [], left: [], right: [],
  tickets: [], queue: [], walkers: [], pops: [],
  cur: { c: 3, r: 0, z: 0 },
  arriveT: 0, docket: 0,
  flashKey: null, flashT: 0, wrongKey: null, hintT: 0,
  buzzT: 0, barkT: 0, complained: false,
  bg: null, wells: null, picCache: null,
  lastMx: -1, lastMy: -1,
  bot: null,
  stats: null,

  /* ================================================================ */
  /* setup                                                            */
  /* ================================================================ */

  /* Called by G when a kitchen level starts (or the attract demo plays one). */
  enter(level, diff, demo) {
    this.era = level.era || 1;
    this.diff = diff.kitchen;
    this.demo = !!demo;
    this.menu = (typeof MENUS !== 'undefined' && MENUS[this.era]) || this.fallbackMenu();
    this.bins = this.menu.bins.map((b) => this.norm(b));
    this.left = (this.menu.bases && this.menu.bases.left || ['SMALL', 'SHELL', 'LARGE']).map((b) => this.norm(b));
    this.right = (this.menu.bases && this.menu.bases.right || ['CHIPS']).map((b) => this.norm(b));
    this.tickets = []; this.queue = []; this.walkers = []; this.pops = [];
    this.cur = { c: 3, r: 0, z: 0 };
    this.arriveT = 1.5;                   // the first ticket arrives almost at once
    this.docket = 0;
    this.flashKey = null; this.flashT = 0; this.wrongKey = null; this.hintT = 0;
    this.buzzT = 0; this.barkT = 0; this.complained = false;
    this.stats = { served: 0, walkouts: 0, items: 0, clean: 0, mistakes: 0, best: 0 };
    this.bot = { t: 0.6, slip: null };
    if (!this.wells) this.buildWells();
    this.picCache = Object.create(null);
    this.bg = this.buildBg();
  },

  /* bins and bases arrive as {key, name, plate} or a bare key */
  norm(b) {
    if (!b) return null;
    if (typeof b === 'string') return { key: b, name: b, plate: b.slice(0, 7) };
    return { key: b.key, name: b.name || b.key, plate: (b.plate || b.key).slice(0, 7) };
  },

  /* The game must never blank because content failed to load. build.mjs
     validates MENUS loudly; this exists only so a missing global cannot
     take the kitchen down with it. */
  fallbackMenu() {
    return {
      bins: ['BEEF', 'BEANS', 'LETTUCE', 'TOMATO', 'ONION', 'CCQ', 'PEPPERS', 'CREAM', 'CHEESE', null, null, null],
      bases: { left: ['SMALL', 'SHELL', 'LARGE'], right: ['CHIPS'] },
      items: [
        { name: 'HARD TACO', ticket: 'HARD TACO', short: 'HD TACO', price: 29, recipe: ['SHELL', 'BEEF', 'LETTUCE', 'CHEESE'] },
        { name: 'BEAN BURRITO', ticket: 'BEAN BURRITO', short: 'BEAN BUR', price: 49, recipe: ['LARGE', 'BEANS', 'CHEESE'] },
        { name: 'NACHOS', ticket: 'NACHOS', short: 'NACHOS', price: 49, recipe: ['CHIPS', 'CCQ', 'PEPPERS'] },
      ],
    };
  },

  /* Baked wells decode once, like Faces.build. Same run-length format, so the
     same decoder. */
  buildWells() {
    this.wells = Object.create(null);
    if (typeof LATTICE === 'undefined') return;
    for (const k in LATTICE) this.wells[k] = Faces.decode(LATTICE[k]);
  },

  /* ================================================================ */
  /* tickets and customers                                            */
  /* ================================================================ */

  /* Items per ticket, weighted toward one and two: a five-item ticket is an
     event, not the norm, or the rail would be nothing but backlog. */
  rollItems() {
    const max = clamp(this.diff.maxItems | 0, 1, 5);
    const W = [0, 0.42, 0.30, 0.15, 0.08, 0.05].slice(1, max + 1);
    let tot = W.reduce((a, b) => a + b, 0), r = Math.random() * tot;
    for (let i = 0; i < W.length; i++) { r -= W[i]; if (r <= 0) return i + 1; }
    return 1;
  },

  arrive(G) {
    const n = this.rollItems(), items = [];
    for (let i = 0; i < n; i++) {
      const def = this.menu.items[(Math.random() * this.menu.items.length) | 0];
      items.push({ def, step: 0, clean: true, wrapped: false });
    }
    const t = {
      n: ++this.docket, items,
      tip: 0, max: 0, clean: true, onRail: false, x: 4 + 2 * 82 + 90, warned: false,
      cust: this.newCustomer(),
    };
    if (this.tickets.length < this.RAIL_MAX) this.toRail(t);
    else {
      this.queue.push(t);
      if (!this.complained) { this.complained = true; this.bark(G, 'queue', t, true); }
    }
    Audio5.sfx('kbell');
    if (Math.random() < 0.18) this.bark(G, 'arrive', t, false);
  },

  /* The tip starts when the docket goes on the rail -- GDD IV.F.1, "from the
     moment the ticket arrives on the rail". A customer still queueing has no
     docket up yet, so they are not costing themselves; they are costing
     everyone else, which is the complaint. */
  toRail(t) {
    t.onRail = true;
    t.max = t.tip = this.diff.tipPerItem * t.items.length;
    this.tickets.push(t);
  },

  newCustomer() {
    const casts = this.castFor(this.era);
    return {
      i: (Math.random() * Art.ped.length) | 0,
      face: casts[(Math.random() * casts.length) | 0],
      x: VW + 4, y: 92, dir: 3, f: 0, ft: 0, leaving: 0,
    };
  },

  castFor(era) {
    const pre = 'c' + (era === 1 ? 7 : era === 2 ? 8 : 9);
    const out = [];
    if (typeof FACES !== 'undefined') for (const k in FACES) if (k.startsWith(pre)) out.push(k);
    if (!out.length) out.push(DLG_FACE);
    return out;
  },

  /* where the k-th person in line stands: a LINE perpendicular to the window,
     overlapping, the way a queue looks from directly above (reference) */
  spot(k) {
    const S = [[312, 61], [308, 72], [315, 82], [305, 90], [326, 89], [292, 84], [333, 78]];
    return S[Math.min(k, S.length - 1)];
  },

  /* ================================================================ */
  /* update                                                           */
  /* ================================================================ */

  update(dt, G) {
    this.flashT = Math.max(0, this.flashT - dt);
    this.buzzT = Math.max(0, this.buzzT - dt);
    this.barkT = Math.max(0, this.barkT - dt);
    this.hintT = Math.max(0, this.hintT - dt);

    /* arrivals: on the clock, and at once whenever the room is empty */
    this.arriveT -= dt;
    const live = this.tickets.length + this.queue.length;
    if (live === 0 && this.arriveT > 0.6) this.arriveT = 0.6;
    if (this.arriveT <= 0) {
      if (live < this.RAIL_MAX + this.QUEUE_MAX) this.arrive(G);
      this.arriveT = this.diff.every;
    }

    /* patience. The complaint is a rate, not a meter: one more number on a
       screen that already has three would not be read. */
    const mul = this.queue.length ? this.COMPLAIN_MUL : 1;
    if (!this.queue.length) this.complained = false;
    for (let i = this.tickets.length - 1; i >= 0; i--) {
      const t = this.tickets[i];
      t.tip -= this.diff.decay * mul * dt;
      if (!t.warned && t.tip < t.max * 0.3) { t.warned = true; this.bark(G, 'wait', t, true); }
      if (t.tip <= 0) this.walkout(G, t, i);
    }

    /* the rail slides left as dockets come off it */
    this.tickets.forEach((t, s) => {
      const tx = 4 + s * 82;
      t.x += (tx - t.x) * (1 - Math.exp(-12 * dt));
      if (Math.abs(tx - t.x) < 0.5) t.x = tx;
    });

    this.walk(dt);

    if (this.demo) this.botStep(dt, G);
    else this.input(G);

    for (let i = this.pops.length - 1; i >= 0; i--) {
      const p = this.pops[i]; p.t += dt; p.y -= 14 * dt;
      if (p.t > 1.3) this.pops.splice(i, 1);
    }
  },

  /* everyone in the room walks toward where they should be standing */
  walk(dt) {
    const line = this.tickets.concat(this.queue);
    line.forEach((t, k) => { const [sx, sy] = this.spot(k); t.cust.tx = sx; t.cust.ty = sy; });
    const step = (c) => {
      const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
      if (d > 0.6) {
        const v = Math.min(d, (c.leaving ? 46 : 38) * dt);
        c.x += dx / d * v; c.y += dy / d * v;
        c.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
        c.ft += dt; if (c.ft > 0.16) { c.ft = 0; c.f ^= 1; }
      } else { c.dir = c.leaving ? c.dir : 0; c.f = 0; }
    };
    for (const t of line) step(t.cust);
    for (let i = this.walkers.length - 1; i >= 0; i--) {
      const c = this.walkers[i]; step(c);
      if (Math.hypot(c.tx - c.x, c.ty - c.y) < 1) this.walkers.splice(i, 1);
    }
  },

  /* A customer leaving -- served out the side, or walked out the front. */
  leave(c, served) {
    c.leaving = 1;
    if (served) { c.tx = VW + 8; c.ty = c.y + 6; }
    else { c.tx = c.x + 6; c.ty = this.OV_H + 16; }
    this.walkers.push(c);
  },

  walkout(G, t, i) {
    this.tickets.splice(i, 1);
    this.leave(t.cust, false);
    this.stats.walkouts++;
    G.combo = 1;
    this.pop('WALKED OUT!', 300, 70, PAL.bad);
    this.bark(G, 'walkout', t, true, true);
    Audio5.sfx('walkout');
    G.say('WALKOUT!', PAL.bad);
    this.fillRail();
  },

  fillRail() {
    while (this.tickets.length < this.RAIL_MAX && this.queue.length) this.toRail(this.queue.shift());
  },

  focus() { return this.tickets[0] || null; },
  item() {
    const t = this.focus();
    if (!t) return null;
    for (const it of t.items) if (!it.wrapped) return it;
    return null;
  },

  /* ================================================================ */
  /* the three actions                                                */
  /* ================================================================ */

  keyAt(c, r, z) {
    if (c === 0) { const b = this.left[z]; return b ? b.key : null; }
    if (c === 7) { const b = this.right[0]; return b ? b.key : null; }
    const b = this.bins[r * 6 + (c - 1)];
    return b ? b.key : null;
  },

  select(G) {
    const it = this.item(), c = this.cur;
    const key = this.keyAt(c.c, c.r, c.z);
    if (!it || it.step >= it.def.recipe.length || !key) { this.buzz(); return; }
    const want = it.def.recipe[it.step];
    if (key === want) {
      it.step++;
      this.flashKey = key; this.flashT = 0.32;
      this.wrongKey = null;
      Audio5.sfx('kpick', it.step);
      if (it.step >= it.def.recipe.length) Audio5.sfx('kready');
    } else {
      /* Counted, flashed and held -- but never undone. Losing progress on a
         mis-click would make the punishment out of all proportion to the
         slip, and the slip already costs the star and the clean bonus. */
      it.clean = false;
      this.focus().clean = false;
      this.wrongKey = key;
      this.flashKey = key; this.flashT = 0.32;
      this.stats.mistakes++;
      if (G.diffKey === 'easy') this.hintT = 1.6;     // easy: show the right bin
      Audio5.sfx('kwrong');
      if (Math.random() < 0.3) this.bark(G, 'wrong', this.focus(), true);
    }
  },

  wrap(G) {
    const it = this.item();
    if (!it || it.step < it.def.recipe.length) { this.buzz(); return; }
    it.wrapped = true;
    this.stats.items++;
    if (it.clean) { this.stats.clean++; G.levelStars++; G.stars++; }
    this.wrongKey = null;
    Audio5.sfx('kwrap');
    this.pop(it.clean ? 'WRAPPED  *' : 'WRAPPED', this.BX + this.BW / 2, 168, it.clean ? PAL.amber : PAL.bone);
  },

  serve(G) {
    const t = this.focus();
    if (!t || t.items.some((it) => !it.wrapped)) { this.buzz(); return; }
    const base = Math.max(0, Math.round(t.tip)) + (t.clean ? G.cleanBonus() : 0);
    const paid = Math.round(base * G.combo);
    G.earned += paid; G.levelEarned += paid;
    G.combo = Math.min(3, G.combo + 0.25); G.comboPop = 0.4;
    this.stats.served++;
    this.stats.best = Math.max(this.stats.best, paid);
    this.tickets.shift();
    this.leave(t.cust, true);
    this.pop('+' + money(paid), 312, 56, PAL.good);
    if (t.clean) this.pop('CLEAN TICKET +' + money(G.cleanBonus()), 300, 66, PAL.amber);
    Audio5.sfx('kserve'); Audio5.sfx('cash');
    if (Math.random() < 0.35) this.bark(G, 'served', t, false);
    G.flash = 0.08;
    this.fillRail();
    G.onComplete();
  },

  buzz() { if (this.buzzT <= 0) { Audio5.sfx('kbuzz'); this.buzzT = 0.25; } },

  /* the button does whichever of WRAP or SEND is next */
  button(G) {
    const it = this.item();
    if (it) this.wrap(G); else this.serve(G);
  },

  /* ================================================================ */
  /* input                                                            */
  /* ================================================================ */

  move(dc, dr) {
    const c = this.cur;
    if (dc) {
      const nc = clamp(c.c + dc, 0, 7);
      if (nc === c.c) return;
      /* moving between a station and the bins maps by height: the station's
         three zones are 19px tall against the bins' 28, so zone 0 meets row 0
         and zone 2 meets row 1 */
      if (c.c === 0) c.r = c.z >= 2 ? 1 : 0;
      if (nc === 0) c.z = c.c === 0 ? c.z : (c.r === 0 ? 0 : 2);
      c.c = nc;
    }
    if (dr) {
      if (c.c === 0) c.z = clamp(c.z + dr, 0, this.left.length - 1);
      else if (c.c !== 7) c.r = clamp(c.r + dr, 0, 1);
    }
    Audio5.sfx('ktick');
  },

  input(G) {
    if (Input.p('ArrowLeft', 'KeyA')) this.move(-1, 0);
    if (Input.p('ArrowRight', 'KeyD')) this.move(1, 0);
    if (Input.p('ArrowUp', 'KeyW')) this.move(0, -1);
    if (Input.p('ArrowDown', 'KeyS')) this.move(0, 1);
    if (Input.p('Space', 'KeyZ')) this.select(G);
    if (Input.p('KeyX')) this.wrap(G);
    if (Input.p('Enter', 'NumpadEnter', 'KeyC')) this.serve(G);

    /* The mouse jumps the cursor to whatever it is over, and only when it
       actually moves -- otherwise a resting pointer would fight the arrows. */
    const touch = typeof Pad !== 'undefined' && Pad.touched;
    /* The clock card is a pause button. A phone has no Esc, and the driving
       half's on-screen pause sits where this half's ticket rail is. */
    if (Input.mhit && Input.mx >= VW - 131 && Input.my < 58) { G.paused = true; Input.mhit = false; return; }
    if (Input.hasMouse || touch) {
      const moved = Input.mx !== this.lastMx || Input.my !== this.lastMy;
      this.lastMx = Input.mx; this.lastMy = Input.my;
      const hit = this.hitTest(Input.mx, Input.my);
      if (hit && (moved || Input.mhit)) {
        if (hit.c !== undefined) {
          const ch = hit.c !== this.cur.c || hit.r !== this.cur.r || hit.z !== this.cur.z;
          this.cur.c = hit.c; this.cur.r = hit.r; this.cur.z = hit.z;
          if (ch && !Input.mhit) Audio5.sfx('ktick');
        }
      }
      if (Input.mhit && hit) {
        if (hit.button) this.button(G);
        else this.select(G);
      }
    }
  },

  hitTest(mx, my) {
    const { CELL_W, CELL_H, ROW_Y } = this;
    if (mx >= 321 && mx < 380 && my >= 170 && my < 214) return { button: true };
    if (my < ROW_Y[0] || my >= ROW_Y[1] + CELL_H) return null;
    const c = Math.floor((mx - this.COL0) / (CELL_W + 1));
    if (c < 0 || c > 7) return null;
    if (c === 0) {
      const z = clamp(Math.floor((my - ROW_Y[0]) / ((ROW_Y[1] + CELL_H - ROW_Y[0]) / this.left.length)), 0, this.left.length - 1);
      return { c: 0, r: z >= 2 ? 1 : 0, z };
    }
    if (c === 7) return { c: 7, r: 0, z: 0 };
    const r = my < ROW_Y[1] ? 0 : 1;
    return { c, r, z: 0 };
  },

  /* ================================================================ */
  /* the attract-mode cook                                            */
  /* ================================================================ */

  /* Plays through the same three actions a player has, at a human pace, and
     slips about one pick in twelve -- a demo that never errs shows nobody what
     a wrong pick looks like. */
  botStep(dt, G) {
    const b = this.bot;
    b.t -= dt;
    if (b.t > 0) return;
    const it = this.item();
    if (!this.focus()) { b.t = 0.4; return; }
    if (!it) { this.serve(G); b.t = 0.7; return; }
    if (it.step >= it.def.recipe.length) { this.wrap(G); b.t = 0.45; return; }
    const want = it.def.recipe[it.step];
    if (!b.slip && Math.random() < 0.08) {
      const keys = this.bins.filter((x) => x && x.key !== want);
      b.slip = keys.length ? keys[(Math.random() * keys.length) | 0].key : null;
    }
    const goal = this.cellOf(b.slip || want);
    if (!goal) { b.slip = null; b.t = 0.3; return; }
    const c = this.cur;
    if (c.c !== goal.c) { this.move(sign(goal.c - c.c), 0); b.t = 0.11; return; }
    if (c.c === 0 && c.z !== goal.z) { this.move(0, sign(goal.z - c.z)); b.t = 0.11; return; }
    if (c.c > 0 && c.c < 7 && c.r !== goal.r) { this.move(0, sign(goal.r - c.r)); b.t = 0.11; return; }
    this.select(G);
    b.slip = null;
    b.t = 0.26 + Math.random() * 0.2;
  },

  cellOf(key) {
    const z = this.left.findIndex((b) => b && b.key === key);
    if (z >= 0) return { c: 0, r: z >= 2 ? 1 : 0, z };
    if (this.right.some((b) => b && b.key === key)) return { c: 7, r: 0, z: 0 };
    const i = this.bins.findIndex((b) => b && b.key === key);
    if (i < 0) return null;
    return { c: (i % 6) + 1, r: (i / 6) | 0, z: 0 };
  },

  /* ================================================================ */
  /* dialogue                                                         */
  /* ================================================================ */

  /* One line over the shared strip. Rate-limited: the strip covers the lower
     bins, and a kitchen that talked every time something happened would hide
     the very thing you are working on. `force` is for the moments that earn
     it -- a walkout always speaks. */
  bark(G, kind, t, hostile, force) {
    if (this.demo || typeof DIALOGUE === 'undefined') return;
    if (this.barkT > 0 && !force) return;
    const line = G.pickLine(kind);
    if (!line) return;
    this.barkT = 5;
    Dialog.say(DIALOGUE.who || 'CUSTOMER', line, {
      face: t && t.cust ? t.cust.face : DLG_FACE,
      hostile: !!hostile,
      hood: hostile ? 3 : 1,
      sub: t ? 'TICKET ' + t.n + (kind === 'walkout' ? '  -  WALKING OUT' : '') : '',
      meter: t && t.max ? clamp(t.tip / t.max, 0, 1) : null,
      secs: 1.9,
    });
  },

  pop(s, x, y, col) { this.pops.push({ s, x, y, col, t: 0 }); },

  /* ================================================================ */
  /* drawing                                                          */
  /* ================================================================ */

  colX(i) { return this.COL0 + i * (this.CELL_W + 1); },

  /* Everything that never changes during a level, baked once: the back
     wall, the pantry, the dining-room floor and its wall, the steam table
     under the bins, and the prep counter with its board. */
  buildBg() {
    const t = mkCanvas(VW, VH), x = t.x;
    const BRICK_H = PAL.roadHi, MORTAR = PAL.roadLo;
    const STEEL_D = PAL.roadLo, STEEL_X = PAL.road, STEEL = PAL.walkLo, STEEL_M = PAL.walk, STEEL_H = PAL.walkHi;
    const WOOD = PAL.walkLo, WOOD_H = PAL.walk, WOOD_L = shade(PAL.curb, -0.12);

    /* back wall */
    R(x, PAL.road, 0, 0, VW, 108);
    let rng = makeRng(1972);
    for (let by = 0, row = 0; by < 108; by += 7, row++) {
      const off = row % 2 ? -7 : 0;
      for (let bx = off; bx < VW; bx += 15) {
        if (rng.chance(0.28)) R(x, BRICK_H, bx, by, 14, 6);
        else if (rng.chance(0.14)) R(x, MORTAR, bx, by, 14, 6);
      }
      R(x, MORTAR, 0, by + 6, VW, 1);
    }
    for (let i = 0; i < 16; i++) { x.globalAlpha = 0.034 - i * 0.002; R(x, '#cfe0f0', 0, i * 3, VW, 3); }
    x.globalAlpha = 1;

    /* pantry, behind the tickets */
    const shelf = (sy) => {
      R(x, STEEL_X, 4, sy, 244, 3); R(x, STEEL_M, 4, sy, 244, 1);
      for (let i = 12; i < 250; i += 44) R(x, STEEL_X, i, sy + 3, 2, 10);
    };
    const can = (cx, cy, h, col) => {
      R(x, PAL.ink, cx, cy, 9, h); R(x, col, cx + 1, cy + 1, 7, h - 2);
      R(x, shade(col, 0.28), cx + 1, cy + 1, 2, h - 2);
      R(x, PAL.bone, cx + 1, (cy + h / 2 - 2) | 0, 7, 4);
      R(x, shade(col, -0.35), cx + 1, cy + h - 3, 7, 2);
    };
    shelf(72);
    can(207, 60, 12, '#b8442e'); can(218, 58, 14, '#c98a2a');
    shelf(96);
    can(171, 84, 12, PAL.treeLo); can(182, 82, 14, '#c98a2a');
    R(x, PAL.ink, 234, 82, 17, 14); R(x, PAL.boneDim, 235, 83, 15, 12);
    R(x, PAL.bone, 235, 83, 15, 2); R(x, shade(PAL.boneDim, -0.28), 235, 93, 15, 2);
    R(x, PAL.jadeLo, 240, 87, 5, 4);                // the shop's cactus stamp

    /* the rail spans the pass, not the whole kitchen */
    R(x, STEEL_X, 2, 1, 250, 6); R(x, STEEL_H, 2, 1, 250, 1); R(x, STEEL_M, 2, 2, 250, 1);
    R(x, shade(STEEL_X, -0.4), 2, 6, 250, 1);
    for (const bx of [2, 249]) { R(x, STEEL_D, bx, 0, 3, 10); R(x, STEEL_M, bx, 0, 3, 1); }

    /* the dining room, in plan -- the same projection as the driving half */
    const OX = this.OV_X, OW = VW - OX, OH = this.OV_H;
    R(x, shade(PAL.walk, -0.26), OX, 0, OW, OH);
    rng = makeRng(4412);
    for (let ty = 0; ty < OH; ty += 8)
      for (let tx = OX; tx < VW; tx += 8) {
        if (rng.chance(0.42)) R(x, shade(PAL.walk, -0.18), tx, ty, 7, 7);
        R(x, shade(PAL.walk, -0.32), tx, ty, 8, 1);
        R(x, shade(PAL.walk, -0.32), tx, ty, 1, 8);
      }
    R(x, PAL.ink, OX - 1, 0, 2, OH);
    const wy = 48, wh = 11, ox = OX + 47, ow = 40;
    const wall2 = (px, w2) => {
      R(x, PAL.ink, px, wy, w2, wh);
      R(x, shade(PAL.wallMd, -0.30), px, wy + 1, w2, wh - 2);
      R(x, shade(PAL.wallLt, -0.24), px, wy + 1, w2, 2);
      R(x, shade(PAL.wallDk, -0.24), px, wy + wh - 3, w2, 2);
    };
    wall2(OX, ox - OX); wall2(ox + ow, VW - (ox + ow));
    R(x, shade(PAL.ink, 0.05), ox, wy, ow, 4);
    R(x, PAL.ink, ox, wy + 4, ow, 8);
    R(x, STEEL_M, ox, wy + 5, ow, 5); R(x, STEEL_H, ox, wy + 5, ow, 2); R(x, STEEL_X, ox, wy + 10, ow, 2);
    R(x, 'rgba(12,8,20,0.30)', ox, wy + 12, ow, 4);
    for (const jx of [ox - 5, ox + ow]) {
      R(x, PAL.ink, jx, wy + wh, 5, 16);
      R(x, shade(PAL.wallMd, -0.34), jx + 1, wy + wh, 3, 15);
      R(x, shade(PAL.wallLt, -0.30), jx + 1, wy + wh, 1, 15);
      R(x, 'rgba(12,8,20,0.34)', jx + 4, wy + wh, 3, 15);
    }
    /* the door customers come in by, bottom right */
    R(x, shade(PAL.walk, -0.40), VW - 12, 80, 12, 24);
    R(x, shade(PAL.walk, -0.12), VW - 12, 80, 1, 24);

    /* steam table */
    R(x, STEEL_D, 0, 104, VW, 60);
    R(x, STEEL_H, 0, 104, VW, 1); R(x, STEEL_M, 0, 105, VW, 2); R(x, STEEL, 0, 107, VW, 1);
    for (let i = 0; i < VW; i += 3) R(x, shade(STEEL_D, 0.06), i, 108, 1, 53);
    R(x, STEEL, 0, 160, VW, 2); R(x, STEEL_H, 0, 160, VW, 1); R(x, STEEL_X, 0, 162, VW, 2);

    /* prep counter and the board -- warmth as an island */
    R(x, WOOD_H, 0, 164, VW, 3);
    R(x, shade(WOOD_L, -0.35), 0, 167, VW, 1);
    R(x, WOOD, 0, 168, VW, VH - 168);
    const BX = this.BX, BW = this.BW;
    R(x, PAL.ink, BX - 1, 170, BW + 2, VH - 172);
    R(x, PAL.dirt, BX, 171, BW, VH - 174);
    R(x, PAL.porch, BX, 171, BW, 2);
    R(x, PAL.dirtLo, BX, VH - 5, BW, 2);
    rng = makeRng(88);
    for (let i = 0; i < 70; i++) {
      const gy = 174 + rng.int(VH - 183), gx = BX + 2 + rng.int(BW - 14);
      const gw = Math.min(6 + rng.int(22), BX + BW - 2 - gx);
      R(x, rng.chance(0.5) ? shade(PAL.dirt, -0.13) : shade(PAL.dirt, 0.09), gx, gy, gw, 1);
    }
    x.globalAlpha = 0.20; R(x, PAL.ink, 0, VH - 7, VW, 7); x.globalAlpha = 1;
    return t.c;
  },

  draw(x, G) {
    x.drawImage(this.bg, 0, 0);
    this.drawRoom(x, G);
    for (let i = this.tickets.length - 1; i >= 0; i--) this.drawTicket(x, this.tickets[i], i === 0);
    this.drawLattice(x, G);
    this.drawPrep(x, G);
    this.drawCard(x, G);
    for (const p of this.pops) {
      x.globalAlpha = clamp(1.3 - p.t, 0, 1);
      textOut(x, p.s, p.x, p.y | 0, p.col, 1, 1);
      x.globalAlpha = 1;
    }
  },

  /* the dining room: everyone is Art.ped, the same people who walk the
     pavements in the driving half */
  drawRoom(x, G) {
    x.save();
    x.beginPath(); x.rect(this.OV_X + 1, 0, VW - this.OV_X - 1, this.OV_H); x.clip();
    const people = this.tickets.concat(this.queue).map((t) => t.cust).concat(this.walkers);
    people.sort((a, b) => a.y - b.y);
    for (const c of people) {
      const dx = c.x | 0, dy = c.y | 0;
      R(x, 'rgba(12,8,20,0.32)', dx + 1, dy + 12, 7, 3);
      x.drawImage(Art.ped[c.i % Art.ped.length][c.dir][c.f], dx, dy);
      if (G.winter) { R(x, PAL.bone, dx + 3, dy, 4, 1); }   // snow on the hat, winter
    }
    x.restore();

    /* the line is long and they are letting you know */
    if (this.queue.length && (G.time * 3 | 0) % 2) {
      const [sx, sy] = this.spot(this.tickets.length);
      textOut(x, '!', sx + 4, sy - 9, PAL.bad, 1, 1);
    }
  },

  drawTicket(x, t, active) {
    const w = this.TICKET_W, py = 5, h = 26 + t.items.length * 8 + 3, px = Math.round(t.x);
    const STEEL_X = PAL.road, STEEL_H = PAL.walkHi;
    const PAPER = shade(PAL.lineW, -0.13), PAPER_D = PAL.boneDim, INKDIM = shade(PAL.bone, -0.46);
    R(x, STEEL_X, px + 36, 3, 5, 5); R(x, STEEL_H, px + 37, 3, 3, 2);
    R(x, 'rgba(12,8,20,0.38)', px + 2, py + 2, w, h);
    R(x, PAL.ink, px, py, w, h);
    R(x, PAPER, px + 1, py + 1, w - 2, h - 2);
    R(x, PAPER_D, px + 1, py + h - 2, w - 2, 1);
    if (active) { x.strokeStyle = PAL.amber; x.lineWidth = 1; x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1); }
    text(x, String(t.n), px + w / 2, py + 4, PAL.ink, 2, 1);
    if (t.clean && active) this.star(x, px + w - 10, py + 4, PAL.amber, PAL.ink);
    R(x, PAL.ink, px + 3, py + 20, w - 6, 1);

    /* patience: the tip-decay bar's idiom, because it is the same thing */
    const pat = t.max ? clamp(t.tip / t.max, 0, 1) : 0;
    R(x, INKDIM, px + 3, py + 22, w - 6, 3);
    const pw = Math.round((w - 8) * pat);
    const hi = pat > 0.5 ? PAL.amber : pat > 0.22 ? '#e07a1f' : PAL.bad;
    R(x, hi, px + 4, py + 23, pw, 1); R(x, shade(hi, -0.32), px + 4, py + 24, pw, 1);

    const cur = active ? t.items.findIndex((it) => !it.wrapped) : -1;
    t.items.forEach((it, i) => {
      const ty = py + 27 + i * 8;
      const nm = it.def.ticket || it.def.name;
      if (i === cur) R(x, PAL.amber, px + 2, ty - 1, w - 4, 9);
      /* done reads as CROSSED OFF, not faded: still legible, struck the way
         a cook strikes a docket */
      text(x, nm, px + 3, ty, it.wrapped ? shade(PAL.bone, -0.40) : PAL.ink, 1);
      if (it.wrapped) R(x, PAL.ink, px + 2, ty + 3, textW(nm, 1) + 2, 1);
    });
  },

  drawLattice(x, G) {
    const { CELL_W, CELL_H, ROW_Y } = this;
    const it = this.item();
    const want = it && it.step < it.def.recipe.length ? it.def.recipe[it.step] : null;
    for (let i = 0; i < 12; i++) {
      const b = this.bins[i], c = (i % 6) + 1, r = (i / 6) | 0;
      const px = this.colX(c), py = ROW_Y[r];
      if (!b) { this.emptyBin(x, px, py); continue; }
      this.bin(x, px, py, b);
    }
    const SH = ROW_Y[1] + CELL_H - ROW_Y[0];
    this.station(x, this.colX(0), ROW_Y[0], SH, 'TORTILLA', this.left);
    this.station(x, this.colX(7), ROW_Y[0], SH, this.right[0] ? this.right[0].key : 'CHIPS', this.right);

    /* plates: the name exists only at the moment you touch the bin. Bone/green
       means that went in; red means it did not, and red HOLDS until the right
       pick (GDD IV rule 2). Flashing the plate rather than the contents is the
       reference's finding: TOMATO, SAUCE and CHILI are red already. */
    if (this.wrongKey) this.plate(x, this.wrongKey, PAL.bad, (G.time * 6 | 0) % 2 ? 1 : 0.7);
    if (this.flashT > 0 && this.flashKey && this.flashKey !== this.wrongKey) this.plate(x, this.flashKey, PAL.good, 1);
    if (this.hintT > 0 && want && (G.time * 5 | 0) % 2) this.plate(x, want, PAL.amber, 1);

    const r = this.cellRect(this.cur.c, this.cur.r, this.cur.z);
    this.cursor(x, r[0], r[1], r[2], r[3]);
  },

  cellRect(c, r, z) {
    const { CELL_W, CELL_H, ROW_Y } = this;
    const SH = ROW_Y[1] + CELL_H - ROW_Y[0];
    if (c === 0) {
      const n = this.left.length, zh = SH / n;
      return [this.colX(0), Math.round(ROW_Y[0] + z * zh), CELL_W, Math.round(zh)];
    }
    if (c === 7) return [this.colX(7), ROW_Y[0], CELL_W, SH];
    return [this.colX(c), ROW_Y[r], CELL_W, CELL_H];
  },

  plate(x, key, col, alpha) {
    const cell = this.cellOf(key);
    if (!cell) return;
    const [px, py, w] = this.cellRect(cell.c, cell.r, cell.z);
    const name = this.plateName(key);
    x.globalAlpha = alpha;
    R(x, PAL.ink, px + 1, py + 1, w - 2, 10);
    R(x, col, px + 1, py + 1, w - 2, 9);
    R(x, shade(col, -0.38), px + 1, py + 9, w - 2, 1);
    text(x, name, px + w / 2, py + 2, PAL.ink, 1, 1);
    x.globalAlpha = 1;
  },

  plateName(key) {
    for (const b of this.bins.concat(this.left, this.right)) if (b && b.key === key) return b.plate;
    return key.slice(0, 7);
  },

  bin(x, px, py, b) {
    const { CELL_W: w, CELL_H: h } = this;
    const baked = this.wells[b.key];
    R(x, PAL.roadLo, px, py, w, h);
    R(x, PAL.roadLo, px + 1, py + 1, w - 2, h - 2);
    R(x, PAL.walk, px + 1, py + 1, w - 2, 1);
    R(x, PAL.road, px + 2, py + 2, w - 4, h - 4);
    if (baked) x.drawImage(baked, px + ((w - baked.width) >> 1), py + ((h - baked.height) >> 1));
    else {
      const [m, hi, lo] = this.ING[b.key] || ['#888', '#aaa', '#666'];
      this.blob(x, px + w / 2, py + h - 6, 26, 12, m, hi, lo);
    }
  },

  emptyBin(x, px, py) {
    const { CELL_W: w, CELL_H: h } = this;
    const e = this.wells.EMPTY;
    if (e) { x.drawImage(e, px + ((w - e.width) >> 1), py + ((h - e.height) >> 1)); return; }
    R(x, PAL.roadLo, px, py, w, h);
    R(x, PAL.roadLo, px + 1, py + 1, w - 2, h - 2);
    R(x, PAL.walk, px + 1, py + 1, w - 2, 1);
    R(x, shade(PAL.road, -0.16), px + 2, py + 2, w - 4, h - 4);
  },

  station(x, px, py, h, key, list) {
    const w = this.CELL_W, baked = this.wells[key];
    if (baked) { x.drawImage(baked, px + ((w - baked.width) >> 1), py + ((h - baked.height) >> 1)); return; }
    R(x, PAL.roadLo, px, py, w, h);
    R(x, PAL.road, px + 2, py + 2, w - 4, h - 4);
    list.forEach((b, i) => {
      if (!b) return;
      const [m, hi, lo] = this.ING[b.key] || ['#ccc', '#eee', '#999'];
      const zh = h / list.length;
      this.blob(x, px + w / 2, py + zh * (i + 1) - 4, 30, Math.min(12, zh - 6), m, hi, lo);
    });
  },

  blob(x, cx, by, w, h, mid, hi, lo) {
    const hw = w / 2;
    for (let r = 0; r < h; r++) {
      const t = r / Math.max(1, h - 1);
      const half = Math.round(hw * Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t) * 0.86)));
      if (half < 1) continue;
      const y = by - h + 1 + r;
      R(x, PAL.ink, cx - half - 1, y, half * 2 + 2, 1);
      R(x, r < 2 ? hi : r > h - 3 ? lo : mid, cx - half, y, half * 2, 1);
    }
  },

  /* bone-free and fill-free: a frame at every corner, so it survives sitting
     over any colour of food (reference: "shape, not colour") */
  cursor(x, px, py, w, h) {
    R(x, PAL.ink, px - 2, py - 2, w + 4, 2); R(x, PAL.ink, px - 2, py + h, w + 4, 2);
    R(x, PAL.ink, px - 2, py - 2, 2, h + 4); R(x, PAL.ink, px + w, py - 2, 2, h + 4);
    x.strokeStyle = PAL.amber; x.lineWidth = 1;
    x.strokeRect(px - 1.5, py - 1.5, w + 3, h + 3);
    const k = Math.min(7, (h >> 1));
    for (const [cx, cy, dx, dy] of [[px - 2, py - 2, 1, 1], [px + w + 1, py - 2, -1, 1],
      [px - 2, py + h + 1, 1, -1], [px + w + 1, py + h + 1, -1, -1]]) {
      R(x, PAL.amber, cx - (dx < 0 ? k - 1 : 0), cy, k, 2);
      R(x, PAL.amber, cx, cy - (dy < 0 ? k - 1 : 0), 2, k);
    }
  },

  /* ---------------- BUILD PROGRESS --------------------------------- */
  drawPrep(x, G) {
    const t = this.focus(), it = this.item();
    const BX = this.BX, BW = this.BW;

    /* the item on the board: one frame of an item x stage sequence */
    if (t) {
      const shown = it || t.items[t.items.length - 1];
      const pic = this.pic(shown.def, it ? shown.step : shown.def.recipe.length, !it);
      x.drawImage(pic, BX + ((BW - pic.width) >> 1), 171 + ((VH - 174 - pic.height) >> 1));
      /* what this ticket has already produced, along the board's left edge */
      let wx = BX + 4;
      for (const w of t.items) if (w.wrapped) {
        R(x, PAL.ink, wx, 175, 11, 8); R(x, PAL.bone, wx + 1, 176, 9, 6);
        R(x, PAL.boneDim, wx + 1, 180, 9, 2); R(x, PAL.jade, wx + 4, 177, 3, 2);
        wx += 13;
      }
    }

    textOut(x, 'NOW BUILDING', 6, 172, PAL.boneDim, 1);
    if (!t) {
      textOut(x, 'WAITING', 6, 182, shade(PAL.bone, -0.3), 2);
      textOut(x, 'NO TICKETS UP', 6, 200, PAL.boneDim, 1);
    } else if (!it) {
      textOut(x, 'SEND IT', 6, 182, PAL.amber, 2);
      textOut(x, 'TICKET ' + t.n, 6, 200, PAL.amber, 1);
      textOut(x, 'ALL BAGGED', 60, 200, PAL.boneDim, 1);
    } else {
      const name = it.def.short || it.def.name;
      textOut(x, name, 6, 182, PAL.bone, 2);
      textOut(x, 'TICKET ' + t.n, 6, 200, PAL.amber, 1);
      const idx = t.items.indexOf(it) + 1, lab = 'ITEM ' + idx + ' OF ' + t.items.length;
      textOut(x, lab, 60, 200, PAL.boneDim, 1);
      this.star(x, 60 + textW(lab, 1) + 4, 200, it.clean ? PAL.bone : this.STAR_LOST, PAL.ink);
      /* pips right of the name, derived from its width -- build.mjs holds
         every Short name to 12*chars + 9*steps <= 127 so they clear the board */
      const lx = 6 + textW(name, 2) + 7, cy = 182 + 7 - (this.PIP_W >> 1);
      it.def.recipe.forEach((k, i) => {
        const px = lx + i * (this.PIP_W + this.PIP_G), w = this.PIP_W;
        if (i < it.step) {
          const col = (this.ING[k] || ['#ccc'])[0];
          R(x, PAL.ink, px, cy, w, w); R(x, col, px + 1, cy + 1, w - 2, w - 2);
          R(x, shade(col, 0.28), px + 1, cy + 1, w - 2, 1);
          R(x, shade(col, -0.32), px + 1, cy + w - 3, w - 2, 2);
        } else {
          R(x, '#2c2338', px, cy, w, w);
          x.strokeStyle = '#4a4058'; x.lineWidth = 1; x.strokeRect(px + 0.5, cy + 0.5, w - 1, w - 1);
        }
      });
    }

    /* WRAP IT! / SEND IT! -- one button, labelled with whichever comes next */
    const ready = it ? it.step >= it.def.recipe.length : !!t;
    this.button_(x, 321, 170, 59, VH - 172, it || !t ? ['WRAP', 'IT!'] : ['SEND', 'IT!'], ready, G);
  },

  button_(x, px, py, w, h, lines, ready, G) {
    const lit = ready && (G.time * 4 | 0) % 2 === 0;
    const STEEL = PAL.walkLo;
    R(x, PAL.ink, px, py, w, h);
    R(x, shade(STEEL, lit ? -0.08 : -0.24), px + 1, py + 1, w - 2, h - 2);
    R(x, shade(STEEL, -0.10), px + 1, py + 1, w - 2, 1);
    R(x, shade(STEEL, -0.42), px + 1, py + h - 2, w - 2, 1);
    const col = ready ? PAL.amber : '#7a6a4a';
    x.strokeStyle = col; x.lineWidth = 1;
    x.strokeRect(px + 2.5, py + 2.5, w - 5, h - 5);
    const k = 7;
    for (const [bx, by, dx, dy] of [[px + 2, py + 2, 1, 1], [px + w - 4, py + 2, -1, 1],
      [px + 2, py + h - 4, 1, -1], [px + w - 4, py + h - 4, -1, -1]]) {
      R(x, col, bx - (dx < 0 ? k - 2 : 0), by, k, 2);
      R(x, col, bx, by - (dy < 0 ? k - 2 : 0), 2, k);
    }
    textOut(x, lines[0], px + w / 2, py + 11, col, 2, 1);
    textOut(x, lines[1], px + w / 2, py + 26, col, 2, 1);
  },

  /* The driving shift's own clock card, third row STARS (GDD IV.F.1), and a
     fourth: SERVED against the target, with the streak. In the driving half
     those two sit under the card on the road; here that spot is the service
     window, where the customer being served stands, so they move inside. */
  drawCard(x, G) {
    const pw = 128, px0 = VW - pw + 1, ph = 54;
    R(x, 'rgba(10,6,16,0.50)', VW - pw - 1, 6, pw, ph);
    Hud.panel(x, VW - pw - 3, 3, pw, ph, '#6b5f84');
    text(x, 'SERVED', px0, 47, PAL.boneDim, 1);
    text(x, G.done + '/' + G.diff.target, VW - 7, 47, PAL.bone, 1, 2);
    if (G.combo > 1.001) text(x, 'X' + G.combo.toFixed(2), px0 + 44, 47, G.comboPop > 0 ? PAL.bone : PAL.amber, 1);
    text(x, 'SHIFT', px0, 8, PAL.boneDim, 1);
    const low = G.shift < 20;
    text(x, clockStr(G.shift), VW - 7, 5, low && (G.time * 4 | 0) % 2 ? PAL.bad : PAL.bone, 2, 2);
    text(x, 'PAID', px0, 23, PAL.boneDim, 1);
    text(x, money(G.earned), VW - 7, 20, PAL.good, 2, 2);
    text(x, 'STARS', px0, 37, PAL.boneDim, 1);
    const n = String(G.levelStars), nx = VW - 7 - textW(n, 1);
    this.star(x, nx - 10, 37, PAL.bone);
    text(x, n, VW - 7, 37, PAL.bone, 1, 2);
  },

  star(x, sx, sy, col, ink) {
    const S = this.STAR;
    const on = (i, j) => j >= 0 && j < 7 && i >= 0 && i < 7 && S[j][i] === '#';
    if (ink) for (let j = -1; j <= 7; j++) for (let i = -1; i <= 7; i++)
      if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) R(x, ink, sx + i, sy + j, 1, 1);
    for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) if (S[j][i] === '#') R(x, col, sx + i, sy + j, 1, 1);
  },

  /* ---------------- the item on the board -------------------------- */
  /* Drawn, then cached by item x stage: the frame only changes when a pip
     does. The shapes are the reference's -- the tilted-crescent shell that
     took five rewrites, the capsule burrito, the nachos plate -- with the
     ingredient layers scattered on in the order they went in, so a taco at
     step 2 visibly is not the same taco at step 4. */
  pic(def, step, done) {
    const key = def.name + '|' + step + '|' + (done ? 1 : 0);
    if (this.picCache[key]) return this.picCache[key];
    const t = mkCanvas(64, 42), x = t.x;
    const base = def.recipe[0], layers = def.recipe.slice(1, Math.max(1, step));
    const rng = makeRng(def.name.length * 131 + step * 17 + 7);
    const cx = 32, cy = 22;
    if (step === 0) {
      /* nothing yet: an empty board says "pick a base" better than any text */
    } else if (base === 'SHELL') this.picShell(x, cx, cy + 4, layers, rng);
    else if (base === 'CHIPS') this.picNachos(x, cx, cy + 10, layers, rng, done);
    else if (done) base === 'LARGE' ? this.picBurrito(x, cx, cy + 8, rng) : this.picSoft(x, cx, cy + 6, layers, rng);
    else this.picOpen(x, cx, cy, base === 'LARGE' ? 19 : 14, layers, rng);
    return (this.picCache[key] = t.c);
  },

  /* weighted toward the latest layer: what went on last is on top */
  layerCol(layers, rng) {
    if (!layers.length) return null;
    let i = layers.length - 1;
    while (i > 0 && rng() < 0.42) i--;
    const c = this.ING[layers[i]] || ['#ccc', '#eee', '#999'];
    return c[rng.chance(0.4) ? 1 : 0];
  },

  picShell(x, cx, cy, layers, rng) {
    const RR = 15, th = -0.32;
    const dxa = Math.cos(th), dya = Math.sin(th), nx = -Math.sin(th), ny = Math.cos(th);
    const [sm, sh, sl] = this.ING.SHELL;
    R(x, 'rgba(12,8,20,0.34)', cx - 11, cy + 14, 23, 3);
    const shellAt = (px, py, m) => Math.hypot(px, py) <= RR + m && px * nx + py * ny >= -0.5 - m;
    const fillAt = (px, py, m) => {
      if (!layers.length) return false;
      const along = px * dxa + py * dya, off = px * nx + py * ny;
      const deep = 1.5 + Math.min(7, 2 + layers.length * 1.4);
      return off < 1.5 + m && off > -deep - m && Math.abs(along) < RR - 1 + m;
    };
    for (let py = -RR - 10; py <= RR + 3; py++)
      for (let px = -RR - 3; px <= RR + 3; px++)
        if (shellAt(px, py, 1) || fillAt(px, py, 1)) R(x, PAL.ink, cx + px, cy + py, 1, 1);
    for (let py = -RR - 10; py <= RR + 3; py++)
      for (let px = -RR - 3; px <= RR + 3; px++) {
        const d = Math.hypot(px, py), off = px * nx + py * ny, along = px * dxa + py * dya;
        let col = null;
        if (shellAt(px, py, 0)) {
          col = d > RR - 2 ? sl : off < 3 ? sh : sm;
          if (d > RR - 4 && along > 3) col = sl;
          if (rng.chance(0.07)) col = sl;
        }
        if (fillAt(px, py, 0)) col = this.layerCol(layers, rng);
        if (col) R(x, col, cx + px, cy + py, 1, 1);
      }
  },

  /* a tortilla laid flat with the filling heaped down its middle -- the
     making_burrito reference, at board size */
  picOpen(x, cx, cy, r, layers, rng) {
    const [m, hi, lo] = this.ING.LARGE;
    R(x, 'rgba(12,8,20,0.30)', cx - r + 2, cy + r - 1, r * 2 - 2, 3);
    disc(x, cx, cy, r + 1, PAL.ink);
    disc(x, cx, cy, r, lo);
    disc(x, cx, cy - 1, r - 1, m);
    for (let i = 0; i < r * 3; i++) {
      const a = rng() * TAU, d = rng() * (r - 2);
      R(x, rng.chance(0.5) ? hi : '#b08a52', (cx + Math.cos(a) * d) | 0, (cy - 1 + Math.sin(a) * d) | 0, 1, 1);
    }
    if (!layers.length) return;
    const fw = r - 4, fh = Math.min(r - 6, 4 + layers.length);
    for (let py = -fh; py <= fh; py++)
      for (let px = -fw; px <= fw; px++) {
        if ((px * px) / (fw * fw) + (py * py) / (fh * fh) > 1) continue;
        R(x, this.layerCol(layers, rng), cx + px, cy + py, 1, 1);
      }
  },

  picBurrito(x, cx, by, rng) {
    const HW = 17, h = 16, py = by - h, mid = (h - 1) / 2;
    const TH = '#fff2c8', TU = '#f2dcac', TM = '#e8c894', TL = '#b08a52', TX = '#8a6a3c';
    const lean = (r) => Math.round((r - mid) * -0.40);
    const hwAt = (r) => Math.round(HW * Math.sqrt(Math.max(0, 1 - Math.pow(Math.abs((r - mid) / mid), 2.4))));
    R(x, 'rgba(12,8,20,0.34)', cx - HW + 2, by, HW * 2 - 4, 3);
    for (let r = 0; r < h; r++) {
      const hw = hwAt(r); if (hw < 1) continue;
      const y = py + r, o = cx + lean(r);
      R(x, PAL.ink, o - hw - 1, y, hw * 2 + 2, 1);
      R(x, r < 2 ? TH : r < 5 ? TU : r < h - 4 ? TM : TL, o - hw, y, hw * 2, 1);
      if (hw > 6) { R(x, r < 4 ? TU : TL, o - hw, y, 3, 1); R(x, r < 4 ? TU : TX, o + hw - 3, y, 3, 1); }
    }
    for (let r = 3; r < h - 2; r++) {
      const hw = hwAt(r), o = cx + lean(r);
      if (hw > 5) R(x, TL, o - hw + 5 + Math.round((r - 3) * 1.1), py + r, 2, 1);
    }
    for (let i = 0; i < 5; i++) {
      const r = 4 + rng.int(h - 9), hw = hwAt(r);
      if (hw > 8) R(x, TX, cx + lean(r) - hw + 7 + rng.int(hw * 2 - 14), py + r, 2, 1);
    }
  },

  /* a soft taco, folded: the crescent again, in tortilla rather than shell */
  picSoft(x, cx, cy, layers, rng) {
    const RR = 14, th = -0.20, nx = -Math.sin(th), ny = Math.cos(th);
    const [m, hi, lo] = this.ING.SMALL;
    R(x, 'rgba(12,8,20,0.34)', cx - 11, cy + 13, 23, 3);
    for (let py = -RR - 4; py <= RR + 2; py++)
      for (let px = -RR - 2; px <= RR + 2; px++) {
        const d = Math.hypot(px, py), off = px * nx + py * ny;
        if (d <= RR + 1 && off >= -4.5) R(x, PAL.ink, cx + px, cy + py, 1, 1);
      }
    for (let py = -RR - 4; py <= RR + 2; py++)
      for (let px = -RR - 2; px <= RR + 2; px++) {
        const d = Math.hypot(px, py), off = px * nx + py * ny;
        if (d > RR || off < -3.5) continue;
        let col = off < -0.5 ? this.layerCol(layers, rng) || m : d > RR - 2 ? lo : off < 3 ? hi : m;
        if (off >= -0.5 && rng.chance(0.06)) col = '#b08a52';
        R(x, col, cx + px, cy + py, 1, 1);
      }
  },

  picNachos(x, cx, by, layers, rng, done) {
    const [cm, ch, cl] = this.ING.CHIPS;
    disc(x, cx, by - 6, 17, PAL.ink);
    disc(x, cx, by - 6, 16, done ? '#d8d0b8' : PAL.bone);
    disc(x, cx, by - 7, 13, shade(PAL.bone, -0.12));
    for (let i = 0; i < 24; i++) {
      const a = rng() * TAU, r = rng() * 13;
      const px = (cx + Math.cos(a) * r) | 0, py = (by - 10 + Math.sin(a) * 6) | 0;
      const up = rng.chance(0.5);
      for (let k = 0; k < 4; k++) {
        const wq = 7 - k * 2, yy = py + (up ? k : 3 - k);
        R(x, PAL.ink, px + k - 1, yy, wq + 2, 1);
        R(x, k === 0 ? ch : k === 3 ? cl : cm, px + k, yy, wq, 1);
      }
    }
    for (let i = 0; i < 14 * layers.length; i++) {
      const a = rng() * TAU, r = rng() * 11;
      const px = (cx + Math.cos(a) * r) | 0, py = (by - 10 + Math.sin(a) * 5) | 0;
      R(x, this.layerCol(layers, rng), px, py, 2, 2);
    }
  },
};


/* ===== 75_demo.js ===== */
/* ============================================================
   DEMO  --  the attract-mode driver: the game plays itself
   ============================================================ */
'use strict';

/* Nothing here is scripted or faked. It sets the same throttle/steer/hb
   fields Player.control() would, so the demo car runs the real physics, the
   real collision response and the real traffic.

   It follows a LANE, not a list of points, and that distinction is the whole
   design. Nav.route is a list of intersection centres. Steering straight at
   the next one -- which is what this did for months -- fails twice over:

     - it cuts every corner, because from 190px out the aim point is on the
       far side of the junction, so the turn starts in the middle of the
       block and crosses the sidewalk;
     - it rides the centreline, because at that range an 8px lateral drift is
       a 2 degree correction, which the car never makes.

   Worse, Nav will not retire a node the car has driven past. Nav.recompute
   drops the head node when the car is closer to the SECOND node than the two
   nodes are to each other; on a straight that fires 12px past the node, but
   on a TURN the second node is perpendicular and a full PITCH away wherever
   the car is, so the head node is never dropped. Measured over 12 minutes of
   attract mode, the old driver spent 38.8% of its frames steering at a point
   BEHIND the car -- 85px behind on average, for up to 9 seconds at a stretch
   -- and 34.9% steering at a point closer than 24px, where atan2 swings
   wildly and clamp(err * 2.2) saturates the wheel. It was off the tarmac
   25.7% of the time.

   Retiring passed nodes on its own makes it WORSE (measured: 32.0% off the
   tarmac, grass time from 2.9% to 8.3%), because the node you advance to is
   around a corner and driving straight at it crosses the block. The two
   halves only work together: turn the route into a polyline of LANE centres
   -- via Traffic.laneFixed, the same right-hand-traffic rule the traffic
   itself obeys -- and pursue a point a short way along it.

   Note Player.update treats `throttle` as a SIGN, not a magnitude, so easing
   off is throttle 0 (coast) rather than a fraction. */
const Demo = {
  wedgeT: 0, esteer: 1, throwCd: 0, hold: false, path: [], pathKey: '',
  progX: 0, progY: 0, progT: 0,

  reset(p) {
    this.wedgeT = 0; this.esteer = 1; this.throwCd = 0; this.hold = false;
    this.path = []; this.pathKey = '';
    this.progX = p ? p.x : 0; this.progY = p ? p.y : 0; this.progT = 0;
  },

  /* ---- the route, as lane centres --------------------------
     A car travelling `dir` along a road sits at Traffic.laneFixed(perp, dir)
     on the cross axis, where `perp` is the index of the perpendicular road.
     Two consecutive legs are perpendicular, so their lane centrelines cross
     at exactly one point, and that crossing IS the corner to drive round.
     Left and right turns fall out of it with no special case -- the same
     trick Traffic uses for its own turns.

     Note what is deliberately NOT in the polyline: the node the car is
     sitting on. Corners are emitted between PAIRS of legs, so the first one
     lands on the next junction ahead, and the passed-node problem never
     arises for the body of the route. Only the head node needs handling, and
     it gets it below. */
  buildPath(p, G) {
    const r = Nav.route;
    // the head corner depends on which way the car is pointing, so the
    // cached path has to be invalidated when that changes, not just when
    // the route does
    const head = Math.abs(Math.cos(p.ang)) >= Math.abs(Math.sin(p.ang))
      ? (Math.cos(p.ang) >= 0 ? 'E' : 'W') : (Math.sin(p.ang) >= 0 ? 'S' : 'N');
    const key = r.map((n) => n[0] + ',' + n[1]).join('|') +
                '#' + head + (G.needPickup ? 'p' : '') +
                (G.order ? G.order.house.curb.x + ',' + G.order.house.curb.y : '');
    if (key === this.pathKey) return;
    this.pathKey = key;

    const end = G.needPickup ? City.shop.dock
              : G.order      ? G.order.house.curb
              :                Nav.goal;
    const pts = [];

    /* Built for EVERY route with a node in it, including the short ones and
       the arrival. The chain is axis-aligned end to end -- consecutive route
       nodes are adjacent, and a kerb is by construction on the street its
       own node sits on -- which is the property `aim` relies on to tell the
       along-lane axis from the lateral error. Skipping the build for short
       routes left a single far, diagonal point to project against, and the
       projection axis then came out of a coin toss. */
    if (r.length >= 1) {
      /* every leg of the route, plus a final one from the last node to the
         delivery kerb -- the kerb is up to half a block off the last node
         and can sit on a perpendicular street, which needs a corner too */
      const way = r.map((n) => ({ x: City.nodeX(n[0]), y: City.nodeY(n[1]) }));
      way.push({ x: end.x, y: end.y });
      const legs = [];
      for (let i = 0; i < way.length - 1; i++) {
        const a = way[i], b = way[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) continue;
        const horiz = Math.abs(dx) >= Math.abs(dy);
        const dir = horiz ? (dx >= 0 ? 0 : 2) : (dy >= 0 ? 1 : 3);
        const perp = horiz ? City.nearNodeY(a.y) : City.nearNodeX(a.x);
        legs.push({ horiz, fixed: Traffic.laneFixed(perp, dir) });
      }

      /* the turn at the head node itself. The body of the route is covered
         by leg pairs, but the first leg has no predecessor -- so a route
         that turns at the node the car is on or has just passed would have
         no corner at all, and the car would strike out diagonally across
         the block. The car's own lane is the missing predecessor. */
      if (legs.length) {
        const choriz = head === 'E' || head === 'W';
        if (choriz !== legs[0].horiz) {
          const cdir = head === 'E' ? 0 : head === 'S' ? 1 : head === 'W' ? 2 : 3;
          const cfix = Traffic.laneFixed(choriz ? City.nearNodeY(p.y) : City.nearNodeX(p.x), cdir);
          pts.push(choriz ? { x: legs[0].fixed, y: cfix } : { x: cfix, y: legs[0].fixed });
        }
      }
      for (let i = 0; i < legs.length - 1; i++) {
        const u = legs[i], v = legs[i + 1];
        if (u.horiz === v.horiz) continue;              // straight on, no corner
        pts.push(u.horiz ? { x: v.fixed, y: u.fixed } : { x: u.fixed, y: v.fixed });
      }
    }
    pts.push({ x: end.x, y: end.y });
    this.path = pts;
  },

  /* ---- pure pursuit along that polyline --------------------
     Retire anything already passed, project the car sideways onto the lane
     it is supposed to be in, then walk a short distance along the polyline
     and steer at where that lands. The projection is what carries lateral
     error into the steering: aiming at a point 190px away cannot see an 8px
     drift, aiming at one 40px away turns it into a 12 degree correction. */
  aim(p) {
    const path = this.path;
    if (!path.length) return null;

    /* Retire a corner only once the car is genuinely past it, measured ALONG
       THE LEG IT LEADS INTO — never against the car's nose. A nose test looks
       right and is catastrophically wrong: the corner you are about to turn
       onto sits square to your heading, so its dot product with the nose is
       negative and the test throws away the very waypoint you were braking
       for. The path then collapses to the delivery kerb, which can be most of
       the map away and diagonal, and the car drives at it in a straight line.
       That single sign was worth 6 points of off-tarmac time on its own. */
    while (path.length > 1) {
      const w = path[0], n = path[1];
      const len = hyp(n.x - w.x, n.y - w.y) || 1;
      const ux = (n.x - w.x) / len, uy = (n.y - w.y) / len;
      const along = (p.x - w.x) * ux + (p.y - w.y) * uy;
      // ...and it must be ON that leg, not merely level with it. Distance
      // along alone is not enough: sitting 7px off-centre in a 16px lane
      // reads as 7px "past" a corner still 80px up the road, and retires it.
      const lateral = Math.abs((p.x - w.x) * -uy + (p.y - w.y) * ux);
      if ((along > 6 && lateral < 24) || hyp(w.x - p.x, w.y - p.y) < 14) path.shift();
      else break;
    }

    const first = path[0];
    const dx = first.x - p.x, dy = first.y - p.y;
    // close in -- and on the last approach to the kerb -- just go to it.
    // Projecting onto a lane makes no sense once the car is on top of it.
    if (hyp(dx, dy) < 40) return first;

    /* Legs are axis-aligned and `first` sits on the current leg's lane
       centreline, so projecting the car onto that centreline is just taking
       one coordinate from each. No need to re-derive laneFixed here. */
    const horiz = Math.abs(dx) >= Math.abs(dy);
    let cx = horiz ? p.x : first.x;
    let cy = horiz ? first.y : p.y;

    /* Lookahead has to stay near the car's own turning radius. Pure pursuit
       cuts a corner by roughly its lookahead, and the carriageway is only
       32px wide, so the 26 + speed * 0.34 this started life with (38px at
       the speed floor, 65px at the cap) put the car on the pavement at every
       junction -- measurably worse than the naive driver it replaced. At the
       corner speed the governor below enforces, the radius is ~24px. */
    let rem = 18 + p.speed * 0.20;                      // ~25px slow, ~40px fast
    for (let i = 0; i < path.length; i++) {
      const t = path[i];
      const d = hyp(t.x - cx, t.y - cy);
      if (d < 0.001) continue;
      if (d >= rem || i === path.length - 1) {
        const s = Math.min(rem, d) / d;
        return { x: cx + (t.x - cx) * s, y: cy + (t.y - cy) * s };
      }
      rem -= d; cx = t.x; cy = t.y;
    }
    return path[path.length - 1];
  },

  drive(dt, G) {
    const p = G.player;
    if (p.spinT > 0) { p.throttle = 0; p.steer = 0; p.hb = false; return; }
    if (!Nav.goal) { p.throttle = 0; p.steer = 0; p.hb = false; return; }

    this.buildPath(p, G);
    const a = this.aim(p);
    let tx = a ? a.x : Nav.goal.x, ty = a ? a.y : Nav.goal.y;

    // Off the street, getting back on it beats making progress. This must use
    // classify(), NOT surfaceAt(): parking lots and shop aprons are surfaced
    // S_ROAD, so a surface test lets the car cut across lots full of solid
    // parked cars. Suspended near the target, since the shop's own dock is on
    // an apron rather than a street.
    const onStreet = (wx, wy) => {
      const c = classify((wx / TS) | 0, (wy / TS) | 0);
      return c === T_ROAD || c === T_INTER;
    };
    const goal = this.path.length ? this.path[this.path.length - 1] : Nav.goal;
    const off = hyp(goal.x - p.x, goal.y - p.y) > 70 && !onStreet(p.x, p.y);
    if (off) {
      /* Head for the nearest CARRIAGEWAY, not the nearest junction. A junction
         is up to half a block away on BOTH axes, and the straight line to it
         runs diagonally through the middle of the block — houses, fences,
         parked cars — so aiming at one turns a clipped kerb into a car
         grinding across a back garden. Measured: 74% of the frames the demo
         spends slow under power are off the carriageway and two thirds of
         those are genuinely blocked. The nearest road is perpendicular, never
         more than half a block, and the way it came in. */
      const rx = City.nodeX(City.nearNodeX(p.x)), ry = City.nodeY(City.nearNodeY(p.y));
      if (Math.abs(rx - p.x) < Math.abs(ry - p.y)) { tx = rx; ty = p.y; }
      else                                         { tx = p.x; ty = ry; }
    }
    let want = Math.atan2(ty - p.y, tx - p.x);

    /* ---- crude obstacle probe, same shape as the cop's ---- */
    // trafficBlocked, not City.isSolid: the baked map has no cars in it, so a
    // probe on geometry alone drives into the back of the one that does move.
    // Lookahead scales with speed — a fixed 34px is only 0.3s of warning at
    // cruise, which is not enough to steer around a hydrant before clipping
    // it. The two splayed feelers catch corners the centre ray misses.
    //
    // It BIASES the pursuit heading rather than replacing it. The old version
    // overwrote `want` with p.ang +- 1.2 rad, a 69 degree swing off whatever
    // the car was doing, which regularly pointed it clean off the carriageway
    // and was the start of a fifth of the mid-block excursions. Blending
    // keeps the lane in the answer: enough to miss a hydrant, not enough to
    // leave the road.
    const probe = (a2, d) => trafficBlocked(p.x + Math.cos(a2) * d, p.y + Math.sin(a2) * d, G);
    const look = 22 + p.speed * 0.28;
    if (probe(p.ang, look) || probe(p.ang + 0.25, look * 0.8) || probe(p.ang - 0.25, look * 0.8)) {
      const l = probe(p.ang - 0.7, 30), r = probe(p.ang + 0.7, 30);
      const swing = l && !r ? 0.9 : r && !l ? -0.9 : 1.2;
      want = p.ang + clamp(angDiff(p.ang, want) + swing, -1.2, 1.2);
    }

    const err = angDiff(p.ang, want);
    p.steer = clamp(err * 2.2, -1, 1);
    p.hb = false;

    // Coast through hard turns and on the approach — throw spread scales with
    // speed, so arriving slowly is what lands the tosses. The speed floor is
    // essential, not a refinement: Player.update scales steering by speed, so
    // a stopped car cannot turn. Cut the throttle while pointed the wrong way
    // and it coasts to a halt, unable to steer, stuck for good. The floor also
    // means it never fully stops at the kerb, so it can always drive away.
    // Cruise between a floor and a cap rather than slowing at the target.
    // Slowing near the kerb made it orbit the point at walking pace and drift
    // into the yard; a real delivery driver throws on the move. The cap keeps
    // throw spread (speed/MAXSPD * 22) under ~14px against a 28px porch.
    //
    // And it slows FOR the corner rather than during it. The turn radius is
    // speed / (TURNRATE * (1 - 0.28 * speed / MAXSPD)): ~37px at 100 but
    // ~24px at 70. Worked against a 32px carriageway, a right turn — the
    // tight one, here as in life — only stays on the tarmac below about 70.
    // Left turns have room to spare. Cornering at the 115 cruise cap is what
    // put the lane-following driver on the pavement more often than the
    // naive one it replaced; no aim point can fix a speed the car cannot
    // turn at. Coast early, brake late, and only for a real corner — path[0]
    // is a corner whenever something follows it, since the last point is
    // always the destination.
    const corner = this.path.length > 1 ? hyp(this.path[0].x - p.x, this.path[0].y - p.y) : 1e9;
    p.throttle = p.speed < 34 ? 1
               : (off && p.speed > 55) ? 0
               : (Math.abs(err) > 1.2 || p.speed > 115) ? 0
               : (corner < 30 && p.speed > 82) ? -1
               : (corner < 64 && p.speed > 70) ? 0 : 1;

    /* ---- hold at a closed crossing ----
       The demo plays by the same rules as a player, which includes being
       allowed to run a gate. It should not: the attract loop showing the car
       flattened by a train reads as the game being broken, not as a hazard.

       Latched, deliberately. The test that STARTS the hold needs a direction
       of travel, and a stopped car has none — so unlatched it stops, stops
       detecting, creeps forward again under the speed floor above, and jitters
       into the gate instead of waiting behind it. */
    if (G.crossings) {
      let near = null;
      for (const c of G.crossings)
        if (Math.abs(c.x - p.x) < 34 && Math.abs(c.y - p.y) < 130) { near = c; break; }
      if (!near || !near.down) this.hold = false;
      else if (this.hold || (City.railY - p.y) * sign(p.vy || (ty - p.y)) > 24) this.hold = true;
      if (this.hold) {
        // brake to a stop, then coast. Never reverse: the road behind is live.
        p.throttle = p.fwdSpeed > 10 ? -1 : 0;
        p.steer = 0; p.hb = false;
        this.wedgeT = 0;                    // waiting is not wedging
      }
    }

    /* ---- toss once the porch is in range ---- */
    this.throwCd -= dt;
    if (G.order && !G.needPickup) {
      const r = G.order.house.porch;
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      G.demoAim = { x: cx, y: cy };          // the reticle tracks the porch
      if (this.throwCd <= 0 && G.bag > 0 && hyp(cx - p.x, cy - p.y) < MAXTHROW * 0.8) {
        G.tryThrow();
        this.throwCd = 1.4;
      }
    }

    /* ---- wedge recovery ----
       A car under power that is not moving is jammed against geometry, and it
       cannot steer out because steering needs speed. Back out first; if that
       fails too, put it back on a road. In a city this full of props there is
       always a corner reversing cannot escape, so the hard reset has to exist. */
    /* Judged on PROGRESS over half a second, not on speed in a single frame.
       Both of the obvious per-frame signals fail here, and each failed for its
       own reason:

         - `speed < 20` misses the commonest case outright. A car grinding
           along a fence reads 21-29 and never trips it. Worse, when it does
           trip, any single frame that ticks over 20 decays the accumulator
           again, so a jiggling car oscillates below the threshold forever and
           the 2.5s hard reset never fires. One traced excursion ran 8.8s that
           way, creeping backwards along a wall the whole time. The defect is
           the ratchet, not the number.
         - `carBlocked` looked like the honest question — under power and
           refused by collision — but measured, it is never sustained on any
           build: 1.0% of frames, longest run 0.12s, because Player.update
           calls unwedge() every frame and depenetrates. It catches contact,
           not entrapment.

       Net displacement over a window catches what both miss, because a car
       that is genuinely stuck is not going anywhere by definition, whatever
       its speedometer says or whoever it is touching. Suspended near the
       target, where circling the dock is the job rather than a fault — the
       same exemption the off-street test above uses.

       20px in half a second is 40px/s, against a cruise of 70-115 and the
       traced grinder's 22, and the bar was swept rather than picked. It is the
       knee: every teleport is a visible jump, so a bar set too low buys nothing
       and one set too high buys jumps. Over twenty minutes, entrapments longer
       than four seconds against hard resets — 50px/s: 10 and 44. 40px/s: 7 and
       25. 30px/s: 9 and 14, but the worst grind climbs back to 14.9s. Against
       the speed test this replaced: 41 and 9. So this trades sixteen extra
       teleports for five sixths of the long entrapments, and halves the worst
       one from 16.8s to 9.1s, while off-tarmac time and deliveries both stay
       where they were. */
    this.progT += dt;
    if (this.progT >= 0.5) {
      const moved = hyp(p.x - this.progX, p.y - this.progY);
      const busy = hyp(goal.x - p.x, goal.y - p.y) < 70;
      if (moved < 20 && !busy) this.wedgeT += 0.5;
      // Decay matches the accumulation rate, and that symmetry was measured
      // rather than assumed. Halving it -- which is what the old per-frame
      // version did -- shortens the worst grind further, 11.3s to 7.2s, but
      // quadruples the hard resets, 10 to 47 over twenty minutes. A hard reset
      // teleports the car to the nearest junction, so that is one visible
      // disappearance every 25 seconds of attract mode, which is a worse thing
      // to watch than the grind it prevents.
      else this.wedgeT = Math.max(0, this.wedgeT - 0.5);
      this.progX = p.x; this.progY = p.y; this.progT = 0;
    }
    if (this.wedgeT > 1.2) { p.throttle = -1; p.steer = this.esteer; }
    if (this.wedgeT > 2.5) {
      p.x = City.nodeX(City.nearNodeX(p.x));
      p.y = City.nodeY(City.nearNodeY(p.y));
      p.vx = p.vy = 0;
      this.wedgeT = 0; this.esteer = -this.esteer;
      this.pathKey = '';                    // the teleport invalidates the path
      // and it is not progress: re-mark, or the jump counts as 190px of it
      this.progX = p.x; this.progY = p.y; this.progT = 0;
    }
  },
};


/* ===== 78_scores.js ===== */
/* ============================================================
   SCORES  --  the high-score board: factory content, storage, ranking
   ============================================================ */
'use strict';

/* Model only. Scores never touches a canvas and G never touches storage; the
   board is drawn by overlayScores/overlayEntry in 80_game.js. */

const SCORE_MAX = 10;                                 // places on the board
const INI_LEN = 3;                                    // characters in a set of initials
const INI_ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ ';      // 27, wraps both ways

const Scores = {
  KEY: 'tacoshop.scores.v1',
  board: [],
  stored: false,                    // did a stored board actually load this session?

  /* Storage is wrapped because reading it can THROW, not merely fail: Chrome
     treats a file:// page as an opaque origin and raises SecurityError on
     touch, and taco-shop.html is meant to be opened exactly that way. The
     headless harness has no localStorage at all and exercises the same path.
     A board that lives only in memory is a small loss; a game that will not
     boot from a file:// page is a total one. */
  _read() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return null;
      return localStorage.getItem(this.KEY);
    } catch (e) { return null; }
  },
  _write(s) {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return false;
      localStorage.setItem(this.KEY, s);
      return true;
    } catch (e) { return false; }    // opaque origin, quota, or private mode
  },

  factory() {
    return SCORES.board.map((e) => ({ ini: String(e.ini).toUpperCase().slice(0, INI_LEN), cents: e.cents | 0 }));
  },

  valid(v) {
    return Array.isArray(v) && v.length > 0 && v.length <= SCORE_MAX &&
      v.every((e) => e && typeof e === 'object' &&
        typeof e.ini === 'string' && e.ini.length === INI_LEN &&
        Number.isInteger(e.cents) && e.cents >= 0);
  },

  /* Anything unexpected in storage is DISCARDED in favour of the factory
     board rather than repaired — a half-understood board is worse than a
     known one, and there is nothing here worth salvaging. */
  load() {
    this.board = this.factory();
    this.stored = false;
    const raw = this._read();
    if (raw) {
      let v = null;
      try { v = JSON.parse(raw); } catch (e) { v = null; }
      if (this.valid(v)) {
        this.board = v.map((e) => ({ ini: e.ini.toUpperCase(), cents: e.cents }));
        this.stored = true;
      }
    }
    this.sort();
    return this.board;
  },

  sort() {
    this.board.sort((a, b) => b.cents - a.cents);
    if (this.board.length > SCORE_MAX) this.board.length = SCORE_MAX;
  },

  save() { return this._write(JSON.stringify(this.board)); },

  lowest() { return this.board.length ? this.board[this.board.length - 1].cents : 0; },

  /* A shift that took nothing never places, however empty the board is. */
  qualifies(cents) {
    if (!(cents > 0)) return false;
    if (this.board.length < SCORE_MAX) return true;
    return cents > this.board[SCORE_MAX - 1].cents;
  },

  /* Returns the index it landed at, or -1 if it did not place. Ties go BELOW
     the incumbent: matching a score does not displace whoever got there first. */
  insert(ini, cents) {
    if (!this.qualifies(cents)) return -1;
    const e = { ini: String(ini).toUpperCase().slice(0, INI_LEN), cents: cents | 0 };
    let i = 0;
    while (i < this.board.length && this.board[i].cents >= e.cents) i++;
    this.board.splice(i, 0, e);
    if (this.board.length > SCORE_MAX) this.board.length = SCORE_MAX;
    this.save();
    return i;
  },
};


/* ===== 80_game.js ===== */
/* ============================================================
   TACO SHOP: CARNAGE ASADA  --  the run, both shifts, render pipeline
   ============================================================

   A run is twenty levels that alternate the Delivery Shift and the Kitchen
   Shift (content/levels.json). Every level is a checkpoint race: reach the
   target (15, or 9 on Supreme) before the clock reaches 0:00. Time comes only
   from the starting clock and the extensions every third completion earns
   (GDD II.D, difficulty.md, owner ruling 2026-10-25 "every 3 completed").

   The score is the money across every level played -- G.earned, for the whole
   run. Each level also keeps levelEarned for its clear card. Stars are a
   report card, never money and never on the board.

   Flow:  title -> mode select -> level card -> shift -> LEVEL CLEAR -> ...
          0:00 -> GAME OVER -> initials if it places -> CONTINUE? 10s
          level 20 cleared -> victory -> initials if it places -> board
*/
'use strict';

const HEAT_MAX = 100;
const BAG_MAX = 3;
const RAIL_EJECT = 52;      // px from the corridor centre a wreck throws you
const THROW_CD = 0.34;
const PERFECT_BONUS = 500;  // difficulty.md: a perfect delivery, +$5.00
const CLEAN_BONUS = 500;    // difficulty.md: a clean ticket, +$5.00
const CONTINUE_SECS = 10;   // GDD II.F

/* Used only if content/difficulty.json fails to load, so a broken content
   file can never blank the game. build.mjs validates the real thing. */
const DIFF_FALLBACK = {
  start: 180, extend: 90, maxExt: 5, target: 15,
  tipStart: 2000, tipFloor: 200, tipDecay: 100 / 3,
  fines: { ticket: 500, ped: 200, train: 500, remake: 150 },
