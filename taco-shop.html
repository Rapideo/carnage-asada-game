<script>

/* ===== 00_core.js ===== */
/* ============================================================
   TACO SHOP: CARNAGE ASADA  --  core constants, math, rng, input
   ============================================================ */
'use strict';

/* ---- virtual screen -------------------------------------- */
const VW = 384, VH = 216;

/* ---- world grid ------------------------------------------ */
const TS      = 16;   // tile size in px
const BORDER  = 2;    // tiles of sea wall / water around the grid
const BLOCKS  = 8;    // city blocks per axis
const SPAN    = 12;   // tiles per block pitch (2 road + 10 interior)
const GW      = BORDER * 2 + BLOCKS * SPAN + 2;   // 102 tiles
const GH      = GW;
const WW      = GW * TS;                          // 1632 px
const WH      = GH * TS;

/* ---- tile classes ---------------------------------------- */
const T_SEA = 0, T_ROAD = 1, T_INTER = 2, T_WALK = 3, T_LOT = 4;

/* ---- surfaces (drive feel) ------------------------------- */
const S_ROAD = 0, S_WALK = 1, S_GRASS = 2, S_SEA = 3;

/* ---- palette --------------------------------------------- */
const PAL = {
  void:    '#1b1425',
  sea:     '#1d3f5e',
  seaLite: '#2a5c82',
  seaFoam: '#7fb6cf',
  wall:    '#5a5266',
  wallLo:  '#3c3648',

  road:    '#4b4f63',
  roadLo:  '#43475a',
  roadHi:  '#565b70',
  lineY:   '#e8b93c',
  lineW:   '#c9cede',

  walk:    '#8b8f9f',
  walkHi:  '#9ba0b0',
  walkLo:  '#75798a',
  curb:    '#6a6e80',

  grass:   '#4a8b3f',
  grassHi: '#5aa14c',
  grassLo: '#3d7534',
  dirt:    '#a8815c',
  dirtLo:  '#8a6849',

  roofA:   '#c05138', roofAlo: '#943d2b',
  roofB:   '#4a6fa5', roofBlo: '#385580',
  roofC:   '#5d8a4f', roofClo: '#466b3b',
  roofD:   '#7a6f86', roofDlo: '#5d5468',
  roofE:   '#b8933f', roofElo: '#8e7130',
  roofF:   '#3f8a8a', roofFlo: '#2f6a6a',

  wallLt:  '#e0d2b4', wallMd: '#c4b394', wallDk: '#8e7f66',
  glass:   '#3a4a63', glassHi: '#5b7194',
  door:    '#6b4630', doorHi: '#8a5c3e',
  porch:   '#d8c69c',

  tree:    '#2f6b39', treeHi: '#3e8a47', treeLo: '#204a28',
  trunk:   '#5b4029',

  red:     '#e8452c',
  amber:   '#ffb01f',
  cyan:    '#3fb8b0',
  cyanLo:  '#2a8079',

  /* brand colours, from the shop's badge. Deliberately NOT part of the
     in-game semantic set: jade reads too close to cyan, and letting it onto

     These belong on the title badge and the shop's signage, nowhere else. */

  bad:     '#ff5a5a',

  siren2:  '#3d7dff',

const CAR_COLORS = [
  ['#d94f4f', '#9e3535'], ['#4a8fd0', '#316396'], ['#e3c04a', '#a88a2e'],
  ['#63b05a', '#437a3c'], ['#d8d8e0', '#a2a2b0'], ['#8a5fc0', '#634289'],
  ['#e08a3c', '#a35f26'], ['#3f3f4e', '#2a2a35'],
];

/* ---- math ------------------------------------------------ */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = Math.sign;
const hyp   = Math.hypot;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function approach(v, t, s) { return v < t ? Math.min(v + s, t) : Math.max(v - s, t); }

/* ---- deterministic rng ----------------------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed);
  r.int   = (n) => (r() * n) | 0;
  r.range = (a, b) => a + r() * (b - a);
  r.pick  = (arr) => arr[(r() * arr.length) | 0];
  r.chance = (p) => r() < p;
  return r;
}

/* ---- tile classification --------------------------------- */
const SPANEND = BLOCKS * SPAN + 1;           // 97
function classify(tx, ty) {
  const ax = tx - BORDER, ay = ty - BORDER;
  if (ax < 0 || ay < 0 || ax > SPANEND || ay > SPANEND) return T_SEA;
  const rx = (ax % SPAN) < 2, ry = (ay % SPAN) < 2;
  if (rx && ry) return T_INTER;
  if (rx || ry) return T_ROAD;
  const lx = ax % SPAN - 2, ly = ay % SPAN - 2;   // 0..9
  if (lx === 0 || lx === 9 || ly === 0 || ly === 9) return T_WALK;
  return T_LOT;
}

/* ---- canvas helpers -------------------------------------- */
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
}
function R(x, col, a, b, w, h) { x.fillStyle = col; x.fillRect(a | 0, b | 0, w | 0, h | 0); }

/* ---- input ----------------------------------------------- */
const Input = {
  down: Object.create(null),
  hit:  Object.create(null),
  mx: VW / 2, my: VH / 2,      // virtual-screen coords
  mdown: false, mhit: false,
  hasMouse: false,
  anyKey: false,

  init(canvas, getScale) {
    // track e.code (physical key, so WASD still works on AZERTY) and also
    // e.key, so Enter/Space register whatever the layout or IME reports
    const codes = (e) => (e.key && e.key.length > 1 && e.key !== e.code) ? [e.code, e.key] : [e.code];
    addEventListener('keydown', (e) => {
      for (const k of codes(e)) { if (!this.down[k]) this.hit[k] = true; this.down[k] = true; }
      this.anyKey = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => { for (const k of codes(e)) this.down[k] = false; });
    addEventListener('blur', () => { this.down = Object.create(null); this.mdown = false; });

    // derive the scale from the element itself so aiming stays exact
    // whatever rounding the fit logic applied
    const toVirtual = (e) => {
      const r = canvas.getBoundingClientRect();
      const s = r.width ? r.width / VW : (getScale() || 1);
      this.mx = clamp((e.clientX - r.left) / s, 0, VW);
      this.my = clamp((e.clientY - r.top) / s, 0, VH);
    };
    canvas.addEventListener('mousemove', (e) => { toVirtual(e); this.hasMouse = true; });
    canvas.addEventListener('mousedown', (e) => {
      toVirtual(e); if (!this.mdown) this.mhit = true;
      this.mdown = true; this.hasMouse = true; e.preventDefault();
    });
    addEventListener('mouseup', () => { this.mdown = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  k(...codes) { return codes.some((c) => this.down[c]); },
  p(...codes) { return codes.some((c) => this.hit[c]); },
  endFrame() { this.hit = Object.create(null); this.mhit = false; this.anyKey = false; },
};


/* ===== 10_font.js ===== */
/* ============================================================
   5x7 bitmap font  --  hand authored, parsed once at boot
   ============================================================ */
'use strict';

const FONT_SRC = {
  'A': '01110,10001,10001,11111,10001,10001,10001',
  'B': '11110,10001,10001,11110,10001,10001,11110',
  'C': '01111,10000,10000,10000,10000,10000,01111',
  'D': '11110,10001,10001,10001,10001,10001,11110',
  'E': '11111,10000,10000,11110,10000,10000,11111',
  'F': '11111,10000,10000,11110,10000,10000,10000',
  'G': '01111,10000,10000,10111,10001,10001,01111',
  'H': '10001,10001,10001,11111,10001,10001,10001',
  'I': '11111,00100,00100,00100,00100,00100,11111',
  'J': '00111,00010,00010,00010,00010,10010,01100',
  'K': '10001,10010,10100,11000,10100,10010,10001',
  'L': '10000,10000,10000,10000,10000,10000,11111',
  'M': '10001,11011,10101,10101,10001,10001,10001',
  'N': '10001,11001,10101,10011,10001,10001,10001',
  'O': '01110,10001,10001,10001,10001,10001,01110',
  'P': '11110,10001,10001,11110,10000,10000,10000',
  'Q': '01110,10001,10001,10001,10101,10010,01101',
  'R': '11110,10001,10001,11110,10100,10010,10001',
  'S': '01111,10000,10000,01110,00001,00001,11110',
  'T': '11111,00100,00100,00100,00100,00100,00100',
  'U': '10001,10001,10001,10001,10001,10001,01110',
  'V': '10001,10001,10001,10001,10001,01010,00100',
  'W': '10001,10001,10001,10101,10101,11011,10001',
  'X': '10001,10001,01010,00100,01010,10001,10001',
  'Y': '10001,10001,01010,00100,00100,00100,00100',
  'Z': '11111,00001,00010,00100,01000,10000,11111',
  '0': '01110,10001,10011,10101,11001,10001,01110',
  '1': '00100,01100,00100,00100,00100,00100,01110',
  '2': '01110,10001,00001,00010,00100,01000,11111',
  '3': '11111,00010,00100,00010,00001,10001,01110',
  '4': '00010,00110,01010,10010,11111,00010,00010',
  '5': '11111,10000,11110,00001,00001,10001,01110',
  '6': '00110,01000,10000,11110,10001,10001,01110',
  '7': '11111,00001,00010,00100,01000,01000,01000',
  '8': '01110,10001,10001,01110,10001,10001,01110',
  '9': '01110,10001,10001,01111,00001,00010,01100',
  ' ': '00000,00000,00000,00000,00000,00000,00000',
  '.': '00000,00000,00000,00000,00000,01100,01100',

  '-': '00000,00000,00000,11111,00000,00000,00000',

  '/': '00001,00010,00010,00100,01000,01000,10000',
  '\\':'10000,01000,01000,00100,00010,00010,00001',
  '%': '11001,11010,00010,00100,01000,01011,10011',
  '#': '01010,01010,11111,01010,11111,01010,01010',
  '(': '00010,00100,01000,01000,01000,00100,00010',
  ')': '01000,00100,00010,00010,00010,00100,01000',
  '[': '01110,01000,01000,01000,01000,01000,01110',
  ']': '01110,00010,00010,00010,00010,00010,01110',
  '*': '00000,10101,01110,11111,01110,10101,00000',
  '=': '00000,00000,11111,00000,11111,00000,00000',
  '<': '00010,00100,01000,10000,01000,00100,00010',
  '>': '01000,00100,00010,00001,00010,00100,01000',
  "'": '00100,00100,00100,00000,00000,00000,00000',
  '"': '01010,01010,01010,00000,00000,00000,00000',
  '_': '00000,00000,00000,00000,00000,00000,11111',
  '&': '01100,10010,10100,01000,10101,10010,01101',
  '@': '01110,10001,10111,10101,10111,10000,01110',
  '^': '00100,01010,10001,00000,00000,00000,00000',
  '~': '00000,00000,01001,10110,00000,00000,00000',
};

const FW = 5, FH = 7;
const GLYPH = Object.create(null);
for (const ch in FONT_SRC) {
  const rows = FONT_SRC[ch].split(',');
  const bits = [];
  for (let y = 0; y < FH; y++) {
    const r = rows[y] || '00000';
    for (let x = 0; x < FW; x++) if (r[x] === '1') bits.push(x, y);
  }
  GLYPH[ch] = bits;
}

/** width of a string in px at a given scale (1px letter gap) */
function textW(str, s = 1) { return str.length ? (str.length * (FW + 1) - 1) * s : 0; }

/**
 * Draw pixel text. `align`: 0=left 1=center 2=right.
 */
function text(x, str, px, py, col, s = 1, align = 0, shadow = null) {
  str = String(str).toUpperCase();
  let ox = px | 0;
  if (align === 1) ox = (px - textW(str, s) / 2) | 0;
  else if (align === 2) ox = (px - textW(str, s)) | 0;
  const oy = py | 0;

  if (shadow) drawRun(x, str, ox + s, oy + s, shadow, s);
  drawRun(x, str, ox, oy, col, s);
  return ox;
}

function drawRun(x, str, ox, oy, col, s) {
  x.fillStyle = col;
  let cx = ox;
  for (let i = 0; i < str.length; i++) {
    const g = GLYPH[str[i]];
    if (g) for (let b = 0; b < g.length; b += 2) x.fillRect(cx + g[b] * s, oy + g[b + 1] * s, s, s);
    cx += (FW + 1) * s;
  }
}

/** text with a 1px outline in every direction — for HUD over busy ground */
function textOut(x, str, px, py, col, s = 1, align = 0, oc = PAL.ink) {
  str = String(str).toUpperCase();
  let ox = px | 0;
  if (align === 1) ox = (px - textW(str, s) / 2) | 0;
  else if (align === 2) ox = (px - textW(str, s)) | 0;
  for (let dy = -s; dy <= s; dy += s)
    for (let dx = -s; dx <= s; dx += s)
      if (dx || dy) drawRun(x, str, ox + dx, py + dy, oc, s);
  drawRun(x, str, ox, py, col, s);
  return ox;
}

/** money formatter: 1234 cents -> "$12.34" */
function money(cents) {
  const neg = cents < 0; cents = Math.abs(Math.round(cents));
  const s = '$' + ((cents / 100) | 0) + '.' + String(cents % 100).padStart(2, '0');
  return neg ? '-' + s : s;
}
function clockStr(sec) {
  sec = Math.max(0, sec);
  const m = (sec / 60) | 0, s = (sec % 60) | 0;
  return m + ':' + String(s).padStart(2, '0');
}


/* ===== 20_audio.js ===== */
/* ============================================================
   AUDIO  --  procedural chip SFX + a 4-bar loop, no assets
   ============================================================ */
'use strict';

const Audio5 = {
  ctx: null, master: null, sfxBus: null, musBus: null,
  ready: false, muted: false, musicOn: true,
  engine: null, siren: null,
  _next: 0, _step: 0, _timer: null,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    this.master.connect(ctx.destination);
    this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.9;  this.sfxBus.connect(this.master);
    this.musBus = ctx.createGain(); this.musBus.gain.value = 0.30; this.musBus.connect(this.master);
    this.ready = true;
    this.startMusic();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.85, this.ctx.currentTime, 0.02);
    return this.muted;
  },

  /* ---- primitive voices ---------------------------------- */
  tone(freq, dur, type = 'square', vol = 0.25, slide = 0, delay = 0, bus) {
    if (!this.ready) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, vol = 0.25, freq = 1200, q = 1, delay = 0, hp = false) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime + delay;
    const n = (0.35 * ctx.sampleRate) | 0;
    if (!this._nb) {
      this._nb = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = this._nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = this._nb;
    const f = ctx.createBiquadFilter(); f.type = hp ? 'highpass' : 'bandpass';
    f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    s.start(t); s.stop(t + dur + 0.02);
  },

  /* ---- named sfx ----------------------------------------- */
  sfx(name) {
    if (!this.ready) return;
    switch (name) {
      case 'throw':   this.noise(0.16, 0.18, 2600, 1.2); this.tone(680, 0.12, 'triangle', 0.10, 1400); break;
      case 'land':    this.tone(180, 0.09, 'square', 0.12, 120); this.noise(0.08, 0.14, 700, 1); break;
      case 'splat':   this.noise(0.26, 0.28, 420, 0.7); this.tone(150, 0.22, 'sawtooth', 0.14, 60); break;
      case 'deliver': [0, 1, 2].forEach((i) => this.tone([784, 988, 1319][i], 0.13, 'square', 0.20, 0, i * 0.065)); break;
      case 'perfect': [0, 1, 2, 3].forEach((i) => this.tone([659, 784, 988, 1568][i], 0.16, 'square', 0.22, 0, i * 0.055)); break;
      case 'cash':    this.tone(1319, 0.09, 'square', 0.16); this.tone(1760, 0.14, 'square', 0.14, 0, 0.06); break;
      case 'crash':   this.noise(0.3, 0.4, 260, 0.5); this.noise(0.18, 0.3, 2000, 1, 0.01, true); this.tone(110, 0.24, 'sawtooth', 0.2, 44); break;
      case 'bump':    this.noise(0.1, 0.18, 320, 0.8); break;
      case 'ped':     this.tone(880, 0.1, 'square', 0.16, 300); this.noise(0.14, 0.18, 900, 0.9, 0.05); break;
      case 'horn':    this.tone(440, 0.2, 'square', 0.10); this.tone(554, 0.2, 'square', 0.09); break;
      case 'nav':     this.tone(1568, 0.06, 'square', 0.13); break;
      case 'recalc':  this.tone(392, 0.09, 'square', 0.13); this.tone(330, 0.12, 'square', 0.12, 0, 0.09); break;
      case 'ticket':  [0, 1, 2].forEach((i) => this.tone([392, 330, 262][i], 0.18, 'sawtooth', 0.18, 0, i * 0.1)); break;
      case 'restock': [0, 1, 2].forEach((i) => this.tone([523, 659, 784][i], 0.11, 'triangle', 0.18, 0, i * 0.07)); break;
      case 'start':   [0, 1, 2, 3].forEach((i) => this.tone([523, 659, 784, 1047][i], 0.14, 'square', 0.22, 0, i * 0.09)); break;
      case 'over':    [0, 1, 2, 3].forEach((i) => this.tone([523, 440, 349, 262][i], 0.3, 'triangle', 0.2, 0, i * 0.18)); break;
      case 'tick':    this.tone(1046, 0.05, 'square', 0.10); break;
      case 'combo':   this.tone(1319, 0.07, 'square', 0.14, 1760); break;
      case 'select':  this.tone(880, 0.06, 'square', 0.14, 1200); break;
    }
  },

  /* ---- engine loop --------------------------------------- */
  engineOn() {
    if (!this.ready || this.engine) return;
    const ctx = this.ctx;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = -12;
    f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 3;
    g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfxBus);
    o1.start(); o2.start();
    this.engine = { o1, o2, f, g };
  },
  engineSet(speedFrac, load) {
    if (!this.engine) return;
    const t = this.ctx.currentTime;
    const f = 46 + speedFrac * 128;
    this.engine.o1.frequency.setTargetAtTime(f, t, 0.05);
    this.engine.o2.frequency.setTargetAtTime(f * 1.5, t, 0.05);
    this.engine.f.frequency.setTargetAtTime(380 + speedFrac * 1500, t, 0.08);
    this.engine.g.gain.setTargetAtTime(0.035 + load * 0.05 + speedFrac * 0.02, t, 0.08);
  },
  engineOff() {
    if (!this.engine) return;
    const t = this.ctx.currentTime;
    this.engine.g.gain.setTargetAtTime(0, t, 0.05);
    const e = this.engine; this.engine = null;
    setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (_) {} }, 400);
  },

  sirenOn() {
    if (!this.ready || this.siren) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 720;
    lfo.type = 'sine'; lfo.frequency.value = 1.7; lg.gain.value = 240;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.value = 0; g.gain.setTargetAtTime(0.055, ctx.currentTime, 0.2);
    o.connect(g); g.connect(this.sfxBus);
    o.start(); lfo.start();
    this.siren = { o, lfo, g };
  },
  sirenSet(nearFrac) {
    if (this.siren) this.siren.g.gain.setTargetAtTime(0.02 + nearFrac * 0.06, this.ctx.currentTime, 0.15);
  },
  sirenOff() {
    if (!this.siren) return;
    const s = this.siren; this.siren = null;
    s.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
    setTimeout(() => { try { s.o.stop(); s.lfo.stop(); } catch (_) {} }, 500);
  },

  /* ---- music: 4-bar chip loop ---------------------------- */
  startMusic() {
    if (!this.ready || this._timer) return;
    this._next = this.ctx.currentTime + 0.1;
    this._step = 0;
    this._timer = setInterval(() => this._sched(), 25);
  },
  toggleMusic() {
    this.musicOn = !this.musicOn;
    if (this.musBus) this.musBus.gain.setTargetAtTime(this.musicOn ? 0.30 : 0, this.ctx.currentTime, 0.05);
    return this.musicOn;
  },
  _sched() {
    if (!this.ready) return;
    const spb = 60 / 138 / 4;                 // 16th note
    while (this._next < this.ctx.currentTime + 0.12) {
      this._play(this._step, this._next, spb);
      this._next += spb;
      this._step = (this._step + 1) % 64;
    }
  },
  _play(s, t, spb) {
    const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const bar = (s / 16) | 0, k = s % 16;
    const ROOT = [45, 41, 48, 43][bar];       // Am  F  C  G
    const PENTA = [[69, 72, 74, 76, 79], [65, 69, 72, 74, 77],
                   [72, 76, 79, 81, 84], [67, 71, 74, 76, 79]][bar];

    // bass
    const BASS = [1, 0, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0];
    if (BASS[k]) {
      const oct = (k === 6 || k === 13) ? 12 : 0;
      this._v(mf(ROOT + oct), 0.11, 'square', 0.30, t);
    }
    // lead arp — sparser in bar 0/2, busier in 1/3
    const LEAD = [0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0];
    if (LEAD[k]) {
      const n = PENTA[(k * 3 + bar * 2) % PENTA.length] + (k > 11 ? 12 : 0);
      this._v(mf(n), 0.09, 'square', 0.13, t, 0.006);
    }
    // pad stab on the 1
    if (k === 0) {
      this._v(mf(ROOT + 12), 0.26, 'triangle', 0.10, t);
      this._v(mf(ROOT + 19), 0.26, 'triangle', 0.08, t);
    }
    // drums
    if (k % 4 === 0) this._d(0.09, 0.34, 90, false, t);          // kick-ish
    if (k === 4 || k === 12) this._d(0.11, 0.24, 1500, false, t); // snare
    if (k % 2 === 0) this._d(0.03, k % 4 === 2 ? 0.10 : 0.06, 7000, true, t);
  },
  _v(freq, dur, type, vol, t, atk = 0.004) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.musBus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  _d(dur, vol, freq, hp, t) {
    const ctx = this.ctx;
    if (!this._nb) {
      const n = (0.35 * ctx.sampleRate) | 0;
      this._nb = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = this._nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = this._nb;
    const f = ctx.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.musBus);
    s.start(t); s.stop(t + dur + 0.02);
  },
};


/* ===== 30_art.js ===== */
/* ============================================================
   ART  --  every pixel generated at boot. no external assets.
   ============================================================ */
'use strict';

const ROT = 32;                     // rotation frames per vehicle
const WALLH = 9;                    // fake wall height for houses
const BWALLH = 14;                  // fake wall height for commercial

const ROOFS = [
  [PAL.roofA, PAL.roofAlo], [PAL.roofB, PAL.roofBlo], [PAL.roofC, PAL.roofClo],
  [PAL.roofD, PAL.roofDlo], [PAL.roofE, PAL.roofElo], [PAL.roofF, PAL.roofFlo],
];
const WALLS = [
  [PAL.wallLt, PAL.wallMd, PAL.wallDk],
  ['#d9c9c0', '#bda99e', '#8a7469'],
  ['#cfd6c4', '#b0b89f', '#7f8770'],
  ['#e6d9c0', '#c8b89a', '#93836a'],
];

/* kraft paper for the taco bag, and what comes out of it when you miss */
const BAG_MID = '#a97c4e', BAG_HI = '#c2955f', BAG_LO = '#8a6238', BAG_FOLD = '#946a42';
const SPILL = ['#7a4a2a', '#c9542f', '#5aa14c', '#e0b055', '#d8b98a'];

const Art = {
  tile: {}, house: [], bldg: [], tree: [], prop: {},
  car: [], player: null, cop: null, ped: [], bag: null, taqueria: null, splat: [],
  badge: null,

  build(rng) {
    this.buildTiles(rng);
    this.buildHouses(rng);
    this.buildBldgs(rng);
    this.buildNature(rng);
    this.buildProps(rng);
    this.buildVehicles(rng);
    this.buildPeds(rng);
    this.buildMisc(rng);
  },

  /* ---------- ground tiles (4 variants each) -------------- */
  buildTiles(rng) {
    const V = 4;
    const mk = (fn) => { const a = []; for (let i = 0; i < V; i++) { const t = mkCanvas(TS, TS); fn(t.x, rng, i); a.push(t.c); } return a; };

    this.tile.road = mk((x) => {
      R(x, PAL.road, 0, 0, TS, TS);
      for (let i = 0; i < 26; i++) {
        const c = rng() < 0.5 ? PAL.roadLo : PAL.roadHi;
        R(x, c, rng.int(TS), rng.int(TS), 1, 1);
      }
      if (rng.chance(0.3)) { // patch
        const px = rng.int(11), py = rng.int(11);
        R(x, PAL.roadLo, px, py, rng.int(4) + 3, rng.int(3) + 2);
      }
    });

    this.tile.walk = mk((x) => {
      R(x, PAL.walk, 0, 0, TS, TS);
      for (let i = 0; i < 14; i++) R(x, rng() < 0.5 ? PAL.walkHi : PAL.walkLo, rng.int(TS), rng.int(TS), 1, 1);
      R(x, PAL.walkLo, 0, TS - 1, TS, 1);
      R(x, PAL.walkLo, TS - 1, 0, 1, TS);
      R(x, PAL.walkHi, 0, 0, TS, 1);
      if (rng.chance(0.25)) R(x, PAL.walkLo, rng.int(10) + 2, rng.int(10) + 3, rng.int(4) + 2, 1);
    });

    this.tile.grass = mk((x) => {
      R(x, PAL.grass, 0, 0, TS, TS);
      for (let i = 0; i < 30; i++) R(x, rng() < 0.55 ? PAL.grassHi : PAL.grassLo, rng.int(TS), rng.int(TS), 1, 1);
      for (let i = 0; i < 3; i++) { const a = rng.int(TS), b = rng.int(TS - 2); R(x, PAL.grassHi, a, b, 1, 2); }
    });

    this.tile.sea = mk((x, r, v) => {
      R(x, PAL.sea, 0, 0, TS, TS);
      for (let i = 0; i < 5; i++) R(x, PAL.seaLite, rng.int(12), rng.int(TS), rng.int(4) + 2, 1);
      if (v === 0) R(x, PAL.seaFoam, 3, 6, 5, 1);
      if (v === 2) R(x, PAL.seaFoam, 8, 11, 4, 1);
    });

    this.tile.dirt = mk((x) => {
      R(x, PAL.dirt, 0, 0, TS, TS);
      for (let i = 0; i < 22; i++) R(x, rng() < 0.5 ? PAL.dirtLo : PAL.dirt, rng.int(TS), rng.int(TS), 1, 1);
    });

    this.tile.lot = mk((x) => {   // parking lot asphalt, lighter
      R(x, '#565a6d', 0, 0, TS, TS);
      for (let i = 0; i < 18; i++) R(x, rng() < 0.5 ? '#4e5265' : '#606477', rng.int(TS), rng.int(TS), 1, 1);
    });
  },

  /* ---------- houses -------------------------------------- */
  buildHouses(rng) {
    // 8 variants x 4 door directions.  dir: 0=N 1=E 2=S 3=W
    for (let v = 0; v < 8; v++) {
      const roof = ROOFS[v % ROOFS.length];
      const wall = WALLS[v % WALLS.length];
      const seed = 1000 + v * 37;
      const set = [];
      for (let d = 0; d < 4; d++) set.push(this.mkHouse(makeRng(seed), roof, wall, d, v));
      this.house.push(set);
    }
  },

  mkHouse(r, roof, wall, dir, variant) {
    // footprint: 64x48 when facing N/S, 48x64 when facing E/W
    const ns = (dir === 0 || dir === 2);
    const fw = ns ? 64 : 48, fh = ns ? 48 : 64;
    const t = mkCanvas(fw, fh + WALLH);
    const x = t.x;

    /* --- south wall (always visible, fake height) --- */
    const wy = fh;
    R(x, wall[1], 0, wy, fw, WALLH);
    R(x, wall[0], 0, wy, fw, 1);
    R(x, wall[2], 0, wy + WALLH - 1, fw, 1);
    R(x, wall[2], fw - 1, wy, 1, WALLH);
    // windows on the wall
    for (let i = 0; i < (ns ? 3 : 2); i++) {
      const wxp = 7 + i * (ns ? 21 : 24);
      R(x, PAL.glass, wxp, wy + 2, 8, 4);
      R(x, PAL.glassHi, wxp, wy + 2, 8, 1);
      R(x, wall[2], wxp - 1, wy + 1, 10, 1);
    }

    /* --- roof (top face) --- */
    R(x, roof[0], 0, 0, fw, fh);
    // shingle rows
    for (let yy = 2; yy < fh; yy += 3) R(x, roof[1], 0, yy, fw, 1);
    // ridge line down the long axis
    if (ns) { R(x, roof[1], 0, (fh >> 1) - 1, fw, 2); R(x, '#ffffff22', 0, (fh >> 1) - 2, fw, 1); }
    else    { R(x, roof[1], (fw >> 1) - 1, 0, 2, fh); }
    // eaves / bevel: sun from NW
    R(x, roof[1], 0, fh - 1, fw, 1);
    R(x, roof[1], fw - 1, 0, 1, fh);
    x.globalAlpha = 0.22; R(x, '#ffffff', 0, 0, fw, 1); R(x, '#ffffff', 0, 0, 1, fh); x.globalAlpha = 1;
    // outline
    x.strokeStyle = 'rgba(20,14,28,0.55)'; x.lineWidth = 1;
    x.strokeRect(0.5, 0.5, fw - 1, fh + WALLH - 1);

    // chimney
    const cx = 6 + r.int(fw - 18), cy = 5 + r.int(fh - 16);
    R(x, wall[2], cx, cy, 6, 7);
    R(x, wall[1], cx, cy, 6, 2);
    R(x, PAL.ink, cx + 1, cy + 1, 4, 1);

    /* --- entrance marker: awning + stoop on the door side --- */
    const acc = [PAL.red, '#e0e0e0'];
    x.save();
    if (dir === 0) { this._awn(x, (fw >> 1) - 9, 0, 18, 6, false, acc); }
    if (dir === 2) { this._awn(x, (fw >> 1) - 9, fh + 1, 18, 6, false, acc); }
    if (dir === 1) { this._awn(x, fw - 6, (fh >> 1) - 9, 6, 18, true, acc); }
    if (dir === 3) { this._awn(x, 0, (fh >> 1) - 9, 6, 18, true, acc); }
    x.restore();

    // door drawn on the wall itself when the house faces the camera
    if (dir === 2) {
      const dx = (fw >> 1) - 4;
      R(x, PAL.ink, dx - 1, wy + 1, 10, WALLH - 1);
      R(x, PAL.door, dx, wy + 2, 8, WALLH - 2);
      R(x, PAL.doorHi, dx, wy + 2, 8, 1);
      R(x, PAL.amber, dx + 6, wy + 5, 1, 1);
    }
    return { c: t.c, w: fw, h: fh, oy: WALLH, dir };
  },

  _awn(x, px, py, w, h, vert, acc) {
    for (let i = 0; i < (vert ? h : w); i += 4) {
      const col = acc[((i / 4) | 0) % 2];
      if (vert) R(x, col, px, py + i, w, Math.min(4, h - i));
      else      R(x, col, px + i, py, Math.min(4, w - i), h);
    }
    x.strokeStyle = 'rgba(20,14,28,0.7)'; x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
  },

  /* ---------- commercial blocks --------------------------- */
  buildBldgs(rng) {
    const sizes = [[128, 96], [96, 128], [128, 128], [96, 96]];
    const tints = ['#8a8f9e', '#9a8878', '#7f8a96', '#94868f', '#86907f'];
    for (let i = 0; i < 8; i++) {
      const [w, h] = sizes[i % sizes.length];
      this.bldg.push(this.mkBldg(makeRng(500 + i * 91), w, h, tints[i % tints.length], i));
    }
  },

  mkBldg(r, fw, fh, tint, idx) {
    const t = mkCanvas(fw, fh + BWALLH);
    const x = t.x;
    const wy = fh;
    const dark = shade(tint, -0.34), lite = shade(tint, 0.18);

    // wall
    R(x, dark, 0, wy, fw, BWALLH);
    R(x, tint, 0, wy, fw, 1);
    // window band
    for (let i = 4; i < fw - 6; i += 9) {
      R(x, PAL.glass, i, wy + 3, 6, 6);
      R(x, PAL.glassHi, i, wy + 3, 6, 1);
      if (r.chance(0.25)) R(x, '#f0d68a', i, wy + 4, 6, 4);
    }
    // sign band
    const signCol = [PAL.red, PAL.cyan, PAL.amber, '#8a5fc0'][idx % 4];
    R(x, signCol, 3, wy + BWALLH - 4, fw - 6, 3);
    R(x, PAL.ink, 0, wy + BWALLH - 1, fw, 1);

    // roof
    R(x, shade(tint, -0.12), 0, 0, fw, fh);
    for (let i = 0; i < 90; i++) R(x, r.chance(0.5) ? shade(tint, -0.2) : shade(tint, -0.05), r.int(fw), r.int(fh), 1, 1);
    // parapet
    x.globalAlpha = 0.9;
    R(x, lite, 0, 0, fw, 3); R(x, lite, 0, 0, 3, fh);
    R(x, dark, 0, fh - 3, fw, 3); R(x, dark, fw - 3, 0, 3, fh);
    x.globalAlpha = 1;
    // roof kit: AC units, vents, skylights
    for (let i = 0; i < 4 + r.int(4); i++) {
      const ux = 8 + r.int(fw - 24), uy = 8 + r.int(fh - 24);
      const uw = 10 + r.int(10), uh = 8 + r.int(8);
      R(x, '#6b7280', ux, uy, uw, uh);
      R(x, '#8a919e', ux, uy, uw, 2);
      R(x, '#4a505c', ux, uy + uh - 1, uw, 1);
      for (let g = 2; g < uw - 2; g += 3) R(x, '#4a505c', ux + g, uy + 3, 1, uh - 5);
    }
    for (let i = 0; i < 3; i++) {
      const ux = 6 + r.int(fw - 14), uy = 6 + r.int(fh - 14);
      R(x, '#3c4250', ux, uy, 5, 5); R(x, '#5d6472', ux + 1, uy + 1, 3, 3);
    }
    if (r.chance(0.6)) { // rooftop skylight run
      const ux = 10 + r.int(fw - 40), uy = 10 + r.int(fh - 30);
      for (let i = 0; i < 3; i++) { R(x, PAL.glass, ux + i * 9, uy, 7, 12); R(x, PAL.glassHi, ux + i * 9, uy, 7, 2); }
    }
    x.strokeStyle = 'rgba(20,14,28,0.55)'; x.lineWidth = 1;
    x.strokeRect(0.5, 0.5, fw - 1, fh + BWALLH - 1);
    return { c: t.c, w: fw, h: fh, oy: BWALLH };
  },

  /* ---------- trees / nature ------------------------------ */
  buildNature(rng) {
    for (let i = 0; i < 5; i++) {
      const r = makeRng(70 + i * 13);
      const s = 18 + r.int(8);
      const t = mkCanvas(s, s + 6);
      const x = t.x, cx = s / 2, cy = s / 2;
      R(x, PAL.trunk, cx - 2, s - 4, 4, 9);
      const rad = s / 2 - 1;
      for (let a = 0; a < 260; a++) {
        const ang = rng() * TAU, d = Math.sqrt(rng()) * rad;
        const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d * 0.95;
        const c = d > rad * 0.72 ? PAL.treeLo : (px < cx && py < cy ? PAL.treeHi : PAL.tree);
        R(x, c, px, py, 2, 2);
      }
      for (let k = 0; k < 18; k++) R(x, PAL.treeHi, cx - rad * 0.6 + rng() * rad * 0.6, cy - rad * 0.6 + rng() * rad * 0.6, 1, 1);
      this.tree.push({ c: t.c, w: s, h: s, oy: 6 });
    }
  },

  /* ---------- street props -------------------------------- */
  buildProps(rng) {
    const P = this.prop;

    let t = mkCanvas(7, 14); // mailbox
    R(t.x, '#5a6070', 3, 6, 2, 8);
    R(t.x, '#c9cede', 1, 3, 6, 5);
    R(t.x, '#8b90a0', 1, 3, 6, 1);
    R(t.x, PAL.red, 6, 4, 1, 3);
    P.mailbox = { c: t.c, w: 7, h: 5, oy: 9 };

    t = mkCanvas(7, 12); // hydrant
    R(t.x, PAL.red, 2, 4, 3, 8);
    R(t.x, '#ff7a6a', 2, 4, 3, 1);
    R(t.x, PAL.red, 1, 6, 5, 2);
    R(t.x, '#8a1f12', 2, 11, 3, 1);

        R(x, SPILL[r.int(SPILL.length)], 10 + Math.cos(a) * d, 9 + Math.sin(a) * d * 0.8, 2, 2);
      }
      for (let k = 0; k < 8; k++) R(x, '#c9542f', r.int(20), r.int(18), 1, 1);
      this.splat.push(t.c);

    this.taqueria = this.mkTaqueria(makeRng(4242));
    this.badge = this.mkBadge();

  /* ---------- the shop badge, for the title screen --------
     A 16-bit reading of the real sticker: white die-cut rim, black keyline,
     jade face, chunky gold wordmark. Plotted with fillRect spans rather than
     arc() so the circle stays hard-edged like everything else on screen. */
  mkBadge() {
    const S = 112, c = S / 2;
    const t = mkCanvas(S, S), x = t.x;

    // concentric rings, outside in: die-cut rim, keyline, gap, keyline, face
    disc(x, c, c, 55, '#ffffff');
    disc(x, c, c, 52, PAL.ink);
    disc(x, c, c, 49, '#ffffff');
    disc(x, c, c, 46, PAL.ink);
    disc(x, c, c, 44, PAL.jade);
    // soft top-left sheen, the way the printed sticker catches light. Kept
    // small and faint — any more and the face stops reading as the logo's jade
    x.globalAlpha = 0.09;
    disc(x, c - 16, c - 18, 20, '#ffffff');
    x.globalAlpha = 1;

    // Wordmark. NOT textOut(): that offsets its outline by the glyph scale,
    // so at scale 4 the eight copies merge into a solid black slab. The logo
    // wants a constant-width keyline instead, independent of letter size.
    // At 92px wide the words overspill the 88px face onto the rings — the
    // real sticker does that too.
    keyline(x, 'TACO', c, 18, 4, 2, PAL.gold);
    keyline(x, 'SHOP', c, 52, 4, 2, PAL.gold);
    keyline(x, 'EST. 1970', c, 88, 1, 1, PAL.gold);
    return t.c;
  },

  mkTaqueria(r) {
    const fw = 128, fh = 96, wallh = 16;

    const wy = fh;
    // wall
    R(x, '#c9b89a', 0, wy, fw, wallh);
    R(x, '#e0d2b4', 0, wy, fw, 1);
    R(x, '#8e7f66', 0, wy + wallh - 1, fw, 1);

    R(x, PAL.glassHi, 8, wy + 3, 46, 2);
    R(x, '#f0d68a', 10, wy + 5, 42, 6);
    R(x, '#15121c', 74, wy + 2, 16, wallh - 2);
    R(x, PAL.door, 75, wy + 3, 14, wallh - 4);
    R(x, PAL.amber, 86, wy + 8, 1, 2);
    // striped awning across the front
    for (let i = 0; i < fw; i += 8) R(x, ((i / 8) | 0) % 2 ? '#f2e9d0' : PAL.jade, i, wy - 1, 8, 4);
    R(x, '#15121c', 0, wy + 3, fw, 1);

    // roof
    R(x, '#9a4030', 0, 0, fw, fh);
    for (let yy = 3; yy < fh; yy += 4) R(x, '#7d3324', 0, yy, fw, 1);
    x.globalAlpha = 0.2; R(x, '#ffffff', 0, 0, fw, 2); R(x, '#ffffff', 0, 0, 2, fh); x.globalAlpha = 1;
    R(x, '#6b2b1e', 0, fh - 2, fw, 2); R(x, '#6b2b1e', fw - 2, 0, 2, fh);

    // rooftop sign board, readable from above — the badge, seen from a helicopter
    R(x, '#15121c', 14, 22, 100, 34);
    R(x, PAL.jade, 16, 24, 96, 30);
    R(x, '#ffffff', 16, 24, 96, 1);
    R(x, '#ffffff', 16, 53, 96, 1);
    text(x, 'TACO', 64, 28, PAL.gold, 2, 1);
    text(x, 'SHOP', 64, 42, PAL.gold, 2, 1);
    // vents
    for (let i = 0; i < 3; i++) { R(x, '#6b7280', 12 + i * 12, 68, 8, 8); R(x, '#8a919e', 12 + i * 12, 68, 8, 2); }
    R(x, '#6b7280', 96, 64, 18, 14); R(x, '#8a919e', 96, 64, 18, 3);
    x.strokeStyle = 'rgba(20,14,28,0.6)'; x.lineWidth = 1;
    x.strokeRect(0.5, 0.5, fw - 1, fh + wallh - 1);
    return { c: t.c, w: fw, h: fh, oy: wallh };
  },
};

/* ---- helpers ---------------------------------------------- */
/** centred text with a black keyline of `k` px, whatever the glyph scale.
    textOut() ties outline width to scale, which turns to mush past about 2x. */
function keyline(x, str, cx, cy, s, k, col) {
  const ox = (cx - textW(str, s) / 2) | 0;
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++)
      if (dx || dy) drawRun(x, str, ox + dx, cy + dy, PAL.ink, s);
  drawRun(x, str, ox, cy, col, s);
}

/** hard-edged filled circle: one fillRect span per scanline, no antialiasing */
function disc(x, cx, cy, r, col) {
  x.fillStyle = col;
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r2 - dy * dy)));
    if (w > 0) x.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2, 1);
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
}

function rotFrames(src, n) {
  let d = Math.ceil(hyp(src.width, src.height)) + 2;
  if (d & 1) d++;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = mkCanvas(d, d);
    t.x.imageSmoothingEnabled = false;
    t.x.translate(d / 2, d / 2);
    t.x.rotate(i / n * TAU);
    t.x.drawImage(src, -src.width / 2, -src.height / 2);
    out.push(t.c);
  }
  out.size = d;
  return out;
}

function drawRot(x, frames, px, py, ang) {
  let i = Math.round(ang / TAU * ROT) % ROT; if (i < 0) i += ROT;
  const d = frames.size;
  x.drawImage(frames[i], Math.round(px - d / 2), Math.round(py - d / 2));
}


/* ===== 40_city.js ===== */
/* ============================================================
   CITY  --  street grid, addressed houses, baked ground layer
   ============================================================ */
'use strict';

const HSTREETS = ['MAPLE ST', 'OAK ST', 'PINE ST', 'BIRCH ST', 'CEDAR ST',
                  'ELM ST', 'WALNUT ST', 'ASPEN ST', 'LAUREL ST'];
const VSTREETS = ['1ST AVE', '2ND AVE', '3RD AVE', '4TH AVE', '5TH AVE',
                  '6TH AVE', '7TH AVE', '8TH AVE', '9TH AVE'];

const NODES = BLOCKS + 1;                       // 9 x 9 intersections

const City = {
  solid: null, surf: null, ground: null, gx: null,
  statics: [], houses: [], shop: null, parkedTiles: null,

  nodeX(n) { return (BORDER + n * SPAN) * TS + TS; },
  nodeY(n) { return (BORDER + n * SPAN) * TS + TS; },
  nearNodeX(wx) { return clamp(Math.round((wx / TS - BORDER - 1) / SPAN), 0, BLOCKS); },
  nearNodeY(wy) { return clamp(Math.round((wy / TS - BORDER - 1) / SPAN), 0, BLOCKS); },

  isSolid(wx, wy) {
    const tx = (wx / TS) | 0, ty = (wy / TS) | 0;
    if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return 1;
    return this.solid[ty * GW + tx];
  },
  surfaceAt(wx, wy) {
    const tx = (wx / TS) | 0, ty = (wy / TS) | 0;
    if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return S_SEA;
    return this.surf[ty * GW + tx];
  },

  gen(rng) {
    this.solid = new Uint8Array(GW * GH);
    this.surf  = new Uint8Array(GW * GH);
    this.keep  = new Uint8Array(GW * GH);   // porches + walkways: nothing may block these
    this.statics = []; this.houses = [];

    const g = mkCanvas(WW, WH);
    this.ground = g.c; this.gx = g.x;
    const x = this.gx;

    /* ---- 1. classify + bake base tiles ------------------- */
    const cls = new Uint8Array(GW * GH);
    for (let ty = 0; ty < GH; ty++) {
      for (let tx = 0; tx < GW; tx++) {
        const c = classify(tx, ty), i = ty * GW + tx;
        cls[i] = c;
        this.surf[i] = c === T_SEA ? S_SEA : (c === T_WALK ? S_WALK : (c === T_LOT ? S_GRASS : S_ROAD));
        if (c === T_SEA) this.solid[i] = 1;
      }
    }

    /* ---- 2. block programme ----------------------------- */
    const SHOP_BX = 3, SHOP_BY = 4;
    const kinds = [];
    for (let by = 0; by < BLOCKS; by++) {
      kinds[by] = [];
      for (let bx = 0; bx < BLOCKS; bx++) {
        if (bx === SHOP_BX && by === SHOP_BY) { kinds[by][bx] = 'shop'; continue; }
        const roll = rng();
        kinds[by][bx] = roll < 0.60 ? 'res' : roll < 0.80 ? 'com' : roll < 0.90 ? 'park' : 'lot';
      }
    }

    /* ---- 3. paint block ground surfaces ------------------ */
    for (let by = 0; by < BLOCKS; by++) for (let bx = 0; bx < BLOCKS; bx++) {
      const k = kinds[by][bx];
      if (k === 'com' || k === 'lot' || k === 'shop') {
        for (let ly = 1; ly <= 8; ly++) for (let lx = 1; lx <= 8; lx++) {
          const tx = BORDER + bx * SPAN + 2 + lx, ty = BORDER + by * SPAN + 2 + ly;
          this.surf[ty * GW + tx] = S_ROAD;
          cls[ty * GW + tx] = 100;              // lot asphalt marker
        }
      }
    }

    const pick = (arr, tx, ty) => arr[((tx * 73856093) ^ (ty * 19349663)) & 3];
    for (let ty = 0; ty < GH; ty++) for (let tx = 0; tx < GW; tx++) {
      const c = cls[ty * GW + tx];
      const set = c === T_SEA ? Art.tile.sea : c === T_WALK ? Art.tile.walk
                : c === T_LOT ? Art.tile.grass : c === 100 ? Art.tile.lot : Art.tile.road;
      x.drawImage(pick(set, tx, ty), tx * TS, ty * TS);
    }

    /* ---- 4. sea wall along the grid edge ----------------- */
    this.drawSeaWall(x);

    /* ---- 5. road markings -------------------------------- */
    this.drawRoadMarkings(x);

    /* ---- 6. build each block ----------------------------- */
    for (let by = 0; by < BLOCKS; by++) for (let bx = 0; bx < BLOCKS; bx++) {
      const k = kinds[by][bx];
      if (k === 'res')       this.genResidential(rng, bx, by);
      else if (k === 'com')  this.genCommercial(rng, bx, by);
      else if (k === 'park') this.genPark(rng, bx, by);
      else if (k === 'lot')  this.genParking(rng, bx, by);
      else if (k === 'shop') this.genShop(rng, bx, by);
    }

    /* ---- 7. street furniture ----------------------------- */
    this.genFurniture(rng);

    /* ---- 8. bake static shadows, sort draw order --------- */
    x.fillStyle = 'rgba(18,10,26,0.26)';
    for (const s of this.statics) {
      if (s.noShadow) continue;
      x.fillRect(s.x + 6, s.y + 7, s.w, s.h);
    }
    this.statics.sort((a, b) => a.sortY - b.sortY);
    this.buildBuckets();
  },

  /* ---------- coarse spatial index for the draw pass ------ */
  BS: 128,
  buildBuckets() {
    this.BC = Math.ceil(WW / this.BS);
    this.buckets = [];
    for (let i = 0; i < this.BC * this.BC; i++) this.buckets.push([]);
    for (const s of this.statics) {
      s._seen = -1;
      const x0 = clamp((s.x / this.BS) | 0, 0, this.BC - 1);
      const y0 = clamp(((s.y - s.oy) / this.BS) | 0, 0, this.BC - 1);
      const x1 = clamp(((s.x + s.w) / this.BS) | 0, 0, this.BC - 1);
      const y1 = clamp(((s.y + s.h) / this.BS) | 0, 0, this.BC - 1);
      for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++)
        this.buckets[by * this.BC + bx].push(s);
    }
    this._stamp = 0;
  },

  /** push every static overlapping the rect into `out` */
  collect(x0, y0, x1, y1, out) {
    const st = ++this._stamp;
    const bx0 = clamp((x0 / this.BS) | 0, 0, this.BC - 1), bx1 = clamp((x1 / this.BS) | 0, 0, this.BC - 1);
    const by0 = clamp((y0 / this.BS) | 0, 0, this.BC - 1), by1 = clamp((y1 / this.BS) | 0, 0, this.BC - 1);
    for (let by = by0; by <= by1; by++) for (let bx = bx0; bx <= bx1; bx++) {
      const b = this.buckets[by * this.BC + bx];
      for (let i = 0; i < b.length; i++) {
        const s = b[i];
        if (s._seen === st) continue;
        s._seen = st;
        if (s.x > x1 || s.x + s.w < x0 || s.y - s.oy > y1 || s.y + s.h < y0) continue;
        out.push(s);
      }
    }
  },

  /* ---------- sea wall ------------------------------------ */
  drawSeaWall(x) {
    const a = BORDER * TS, b = (BORDER + SPANEND + 1) * TS;
    const rim = (px, py, w, h) => {
      R(x, PAL.wall, px, py, w, h);
      R(x, shade(PAL.wall, 0.2), px, py, w, 1);
      R(x, PAL.wallLo, px, py + h - 1, w, 1);
    };
    rim(a - 6, a - 6, b - a + 12, 6);
    rim(a - 6, b, b - a + 12, 6);
    rim(a - 6, a, 6, b - a);
    rim(b, a, 6, b - a);
    // foam on the water side
    x.fillStyle = PAL.seaFoam;
    for (let i = a - 6; i < b + 6; i += 7) {
      x.fillRect(i, a - 9, 4, 1); x.fillRect(i + 2, b + 8, 4, 1);
      x.fillRect(a - 9, i, 1, 4); x.fillRect(b + 8, i + 2, 1, 4);
    }
  },

  /* ---------- lane lines, crosswalks ---------------------- */
  drawRoadMarkings(x) {
    const lo = BORDER * TS, hi = (BORDER + SPANEND + 1) * TS;
    // centre dashes on every road, skipping intersections
    for (let n = 0; n <= BLOCKS; n++) {
      const cx = (BORDER + n * SPAN) * TS + TS;
      for (let y = lo; y < hi; y += 22) {
        if (this.inIntersection(cx, y + 6)) continue;
        R(x, PAL.lineY, cx - 1, y, 2, 12);
      }
      const cy = (BORDER + n * SPAN) * TS + TS;
      for (let px = lo; px < hi; px += 22) {
        if (this.inIntersection(px + 6, cy)) continue;
        R(x, PAL.lineY, px, cy - 1, 12, 2);
      }
    }
    // crosswalks on every intersection approach
    for (let ny = 0; ny <= BLOCKS; ny++) for (let nx = 0; nx <= BLOCKS; nx++) {
      const ix = (BORDER + nx * SPAN) * TS, iy = (BORDER + ny * SPAN) * TS;
      for (let s = 0; s < 4; s++) {
        const vert = s < 2;
        const px = vert ? ix : (s === 2 ? ix - 7 : ix + 32);
        const py = vert ? (s === 0 ? iy - 7 : iy + 32) : iy;
        if (px < lo - 8 || py < lo - 8 || px > hi || py > hi) continue;
        for (let i = 2; i < 32; i += 6) {
          if (vert) R(x, PAL.lineW, px + i, py, 4, 7);
          else      R(x, PAL.lineW, px, py + i, 7, 4);
        }
      }
    }
    // curb line where sidewalk meets road
    x.fillStyle = PAL.curb;
    for (let b = 0; b < BLOCKS; b++) {
      for (let n = 0; n <= BLOCKS; n++) {
        const s = (BORDER + b * SPAN + 2) * TS, len = 10 * TS;
        const e = (BORDER + n * SPAN) * TS;
        x.fillRect(s, e + 32 - 1, len, 1);
        x.fillRect(s, e - 1, len, 1);
        x.fillRect(e + 32 - 1, s, 1, len);
        x.fillRect(e - 1, s, 1, len);
      }
    }
  },

  inIntersection(wx, wy) {
    const ax = (wx / TS | 0) - BORDER, ay = (wy / TS | 0) - BORDER;
    return (ax % SPAN) < 2 && (ay % SPAN) < 2;
  },

  markSolid(tx0, ty0, w, h) {
    for (let ty = ty0; ty < ty0 + h; ty++) for (let tx = tx0; tx < tx0 + w; tx++)
      if (tx >= 0 && ty >= 0 && tx < GW && ty < GH) this.solid[ty * GW + tx] = 1;
  },

  /* ---------- residential block --------------------------- */
  genResidential(rng, bx, by) {
    const ns = rng.chance(0.5);
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
      const lotAX = bx * SPAN + 3 + i * 4;      // grid-space tile of lot origin
      const lotAY = by * SPAN + 3 + j * 4;
      let dir, ax, ay, tw, th;
      if (ns) {
        dir = j === 0 ? 0 : 2;
        tw = 4; th = 3;
        ax = lotAX; ay = j === 0 ? lotAY + 1 : lotAY;
      } else {
        dir = i === 0 ? 3 : 1;
        tw = 3; th = 4;
        ax = i === 0 ? lotAX + 1 : lotAX; ay = lotAY;
      }
      const tx = BORDER + ax, ty = BORDER + ay;
      this.markSolid(tx, ty, tw, th);

      const wx = tx * TS, wy = ty * TS, w = tw * TS, h = th * TS;
      const variant = rng.int(Art.house.length);
      const spr = Art.house[variant][dir];
      this.statics.push({ img: spr.c, x: wx, y: wy, oy: spr.oy, w, h, sortY: wy + h });

      /* porch, door bullseye, curb point */
      let porch, curb, node;
      // the porch is the delivery target, so it is sized to stay hittable from
      // a moving car: wide along the street, one yard-tile deep
      if (dir === 0)      porch = { x: wx + w / 2 - 14, y: wy - 15, w: 28, h: 15 };
      else if (dir === 2) porch = { x: wx + w / 2 - 14, y: wy + h,  w: 28, h: 15 };
      else if (dir === 1) porch = { x: wx + w,          y: wy + h / 2 - 14, w: 15, h: 28 };
      else                porch = { x: wx - 15,         y: wy + h / 2 - 14, w: 15, h: 28 };

      const pcx = porch.x + porch.w / 2, pcy = porch.y + porch.h / 2;
      if (dir === 0)      curb = { x: pcx, y: (BORDER + by * SPAN) * TS + TS };
      else if (dir === 2) curb = { x: pcx, y: (BORDER + (by + 1) * SPAN) * TS + TS };
      else if (dir === 3) curb = { x: (BORDER + bx * SPAN) * TS + TS, y: pcy };
      else                curb = { x: (BORDER + (bx + 1) * SPAN) * TS + TS, y: pcy };
      node = [this.nearNodeX(curb.x), this.nearNodeY(curb.y)];

      /* address */
      const along = (dir === 0 || dir === 2) ? i : j;
      const cross = (dir === 0 || dir === 2) ? bx : by;
      const street = (dir === 0) ? HSTREETS[by] : (dir === 2) ? HSTREETS[by + 1]
                   : (dir === 3) ? VSTREETS[bx] : VSTREETS[bx + 1];
      const num = cross * 100 + along * 22 + ((dir === 0 || dir === 3) ? 7 : 8);

      const house = {
        x: wx, y: wy, w, h, dir, porch, street, num,
        addr: num + ' ' + street,
        door: { x: pcx - 6, y: pcy - 5, w: 12, h: 10 },
        cx: wx + w / 2, cy: wy + h / 2, curb, node,
      };
      this.houses.push(house);

      /* reserve the porch and its walkway out to the kerb */
      const wOut = 18;
      const clr = dir === 0 ? { x: porch.x, y: (BORDER + by * SPAN + 2) * TS, w: porch.w, h: porch.y + porch.h - (BORDER + by * SPAN + 2) * TS }
                : dir === 2 ? { x: porch.x, y: porch.y, w: porch.w, h: (BORDER + (by + 1) * SPAN) * TS - porch.y }
                : dir === 3 ? { x: (BORDER + bx * SPAN + 2) * TS, y: porch.y, w: porch.x + porch.w - (BORDER + bx * SPAN + 2) * TS, h: porch.h }
                :             { x: porch.x, y: porch.y, w: (BORDER + (bx + 1) * SPAN) * TS - porch.x, h: porch.h };
      for (let ty2 = (clr.y / TS) | 0; ty2 <= ((clr.y + clr.h - 1) / TS) | 0; ty2++)
        for (let tx2 = (clr.x / TS) | 0; tx2 <= ((clr.x + clr.w - 1) / TS) | 0; tx2++)
          if (tx2 >= 0 && ty2 >= 0 && tx2 < GW && ty2 < GH) this.keep[ty2 * GW + tx2] = 1;
      house.clear = clr;

      /* ground: porch pad + walkway to the sidewalk */
      const g = this.gx;
      R(g, PAL.porch, porch.x, porch.y, porch.w, porch.h);
      R(g, shade(PAL.porch, -0.22), porch.x, porch.y + porch.h - 1, porch.w, 1);
      R(g, shade(PAL.porch, 0.15), porch.x, porch.y, porch.w, 1);
      g.strokeStyle = 'rgba(20,14,28,0.35)'; g.lineWidth = 1;
      g.strokeRect(porch.x + 0.5, porch.y + 0.5, porch.w - 1, porch.h - 1);

      const pathC = '#c2b697';
      if (dir === 0)      R(g, pathC, pcx - 5, (BORDER + by * SPAN + 2) * TS, 10, porch.y - (BORDER + by * SPAN + 2) * TS);
      else if (dir === 2) R(g, pathC, pcx - 5, porch.y + porch.h, 10, (BORDER + (by + 1) * SPAN - 1) * TS + TS - (porch.y + porch.h));
      else if (dir === 3) R(g, pathC, (BORDER + bx * SPAN + 2) * TS, pcy - 5, porch.x - (BORDER + bx * SPAN + 2) * TS, 10);
      else                R(g, pathC, porch.x + porch.w, pcy - 5, (BORDER + (bx + 1) * SPAN - 1) * TS + TS - (porch.x + porch.w), 10);

      /* mailbox at the kerb */
      const mb = Art.prop.mailbox;
      let mx2 = curb.x, my2 = curb.y;
      if (dir === 0)      { mx2 = pcx + 12; my2 = (BORDER + by * SPAN + 2) * TS + 4; }
      else if (dir === 2) { mx2 = pcx + 12; my2 = (BORDER + (by + 1) * SPAN) * TS - 4; }
      else if (dir === 3) { mx2 = (BORDER + bx * SPAN + 2) * TS + 4; my2 = pcy + 12; }
      else                { mx2 = (BORDER + (bx + 1) * SPAN) * TS - 4; my2 = pcy + 12; }
      this.statics.push({ img: mb.c, x: mx2, y: my2, oy: mb.oy, w: mb.w, h: mb.h, sortY: my2 + mb.h, noShadow: true });

      /* a bush in the yard — never on the porch or its walkway */
      if (rng.chance(0.75)) {
        const bu = Art.prop.bush;
        for (let a = 0; a < 6; a++) {
          const bxp = wx + rng.int(Math.max(1, w - bu.w)), byp = wy + h - 4 + rng.int(6);
          const kt = (((byp + bu.h / 2) / TS) | 0) * GW + (((bxp + bu.w / 2) / TS) | 0);
          if (this.keep[kt]) continue;
          this.statics.push({ img: bu.c, x: bxp, y: byp, oy: bu.oy, w: bu.w, h: bu.h, sortY: byp + bu.h });
          break;
        }
      }
    }
  },

  /* ---------- commercial block ---------------------------- */
  genCommercial(rng, bx, by) {
    const b = Art.bldg[rng.int(Art.bldg.length)];
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS;
    const lotW = 8 * TS;
    const wx = lotX + ((lotW - b.w) >> 1), wy = lotY + ((lotW - b.h) >> 1);
    this.markSolid((wx / TS) | 0, (wy / TS) | 0, Math.ceil(b.w / TS), Math.ceil(b.h / TS));
    this.statics.push({ img: b.c, x: wx, y: wy, oy: b.oy, w: b.w, h: b.h, sortY: wy + b.h });

    // painted stalls in the apron
    const g = this.gx;
    g.fillStyle = '#c9cede88';
    if (wy - lotY > 20) for (let i = 0; i < 8; i++) g.fillRect(lotX + 6 + i * 15, lotY + 2, 1, 14);
    if (lotY + lotW - (wy + b.h) > 20) for (let i = 0; i < 8; i++) g.fillRect(lotX + 6 + i * 15, lotY + lotW - 16, 1, 14);
  },

  /* ---------- park block ---------------------------------- */
  genPark(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    // winding path
    g.fillStyle = '#c2b697';
    g.fillRect(lotX, lotY + L / 2 - 6, L, 12);
    g.fillRect(lotX + L / 2 - 6, lotY, 12, L);
    // pond
    if (rng.chance(0.6)) {
      const px = lotX + 8 + rng.int(30), py = lotY + 8 + rng.int(30), pw = 40 + rng.int(24), ph = 30 + rng.int(16);
      g.fillStyle = PAL.sea; g.beginPath(); g.ellipse(px + pw / 2, py + ph / 2, pw / 2, ph / 2, 0, 0, TAU); g.fill();
      g.fillStyle = PAL.seaLite; g.beginPath(); g.ellipse(px + pw / 2, py + ph / 2 - 2, pw / 2 - 4, ph / 2 - 4, 0, 0, TAU); g.fill();
      g.fillStyle = PAL.seaFoam;
      for (let i = 0; i < 6; i++) g.fillRect(px + 8 + rng.int(pw - 16), py + 6 + rng.int(ph - 12), 4, 1);
      this.markSolid(((px + 6) / TS) | 0, ((py + 6) / TS) | 0, Math.max(1, ((pw - 12) / TS) | 0), Math.max(1, ((ph - 12) / TS) | 0));
    }
    for (let i = 0; i < 7 + rng.int(5); i++) {
      const t = Art.tree[rng.int(Art.tree.length)];
      const tx = lotX + rng.int(L - t.w), ty = lotY + rng.int(L - t.h);
      this.markSolid(((tx + t.w / 2 - 4) / TS) | 0, ((ty + t.h / 2 - 4) / TS) | 0, 1, 1);
      this.statics.push({ img: t.c, x: tx, y: ty, oy: t.oy, w: t.w, h: t.h, sortY: ty + t.h });
    }
    for (let i = 0; i < 2; i++) {
      const bn = Art.prop.bench;
      const tx = lotX + 10 + rng.int(L - 30), ty = lotY + L / 2 + 10 + rng.int(20);
      this.statics.push({ img: bn.c, x: tx, y: ty, oy: bn.oy, w: bn.w, h: bn.h, sortY: ty + bn.h, noShadow: true });
    }
  },

  /* ---------- parking lot block --------------------------- */
  genParking(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    g.fillStyle = '#c9cedeaa';
    for (let row = 0; row < 3; row++) {
      const ry = lotY + 10 + row * 40;
      for (let i = 0; i <= 6; i++) g.fillRect(lotX + 8 + i * 18, ry, 1, 26);
      g.fillRect(lotX + 8, ry, 109, 1);
    }
    for (let i = 0; i < 6 + rng.int(6); i++) {
      const ci = rng.int(Art.car.length), fr = Art.car[ci];
      const row = rng.int(3);
      const px = lotX + 10 + rng.int(6) * 18, py = lotY + 12 + row * 40;
      const d = fr.size;
      this.statics.push({ img: fr[ROT / 4], x: px - 2, y: py, oy: 4, w: 18, h: 22, sortY: py + 22, noShadow: false, isCar: true, fw: d });
      this.markSolid((px / TS) | 0, (py / TS) | 0, 2, 2);
    }
  },

  /* ---------- the shop ------------------------------------ */
  genShop(rng, bx, by) {
    const p = Art.taqueria;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    const wx = lotX + ((L - p.w) >> 1), wy = lotY;
    this.markSolid((wx / TS) | 0, (wy / TS) | 0, Math.ceil(p.w / TS), Math.ceil(p.h / TS));
    this.statics.push({ img: p.c, x: wx, y: wy, oy: p.oy, w: p.w, h: p.h, sortY: wy + p.h });

    const g = this.gx;
    // apron with a bold painted pickup bay
    const dockX = wx + p.w / 2, dockY = wy + p.h + 24;
    R(g, PAL.amber, dockX - 30, dockY - 16, 60, 32);
    R(g, '#3a3040', dockX - 27, dockY - 13, 54, 26);
    for (let i = 0; i < 60; i += 8) R(g, PAL.amber, dockX - 30 + i, dockY - 16, 4, 3);
    text(g, 'PICKUP', dockX, dockY - 8, PAL.amber, 1, 1);
    text(g, 'ONLY', dockX, dockY + 2, PAL.amber, 1, 1);

    this.shop = {
      x: wx, y: wy, w: p.w, h: p.h,
      dock: { x: dockX, y: dockY },
      node: [this.nearNodeX(dockX), this.nearNodeY(wy + p.h + 60)],
      curb: { x: dockX, y: (BORDER + (by + 1) * SPAN) * TS + TS },
    };
    this.shop.node = [this.nearNodeX(this.shop.curb.x), this.nearNodeY(this.shop.curb.y)];

    // driveway out to the street
    R(g, '#5a5e70', dockX - 20, dockY + 16, 40, (BORDER + (by + 1) * SPAN) * TS - (dockY + 16));
  },

  /* ---------- street furniture along sidewalks ------------ */
  genFurniture(rng) {
    for (let by = 0; by <= BLOCKS; by++) for (let bx = 0; bx <= BLOCKS; bx++) {
      // lamps at intersection corners
      const ix = (BORDER + bx * SPAN) * TS, iy = (BORDER + by * SPAN) * TS;
      for (const [ox, oy] of [[-10, -10], [36, -10], [-10, 36], [36, 36]]) {
        const px = ix + ox, py = iy + oy;
        if (px < BORDER * TS || py < BORDER * TS || px > (BORDER + SPANEND) * TS || py > (BORDER + SPANEND) * TS) continue;
        const l = Art.prop.lamp;
        this.statics.push({ img: l.c, x: px, y: py, oy: l.oy, w: l.w, h: l.h, sortY: py + l.h, noShadow: true });
      }
    }
    // hydrants / trash / cones scattered on sidewalks
    for (let i = 0; i < 190; i++) {
      const bx = rng.int(BLOCKS), by = rng.int(BLOCKS);
      const side = rng.int(4);
      const base = rng.int(8) + 1;
      let ax, ay;
      if (side === 0) { ax = bx * SPAN + 2 + base; ay = by * SPAN + 2; }
      else if (side === 2) { ax = bx * SPAN + 2 + base; ay = by * SPAN + 11; }
      else if (side === 3) { ax = bx * SPAN + 2; ay = by * SPAN + 2 + base; }
      else { ax = bx * SPAN + 11; ay = by * SPAN + 2 + base; }
      if (this.keep[(BORDER + ay) * GW + (BORDER + ax)]) continue;
      const px = (BORDER + ax) * TS + 4, py = (BORDER + ay) * TS + 3;
      const kind = rng() < 0.4 ? 'hydrant' : rng() < 0.7 ? 'trash' : 'cone';
      const pr = Art.prop[kind];
      this.statics.push({ img: pr.c, x: px, y: py, oy: pr.oy, w: pr.w, h: pr.h, sortY: py + pr.h, noShadow: true });
    }
    // street trees in the grass strip
    for (let i = 0; i < 140; i++) {
      const bx = rng.int(BLOCKS), by = rng.int(BLOCKS);
      const ax = bx * SPAN + 3 + rng.int(8), ay = by * SPAN + 3 + rng.int(8);
      const tx = BORDER + ax, ty = BORDER + ay;
      if (this.solid[ty * GW + tx] || this.keep[ty * GW + tx] || this.surf[ty * GW + tx] !== S_GRASS) continue;
      const t = Art.tree[rng.int(Art.tree.length)];
      const px = tx * TS - 2, py = ty * TS - 4;
      this.markSolid(tx, ty, 1, 1);
      this.statics.push({ img: t.c, x: px, y: py, oy: t.oy, w: t.w, h: t.h, sortY: py + t.h });
    }
  },
};


/* ===== 50_entities.js ===== */
/* ============================================================
   ENTITIES  --  player, traffic, pedestrians, cop, taco bag, fx
   ============================================================ */
'use strict';

const SEG0  = BORDER * TS;          // world px where the road grid starts
const PITCH = SPAN * TS;            // 192 px between parallel roads
const DIRV  = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // 0=E 1=S 2=W 3=N

const MAXSPD  = 176;
const ACC     = 285;
const BRAKE   = 460;
const REVMAX  = 78;
const TURNRATE = 3.25;
const SURF_MUL = [1, 0.60, 0.54, 0.4];   // road, walk, grass, sea

/* ---------------- generic car body collision -------------- */
const CORNERS = [[9, 4.5], [9, -4.5], [-9, 4.5], [-9, -4.5], [0, 5.5], [0, -5.5]];
function carBlocked(x, y, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 0; i < CORNERS.length; i++) {
    const lx = CORNERS[i][0], ly = CORNERS[i][1];
    if (City.isSolid(x + lx * c - ly * s, y + lx * s + ly * c)) return true;
  }
  return false;
}

/* ---------------- the player ------------------------------ */
class Player {
  constructor(x, y, ang) {
    this.x = x; this.y = y; this.ang = ang;
    this.vx = 0; this.vy = 0;
    this.slip = 0; this.spinT = 0; this.impact = 0;
    this.throttle = 0; this.steer = 0; this.hb = false;
    this.skidT = 0;
  }
  get speed() { return hyp(this.vx, this.vy); }
  get fwdSpeed() { return this.vx * Math.cos(this.ang) + this.vy * Math.sin(this.ang); }

  control(inp) {
    if (this.spinT > 0) { this.throttle = 0; this.steer = 0; return; }
    const up = inp.k('KeyW', 'ArrowUp'), dn = inp.k('KeyS', 'ArrowDown');
    this.throttle = up ? 1 : dn ? -1 : 0;
    const lf = inp.k('KeyA', 'ArrowLeft'), rt = inp.k('KeyD', 'ArrowRight');
    this.steer = (rt ? 1 : 0) - (lf ? 1 : 0);
    this.hb = inp.k('ShiftLeft', 'ShiftRight');
  }

  update(dt, G) {
    if (this.spinT > 0) {
      this.spinT -= dt;
      this.ang += 11 * dt * this.spinDir;
    }
    const surf = City.surfaceAt(this.x, this.y);
    const mul = SURF_MUL[surf] || 1;

    /* steering */
    const spd = this.speed;
    const back = this.fwdSpeed < -2 ? -1 : 1;
    const turn = this.steer * TURNRATE * clamp(spd / 46, 0, 1) * (1 - 0.28 * clamp(spd / MAXSPD, 0, 1)) * back;
    if (this.spinT <= 0) this.ang += turn * dt;

    /* longitudinal */
    const fx = Math.cos(this.ang), fy = Math.sin(this.ang);
    let vf = this.vx * fx + this.vy * fy;
    let vl = -this.vx * fy + this.vy * fx;

    if (this.throttle > 0) vf += ACC * mul * dt;
    else if (this.throttle < 0) vf -= (vf > 0 ? BRAKE : ACC * 0.6) * dt;
    if (this.hb) vf -= sign(vf) * 210 * dt;

    vf -= vf * 0.85 * dt;
    vf = clamp(vf, -REVMAX, MAXSPD * mul);

    /* grip / drift */
    const grip = this.hb ? 1.35 : (surf === S_ROAD ? 8.5 : 5.2);
    const before = vl;
    vl *= Math.exp(-grip * dt);
    this.slip = Math.abs(before - vl);

    this.vx = fx * vf - fy * vl;
    this.vy = fy * vf + fx * vl;

    /* move with axis separation */
    let bump = 0;
    const nx = this.x + this.vx * dt;
    if (!carBlocked(nx, this.y, this.ang)) this.x = nx;
    else { bump = Math.abs(this.vx); this.vx *= -0.3; this.vy *= 0.72; }
    const ny = this.y + this.vy * dt;
    if (!carBlocked(this.x, ny, this.ang)) this.y = ny;
    else { bump = Math.max(bump, Math.abs(this.vy)); this.vy *= -0.3; this.vx *= 0.72; }

    this.x = clamp(this.x, 12, WW - 12);
    this.y = clamp(this.y, 12, WH - 12);

    if (bump > 40) {
      this.impact = 1;
      G.shake = Math.max(G.shake, clamp(bump / 26, 1, 7));
      G.hitstop = Math.max(G.hitstop, bump > 110 ? 0.07 : 0.03);
      Audio5.sfx(bump > 110 ? 'crash' : 'bump');
      for (let i = 0; i < (bump > 110 ? 14 : 6); i++)
        Fx.spark(this.x + rand(-8, 8), this.y + rand(-8, 8), rand(-60, 60), rand(-60, 60));
      if (bump > 110) { G.onCrash(); }
    }

    /* skid marks */
    this.skidT -= dt;
    if (this.slip > 26 && spd > 40 && this.skidT <= 0 && surf === S_ROAD) {
      this.skidT = 0.012;
      const c = Math.cos(this.ang), s = Math.sin(this.ang);
      City.gx.fillStyle = 'rgba(22,16,30,0.30)';
      for (const ly of [-4.5, 4.5]) {
        City.gx.fillRect((this.x - 7 * c - ly * s) | 0, (this.y - 7 * s + ly * c) | 0, 2, 2);
      }
    }
    /* dust off-road */
    if (spd > 50 && (surf === S_GRASS || surf === S_WALK) && Math.random() < 0.4)
      Fx.dust(this.x - Math.cos(this.ang) * 8, this.y - Math.sin(this.ang) * 8, surf === S_GRASS ? '#6b8f4a' : '#a8adba');
  }

  spinOut(dir) { this.spinT = 0.55; this.spinDir = dir || 1; this.vx *= 0.35; this.vy *= 0.35; }

  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    x.fillStyle = PAL.shadow;
    x.fillRect((sx - 8) | 0, (sy - 3) | 0, 17, 11);
    drawRot(x, Art.player, sx, sy, this.ang);
  }
}

/* ---------------- traffic --------------------------------- */
class Traffic {
  constructor(x, y, dir, laneNode, ci) {
    this.x = x; this.y = y; this.dir = dir; this.laneNode = laneNode;
    this.spd = rand(58, 96); this.want = this.spd;
    this.frames = Art.car[ci];
    this.dec = null; this.decN = -1;
    this.stun = 0; this.honk = 0;
  }
  static laneFixed(node, dir) {
    return SEG0 + node * PITCH + ((dir === 0 || dir === 3) ? 24 : 8);
  }
  update(dt, G) {
    if (this.stun > 0) { this.stun -= dt; this.spd *= 0.9; }
    const axis = this.dir % 2 === 0 ? 'x' : 'y';
    const pos  = axis === 'x' ? this.x : this.y;
    const posDir = (this.dir === 0 || this.dir === 1) ? 1 : -1;

    /* --- intersection decision --- */
    const rel = pos - SEG0;
    let n = Math.floor(rel / PITCH);
    const off = rel - n * PITCH;
    const atEdge = posDir > 0 ? (n >= BLOCKS) : (n <= 0);
    if (off >= -2 && off <= 34) {
      if (this.dec === null || this.decN !== n) {
        this.decN = n;
        const r = Math.random();
        if (atEdge) this.dec = r < 0.5 ? 'R' : 'L';
        else this.dec = r < 0.62 ? 'S' : (r < 0.81 ? 'R' : 'L');
        // keep turns inside the grid
        const lane2 = this.laneNode;
        if (this.dec === 'R' || this.dec === 'L') {
          const nd = this.dec === 'R' ? (this.dir + 1) % 4 : (this.dir + 3) % 4;
          const goPos = (nd === 0 || nd === 1);
          if ((goPos && lane2 >= BLOCKS) || (!goPos && lane2 <= 0)) this.dec = atEdge ? (this.dec === 'R' ? 'L' : 'R') : 'S';
        }
      }
      if (this.dec !== 'S') {
        const A = SEG0 + n * PITCH;
        const isR = this.dec === 'R';
        const tOff = ((this.dir === 0 || this.dir === 1) ? (isR ? 8 : 24) : (isR ? 24 : 8));
        const tp = A + tOff;
        const reached = posDir > 0 ? pos >= tp : pos <= tp;
        if (reached) {
          const nd = isR ? (this.dir + 1) % 4 : (this.dir + 3) % 4;
          if (axis === 'x') this.x = tp; else this.y = tp;
          this.laneNode = n;
          this.dir = nd;
          this.dec = 'S';
          const f = Traffic.laneFixed(this.laneNode, nd);
          if (nd % 2 === 0) this.y = f; else this.x = f;
        }
      }
    } else if (off > 40) this.dec = null;

    /* --- keep to the lane --- */
    const fixed = Traffic.laneFixed(this.laneNode, this.dir);
    if (this.dir % 2 === 0) this.y = approach(this.y, fixed, 90 * dt);
    else                    this.x = approach(this.x, fixed, 90 * dt);

    /* --- car ahead / player ahead --- */
    const d = DIRV[this.dir];
    let block = 999;
    for (const o of G.traffic) {
      if (o === this) continue;
      if (o.dir !== this.dir || o.laneNode !== this.laneNode) continue;
      const dx = (o.x - this.x) * d[0] + (o.y - this.y) * d[1];
      const side = Math.abs((o.x - this.x) * d[1] - (o.y - this.y) * d[0]);
      if (dx > 0 && dx < block && side < 12) block = dx;
    }
    const pdx = (G.player.x - this.x) * d[0] + (G.player.y - this.y) * d[1];
    const pside = Math.abs((G.player.x - this.x) * d[1] - (G.player.y - this.y) * d[0]);
    if (pdx > 0 && pdx < 46 && pside < 14) {
      block = Math.min(block, pdx);
      this.honk -= dt;
      if (this.honk <= 0 && pdx < 34 && G.nearScreen(this.x, this.y)) { Audio5.sfx('horn'); this.honk = 2.4; }
    }
    this.spd = block < 40 ? approach(this.spd, block < 22 ? 0 : 26, 320 * dt)
                          : approach(this.spd, this.want, 90 * dt);

    this.x += d[0] * this.spd * dt;
    this.y += d[1] * this.spd * dt;
  }
  get ang() { return this.dir * (PI / 2); }
  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    x.fillStyle = PAL.shadow;
    x.fillRect((sx - 8) | 0, (sy - 3) | 0, 17, 11);
    drawRot(x, this.frames, sx, sy, this.ang);
  }
}

/* ---------------- pedestrian ------------------------------ */
class Ped {
  constructor(bx, by, rng) {
    const a = (BORDER + bx * SPAN + 2) * TS + 8;
    const b = (BORDER + by * SPAN + 2) * TS + 8;
    this.r = { x: a, y: b, w: 9 * TS, h: 9 * TS };
    this.per = 2 * (this.r.w + this.r.h);
    this.t = Math.random() * this.per;
    this.cw = Math.random() < 0.5 ? 1 : -1;
    this.spd = rand(17, 27);
    this.set = Art.ped[(Math.random() * Art.ped.length) | 0];
    this.f = 0; this.ft = 0; this.dir = 2;
    this.tumble = 0; this.vx = 0; this.vy = 0; this.spin = 0; this.pause = 0;
    this.place();
  }
  place() {
    const t = ((this.t % this.per) + this.per) % this.per;
    const { x, y, w, h } = this.r;
    let seg;
    if (t < w)              { this.x = x + t;                   this.y = y;                       seg = 0; }
    else if (t < w + h)     { this.x = x + w;                   this.y = y + (t - w);             seg = 1; }
    else if (t < 2 * w + h) { this.x = x + w - (t - w - h);     this.y = y + h;                   seg = 2; }
    else                    { this.x = x;                       this.y = y + h - (t - 2 * w - h); seg = 3; }
    // walking clockwise the edges face E,S,W,N; anticlockwise is the reverse
    const cwDir = [1, 2, 3, 0][seg];
    this.dir = this.cw > 0 ? cwDir : (cwDir + 2) % 4;
  }
  update(dt, G) {
    if (this.tumble > 0) {
      this.tumble -= dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= 0.93; this.vy *= 0.93; this.spin += dt * 16;
      if (this.tumble <= 0) { this.t = Math.random() * this.per; this.place(); }
      return;
    }
    if (this.pause > 0) { this.pause -= dt; return; }
    if (Math.random() < 0.0015) { this.pause = rand(0.6, 2); return; }
    this.t += this.spd * this.cw * dt;
    this.place();
    this.ft += dt;
    if (this.ft > 0.19) { this.ft = 0; this.f ^= 1; }
  }
  hitBy(px, py, vx, vy) {
    this.tumble = 1.5;
    const d = hyp(vx, vy) || 1;
    this.vx = vx / d * 130; this.vy = vy / d * 130 - 30;
    this.spin = 0;
  }
  draw(x, cam) {
    const sx = (this.x - cam.x) | 0, sy = (this.y - cam.y) | 0;
    x.fillStyle = PAL.shadow;
    x.fillRect(sx - 4, sy - 1, 9, 4);
    const img = this.set[this.dir][this.f];
    if (this.tumble > 0) {
      x.save();
      x.translate(sx, sy - 6);
      x.rotate(this.spin);
      x.drawImage(img, -4, -8);
      x.restore();
    } else x.drawImage(img, sx - 4, sy - 13);
  }
}

/* ---------------- cop ------------------------------------- */
class Cop {
  constructor(x, y, ang) {
    this.x = x; this.y = y; this.ang = ang; this.vx = 0; this.vy = 0;
    this.flash = 0; this.hitCd = 0; this.life = 0;
  }
  get speed() { return hyp(this.vx, this.vy); }
  update(dt, G) {
    this.life += dt; this.flash += dt; this.hitCd -= dt;
    const t = G.player;
    let want = Math.atan2(t.y - this.y, t.x - this.x);

    /* crude obstacle probe */
    const probe = (a, d) => City.isSolid(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d);
    if (probe(this.ang, 30)) {
      const l = probe(this.ang - 0.7, 30), r = probe(this.ang + 0.7, 30);
      want = this.ang + (l && !r ? 0.9 : r && !l ? -0.9 : (this.life % 2 < 1 ? 1.2 : -1.2));
    }
    const err = angDiff(this.ang, want);
    const steer = clamp(err * 2.4, -1, 1);
    const spd = this.speed;
    this.ang += steer * TURNRATE * clamp(spd / 46, 0, 1) * (1 - 0.28 * clamp(spd / MAXSPD, 0, 1)) * dt;

    const fx = Math.cos(this.ang), fy = Math.sin(this.ang);
    let vf = this.vx * fx + this.vy * fy;
    let vl = -this.vx * fy + this.vy * fx;
    const surf = City.surfaceAt(this.x, this.y);
    const mul = SURF_MUL[surf] || 1;
    vf += ACC * mul * dt * (Math.abs(err) > 1.5 ? 0.45 : 1);
    vf -= vf * 0.85 * dt;
    vf = clamp(vf, -REVMAX, MAXSPD * mul * 1.02);
    vl *= Math.exp(-7.5 * dt);
    this.vx = fx * vf - fy * vl; this.vy = fy * vf + fx * vl;

    const nx = this.x + this.vx * dt;
    if (!carBlocked(nx, this.y, this.ang)) this.x = nx; else this.vx *= -0.35;
    const ny = this.y + this.vy * dt;
    if (!carBlocked(this.x, ny, this.ang)) this.y = ny; else this.vy *= -0.35;
    this.x = clamp(this.x, 12, WW - 12); this.y = clamp(this.y, 12, WH - 12);
  }
  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    x.fillStyle = PAL.shadow;
    x.fillRect((sx - 8) | 0, (sy - 3) | 0, 17, 11);
    drawRot(x, Art.cop, sx, sy, this.ang);
    const on = (this.flash * 6 | 0) % 2;
    x.fillStyle = on ? PAL.siren1 : PAL.siren2;
    x.fillRect((sx - 2) | 0, (sy - 2) | 0, 4, 4);
    x.globalAlpha = 0.30;
    x.fillRect((sx - 7) | 0, (sy - 7) | 0, 14, 14);
    x.globalAlpha = 1;
  }
}

/* ---------------- taco bag projectile --------------------- */
const THROW_T = 0.5, GRAV = 260, Z0 = 5;
const MAXTHROW = 132;

class Bag {
  constructor(x, y, tx, ty, spread) {
    this.x = x; this.y = y; this.z = Z0;
    const dx = tx - x, dy = ty - y;
    const sp = spread || 0;
    this.vx = dx / THROW_T + rand(-sp, sp);
    this.vy = dy / THROW_T + rand(-sp, sp);
    this.vz = (0 - Z0 + 0.5 * GRAV * THROW_T * THROW_T) / THROW_T;
    this.f = 0; this.dead = false; this.tx = tx; this.ty = ty;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vz -= GRAV * dt; this.z += this.vz * dt;
    this.f += dt * 14;
    if (this.z <= 0) { this.z = 0; this.dead = true; }
  }
  draw(x, cam) {
    const sx = (this.x - cam.x) | 0, sy = (this.y - cam.y) | 0;
    const sc = clamp(1 - this.z / 90, 0.4, 1);
    x.globalAlpha = 0.22 + sc * 0.2;
    x.fillStyle = '#100c18';
    x.fillRect(sx - 4, sy - 2, 9, 5);
    x.globalAlpha = 1;
    x.drawImage(Art.bag[(this.f | 0) % 4], sx - 6, (sy - this.z - 6) | 0);
  }
}

const Fx = {

  dust(x, y, c)       { this.ps.push({ x, y, z: 2, vx: rand(-18, 18), vy: rand(-18, 18), vz: rand(8, 26), g: 60, life: rand(0.3, 0.6), t: 0, c, s: 2 }); },
  spill(x, y)         { for (let i = 0; i < 12; i++) this.ps.push({ x, y, z: 4, vx: rand(-70, 70), vy: rand(-70, 70), vz: rand(30, 90), g: 320, life: rand(0.35, 0.7), t: 0, c: SPILL[(Math.random() * SPILL.length) | 0], s: 2 }); },
  cash(x, y)          { for (let i = 0; i < 10; i++) this.ps.push({ x, y, z: 6, vx: rand(-45, 45), vy: rand(-45, 45), vz: rand(50, 110), g: 210, life: rand(0.5, 0.9), t: 0, c: Math.random() < 0.5 ? PAL.good : PAL.amber, s: 2 }); },
  star(x, y)          { for (let i = 0; i < 8; i++) this.ps.push({ x, y, z: 8, vx: rand(-40, 40), vy: rand(-40, 40), vz: rand(20, 60), g: 150, life: 0.5, t: 0, c: PAL.bone, s: 1 }); },

  pop(x, y, txt, col, big) { this.pops.push({ x, y, txt, col, t: 0, life: big ? 1.5 : 1.05, s: big ? 2 : 1 }); },

  },

  update(dt) {
    for (let i = this.ps.length - 1; i >= 0; i--) {
      const p = this.ps[i];

      p.x += p.vx * dt; p.y += p.vy * dt;

    for (const p of this.pops) {
      const a = p.t / p.life;
