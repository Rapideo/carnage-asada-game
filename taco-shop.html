      textOut(x, p.txt, (p.x - cam.x) | 0, (p.y - cam.y) | 0, p.col, p.s, 1);
      x.globalAlpha = 1;
    }
  },
  clear() { this.ps.length = 0; this.pops.length = 0; },
};

function rand(a, b) { return a + Math.random() * (b - a); }


/* ===== 60_nav.js ===== */
/* ============================================================
   NAV  --  "TACO-NAV 2000", a rudimentary guidance unit
   ============================================================ */
'use strict';

const TURN_NAMES = ['CONTINUE', 'TURN RIGHT', 'MAKE A U-TURN', 'TURN LEFT'];

const Nav = {
  goal: null,          // {x, y, node:[nx,ny], label}
  route: [],           // [[nx,ny], ...] nodes still ahead
  recalcT: 0,
  glitch: 0,           // >0 => panel shows RECALCULATING
  chirp: 0,
  turn: 0, dist: 0, arriving: false, lost: false,
  lastKey: '',

  setGoal(g) {
    this.goal = g;
    this.route = [];
    this.recalcT = 0;
    this.glitch = 0.85;
    this.lastKey = '';
    Audio5.sfx('recalc');
  },
  clear() { this.goal = null; this.route = []; },

  update(dt, p) {
    this.glitch = Math.max(0, this.glitch - dt);
    this.chirp = Math.max(0, this.chirp - dt);
    if (!this.goal) return;

    this.recalcT -= dt;
    if (this.recalcT <= 0) {
      this.recalcT = 0.4;
      this.recompute(p);
    }

    const gx2 = this.goal.x, gy2 = this.goal.y;
    const straight = hyp(gx2 - p.x, gy2 - p.y);
    this.arriving = straight < 165 || this.route.length === 0;

    if (this.arriving) {
      this.dist = straight;
      const want = Math.atan2(gy2 - p.y, gx2 - p.x);
      this.turn = relTurn(cardinal(p.ang), cardinal(want));
    } else {
      const a = this.route[0];
      const ax = City.nodeX(a[0]), ay = City.nodeY(a[1]);
      this.dist = hyp(ax - p.x, ay - p.y);
      const b = this.route[1];
      let exit;
      if (b) exit = cardinal(Math.atan2(City.nodeY(b[1]) - ay, City.nodeX(b[0]) - ax));
      else   exit = cardinal(Math.atan2(gy2 - ay, gx2 - ax));
      const approach = hyp(p.vx, p.vy) > 22 ? cardinal(Math.atan2(p.vy, p.vx)) : cardinal(p.ang);
      this.turn = relTurn(approach, exit);
      if (this.dist < 44 && this.turn !== 0 && this.chirp <= 0) { Audio5.sfx('nav'); this.chirp = 1.6; }
    }

    // off the tarmac == the unit loses its mind
    const s = City.surfaceAt(p.x, p.y);
    this.lost = (s === S_GRASS || s === S_WALK);
  },

  recompute(p) {
    const s = [City.nearNodeX(p.x), City.nearNodeY(p.y)];
    const g = this.goal.node;
    const initDir = cardinal(hyp(p.vx, p.vy) > 22 ? Math.atan2(p.vy, p.vx) : p.ang);
    const path = solve(s, g, initDir);

    // drop the head node if we have already driven past it
    if (path.length >= 2) {
      const n0 = path[0], n1 = path[1];
      const d01 = hyp(City.nodeX(n1[0]) - City.nodeX(n0[0]), City.nodeY(n1[1]) - City.nodeY(n0[1]));
      const dp1 = hyp(City.nodeX(n1[0]) - p.x, City.nodeY(n1[1]) - p.y);
      if (dp1 < d01 - 12) path.shift();
    }
    const key = path.map((n) => n[0] + ',' + n[1]).join('|');
    if (key !== this.lastKey) {
      if (this.lastKey && this.route.length > 1) this.glitch = 0.45;
      this.lastKey = key;
    }
    this.route = path;
  },

  /* route painted on the tarmac as chunky chevrons */
  drawRoute(x, cam, time) {
    if (!this.goal || this.glitch > 0.25) return;
    const pts = [];
    for (const n of this.route) pts.push([City.nodeX(n[0]), City.nodeY(n[1])]);
    pts.push([this.goal.cx || this.goal.x, this.goal.cy || this.goal.y]);
    if (!pts.length) return;

    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const len = hyp(bx - ax, by - ay);
      if (len < 1) continue;
      const ux = (bx - ax) / len, uy = (by - ay) / len;
      const ang = Math.atan2(uy, ux);
      for (let d = 10; d < len - 6; d += 22) {
        const px = ax + ux * d, py = ay + uy * d;
        const sx = px - cam.x, sy = py - cam.y;
        if (sx < -14 || sy < -14 || sx > VW + 14 || sy > VH + 14) continue;
        const ph = ((d * 0.02 - time * 1.5) % 1 + 1) % 1;
        x.globalAlpha = 0.30 + 0.42 * (1 - ph);
        chevron(x, sx, sy, ang, PAL.cyan);
      }
    }
    x.globalAlpha = 1;
  },
};

function chevron(x, sx, sy, ang, col) {
  const c = Math.cos(ang), s = Math.sin(ang);
  x.fillStyle = col;
  // two nested arrow bars, drawn as 2x2 blocks so it stays chunky
  for (let i = -4; i <= 4; i++) {
    const t = 4 - Math.abs(i);
    for (const off of [0, 5]) {
      const lx = t - 4 + off, ly = i;
      x.fillRect(Math.round(sx + lx * c - ly * s) - 1, Math.round(sy + lx * s + ly * c) - 1, 2, 2);
    }
  }
}

/* cardinal index for an angle: 0=E 1=S 2=W 3=N */
function cardinal(a) {
  let i = Math.round(a / (PI / 2)) % 4;
  if (i < 0) i += 4;
  return i;
}
/* 0 straight, 1 right, 2 u-turn, 3 left */
function relTurn(from, to) { return ((to - from) % 4 + 4) % 4; }

/* ---- dijkstra over (intersection, arrival direction) ------ */
function solve(start, goal, initDir) {
  const N = NODES * NODES * 4;
  const cost = new Float32Array(N).fill(Infinity);
  const prev = new Int32Array(N).fill(-1);
  const done = new Uint8Array(N);
  const idx = (nx, ny, d) => ((ny * NODES + nx) * 4 + d);

  for (let d = 0; d < 4; d++) cost[idx(start[0], start[1], d)] = d === initDir ? 0 : 0.35;

  let best = -1;
  for (;;) {
    let u = -1, c = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && cost[i] < c) { c = cost[i]; u = i; }
    if (u < 0) break;
    done[u] = 1;
    const d = u & 3, node = u >> 2, nx = node % NODES, ny = (node / NODES) | 0;
    if (nx === goal[0] && ny === goal[1]) { best = u; break; }
    for (let nd = 0; nd < 4; nd++) {
      const mx = nx + DIRV[nd][0], my = ny + DIRV[nd][1];
      if (mx < 0 || my < 0 || mx >= NODES || my >= NODES) continue;
      const step = 1 + (nd === d ? 0 : nd === (d + 2) % 4 ? 1.8 : 0.45);
      const v = idx(mx, my, nd);
      if (c + step < cost[v]) { cost[v] = c + step; prev[v] = u; }
    }
  }
  if (best < 0) return [];
  const out = [];
  for (let u = best; u >= 0; u = prev[u]) {
    const node = u >> 2;
    out.push([node % NODES, (node / NODES) | 0]);
  }
  out.reverse();
  return out;
}


/* ===== 70_hud.js ===== */
/* ============================================================
   HUD  --  order card, tip meter, TACO-NAV panel, minimap
   ============================================================ */
'use strict';

const MM = 52;                      // minimap edge in px

const Hud = {
  mapImg: null,

  buildMap() {
    const t = mkCanvas(MM, MM);
    const x = t.x;
    R(x, PAL.sea, 0, 0, MM, MM);
    // roads are 2 tiles wide but a minimap pixel covers ~2 tiles, so point
    // sampling drops whole streets — take the most important class in the cell
    const step = GW / MM;
    for (let my = 0; my < MM; my++) for (let mx = 0; mx < MM; mx++) {
      const tx0 = (mx * step) | 0, ty0 = (my * step) | 0;
      let road = false, walk = false, land = false;
      for (let dy = 0; dy < Math.ceil(step); dy++) for (let dx = 0; dx < Math.ceil(step); dx++) {
        const c = classify(tx0 + dx, ty0 + dy);
        if (c === T_ROAD || c === T_INTER) road = true;
        else if (c === T_WALK) walk = true;
        else if (c === T_LOT) land = true;
      }
      const col = road ? '#828799' : walk ? '#4a4e5e' : land ? '#343848' : PAL.sea;
      R(x, col, mx, my, 1, 1);
    }
    this.mapImg = t.c;
  },

  panel(x, px, py, w, h, accent) {
    R(x, PAL.ink, px, py, w, h);
    R(x, '#2c2338', px + 1, py + 1, w - 2, h - 2);
    x.strokeStyle = accent || '#5b5170'; x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
    R(x, 'rgba(255,255,255,0.07)', px + 1, py + 1, w - 2, 1);
  },

  draw(x, G) {
    if (!this.mapImg) this.buildMap();
    const o = G.order;

    /* ---------- order + tip ----------
       44 tall, matching the clock card opposite. It has to be: the scale-2
       money readout occupies y23..36, so a 37-tall card left no room and the
       decay bar was painted over the bottom 3px of the digits. */
    this.panel(x, 3, 3, 140, 44, '#6b5f84');
    if (o) {
      text(x, G.needPickup ? 'OUT OF TACOS - RESTOCK AT' : 'DELIVER TO', 8, 7,
        G.needPickup ? PAL.bad : PAL.boneDim, 1);
      text(x, G.needPickup ? 'TACO SHOP  (' + o.label + ' WAITING)' : o.label, 8, 15, PAL.bone, 1);
      const pop = G.tipPop > 0 ? 1 : 0;
      text(x, money(o.tip), 8, 23, o.tip <= o.floor + 1 ? PAL.bad : PAL.amber, 2);
      text(x, 'TIP', 8 + textW(money(o.tip), 2) + 5, 29, PAL.boneDim, 1);
      if (pop) { x.globalAlpha = 0.5; text(x, money(o.tip), 8, 23, PAL.bone, 2); x.globalAlpha = 1; }
      // decay bar
      const f = clamp((o.tip - o.floor) / (o.max - o.floor), 0, 1);
      R(x, '#1b1425', 7, 39, 132, 4);
      const bw = Math.round(130 * f);
      R(x, f > 0.5 ? PAL.amber : f > 0.22 ? '#e07a1f' : PAL.bad, 8, 40, bw, 2);
      for (let i = 8; i < 138; i += 6) R(x, 'rgba(0,0,0,0.35)', i, 40, 1, 2);
    } else {
      text(x, 'NO ACTIVE ORDER', 8, 15, PAL.boneDim, 1);
    }

    /* ---------- clock + earnings ----------
       widths are tight at 384px: labels sit left at 1x, values right at 2x,
       sized so a 7-char "$999.99" still clears the label */
    const pw = 128, px0 = VW - pw + 1;
    this.panel(x, VW - pw - 3, 3, pw, 44, '#6b5f84');
    text(x, 'SHIFT', px0, 8, PAL.boneDim, 1);
    const low = G.shift < 20;
    text(x, clockStr(G.shift), VW - 7, 5, low && (G.time * 4 | 0) % 2 ? PAL.bad : PAL.bone, 2, 2);
    text(x, 'PAID', px0, 23, PAL.boneDim, 1);
    text(x, money(G.earned), VW - 7, 20, PAL.good, 2, 2);
    // heat
    text(x, 'HEAT', px0, 37, PAL.boneDim, 1);
    R(x, '#1b1425', px0 + 26, 36, 90, 5);
    const hf = clamp(G.heat / G.heatMax, 0, 1);
    R(x, hf > 0.75 ? PAL.bad : hf > 0.4 ? '#e07a1f' : '#5b6a8a', px0 + 27, 37, Math.round(88 * hf), 3);
    if (G.cop) textOut(x, 'IN PURSUIT', px0 + 26, 36, PAL.bad, 1);

    /* ---------- combo ---------- */
    if (G.combo > 1.001) {
      textOut(x, 'X' + G.combo.toFixed(2) + ' STREAK', VW - 6, 51,
        G.comboPop > 0 ? PAL.bone : PAL.amber, 1, 2);
    }

    /* ---------- minimap ---------- */
    const mx0 = 4, my0 = VH - MM - 4;
    R(x, PAL.ink, mx0 - 2, my0 - 2, MM + 4, MM + 4);
    x.globalAlpha = 0.88; x.drawImage(this.mapImg, mx0, my0); x.globalAlpha = 1;
    const w2m = (wx) => mx0 + wx / WW * MM, h2m = (wy) => my0 + wy / WH * MM;
    // route breadcrumbs
    if (Nav.goal) {
      x.fillStyle = PAL.cyanLo;
      for (const n of Nav.route) x.fillRect(w2m(City.nodeX(n[0])) | 0, h2m(City.nodeY(n[1])) | 0, 1, 1);
    }
    // shop
    R(x, PAL.red, w2m(City.shop.x + 60) - 1, h2m(City.shop.y + 40) - 1, 3, 3);
    // goal
    if (Nav.goal) {
      const blink = (G.time * 5 | 0) % 2;
      R(x, blink ? PAL.amber : PAL.bone, w2m(Nav.goal.x) - 2, h2m(Nav.goal.y) - 2, 5, 5);
      R(x, PAL.ink, w2m(Nav.goal.x) - 1, h2m(Nav.goal.y) - 1, 3, 3);
    }
    // cop
    if (G.cop) R(x, (G.time * 6 | 0) % 2 ? PAL.siren1 : PAL.siren2, w2m(G.cop.x) - 1, h2m(G.cop.y) - 1, 3, 3);
    // player
    R(x, PAL.bone, w2m(G.player.x) - 1, h2m(G.player.y) - 1, 3, 3);
    R(x, PAL.ink2, w2m(G.player.x), h2m(G.player.y), 1, 1);
    x.strokeStyle = '#6b5f84'; x.lineWidth = 1;
    x.strokeRect(mx0 - 1.5, my0 - 1.5, MM + 3, MM + 3);

    /* ---------- TACO-NAV ---------- */
    this.drawNav(x, G);

    /* ---------- taco bag ---------- */
    const bx0 = VW - 76, by0 = VH - 20;
    text(x, 'TACO BAG', bx0, by0 - 9, PAL.boneDim, 1);
    for (let i = 0; i < G.bagMax; i++) {
      const px = bx0 + i * 15, py = by0;
      if (i < G.bag) {
        R(x, PAL.ink, px, py, 13, 13);
        R(x, BAG_MID, px + 1, py + 1, 11, 11);
        R(x, BAG_HI, px + 1, py + 1, 11, 1);
        R(x, BAG_LO, px + 1, py + 3, 11, 1);
        R(x, BAG_LO, px + 1, py + 10, 11, 2);
        R(x, PAL.jade, px + 4, py + 5, 5, 4);
        R(x, PAL.gold, px + 5, py + 6, 3, 1);
      } else {
        R(x, '#2c2338', px, py, 13, 13);
        x.strokeStyle = '#4a4058'; x.strokeRect(px + 0.5, py + 0.5, 12, 12);
      }
    }

    /* ---------- edge arrow to target ---------- */
    this.edgeArrow(x, G);

    /* ---------- banners ---------- */
    if (G.banner && G.bannerT > 0) {
      const a = clamp(G.bannerT / 0.4, 0, 1);
      x.globalAlpha = a;
      const w = textW(G.banner, 2) + 16;
      R(x, PAL.ink, (VW - w) / 2 | 0, 60, w, 20);
      x.strokeStyle = G.bannerCol; x.strokeRect(((VW - w) / 2 | 0) + 0.5, 60.5, w - 1, 19);
      text(x, G.banner, VW / 2, 66, G.bannerCol, 2, 1);
      x.globalAlpha = 1;
    }
  },

  drawNav(x, G) {
    const w = 128, h = 34, px = (VW - w) / 2 | 0, py = VH - h - 4;
    R(x, PAL.ink, px, py, w, h);
    R(x, '#0e1c1c', px + 1, py + 1, w - 2, h - 2);
    x.strokeStyle = PAL.cyanLo; x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
    // LCD scan lines
    x.fillStyle = 'rgba(63,184,176,0.055)';
    for (let i = py + 2; i < py + h - 1; i += 2) x.fillRect(px + 1, i, w - 2, 1);

    text(x, 'TACO-NAV 2000', px + 4, py + 3, PAL.cyanLo, 1);

    if (!Nav.goal) { text(x, 'STANDBY', px + w / 2, py + 15, PAL.cyanLo, 2, 1); return; }

    if (Nav.glitch > 0 || Nav.lost) {
      const flick = (G.time * 9 | 0) % 2;
      text(x, flick ? 'RECALCULATING' : 'RECALCULATING.', px + w / 2, py + 14, flick ? PAL.cyan : PAL.cyanLo, 1, 1);
      text(x, Nav.lost ? 'RETURN TO ROADWAY' : 'PLEASE WAIT', px + w / 2, py + 24, PAL.cyanLo, 1, 1);
      return;
    }

    const arrowX = px + 17, arrowY = py + 20;
    navArrow(x, arrowX, arrowY, Nav.arriving ? 4 : Nav.turn, PAL.cyan, G.time);

    const label = Nav.arriving ? 'ARRIVING' : TURN_NAMES[Nav.turn];
    text(x, label, px + 34, py + 12, PAL.cyan, 1);
    const m = Math.max(0, Math.round(Nav.dist / 8 / 5) * 5);
    text(x, Nav.arriving ? 'TOSS THE BAG' : ('IN ' + m + ' M'), px + 34, py + 22, PAL.cyanLo, 1);
    if (Nav.arriving) {
      const b = (G.time * 6 | 0) % 2;
      R(x, b ? PAL.cyan : PAL.cyanLo, px + w - 6, py + 4, 3, 3);
    }
  },

  edgeArrow(x, G) {
    if (!Nav.goal) return;
    const cam = G.cam;
    const sx = Nav.goal.x - cam.x, sy = Nav.goal.y - cam.y;
    const pad = 16;
    if (sx > pad && sx < VW - pad && sy > pad && sy < VH - pad) return;
    // keep the arrow inside the clear band: below the top panels,
    // above the nav unit, clear of the minimap
    const cx = VW / 2, cy = VH / 2;
    const a = Math.atan2(sy - cy, sx - cx);
    const hw = VW / 2 - 26, hh = VH / 2 - 52;
    const t = Math.min(Math.abs(hw / Math.cos(a)), Math.abs(hh / Math.sin(a)));
    const ex = cx + Math.cos(a) * t, ey = cy + Math.sin(a) * t;
    const pulse = 0.6 + 0.4 * Math.sin(G.time * 7);
    x.globalAlpha = pulse;
    triArrow(x, ex, ey, a, 9, PAL.amber, PAL.ink);
    x.globalAlpha = 1;
    const m = Math.round(hyp(Nav.goal.x - G.player.x, Nav.goal.y - G.player.y) / 8);
    textOut(x, m + 'M', ex, ey - 17, PAL.amber, 1, 1);
  },
};

/* chunky turn arrow. kind: 0 straight 1 right 2 uturn 3 left 4 arriving */
function navArrow(x, cx, cy, kind, col, time) {
  const b = (px, py, w, h) => R(x, col, cx + px, cy + py, w, h);
  // 3-step solid arrowheads, tip one px beyond the last step
  const hUp    = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - (i + 1), ay - 3 + i, (i + 1) * 2, 1); };
  const hDown  = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - (i + 1), ay + 2 - i, (i + 1) * 2, 1); };
  const hRight = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax + 2 - i, ay - (i + 1), 1, (i + 1) * 2); };
  const hLeft  = (ax, ay) => { for (let i = 0; i < 3; i++) b(ax - 2 + i, ay - (i + 1), 1, (i + 1) * 2); };

  if (kind === 0) {                        // continue straight
    hUp(0, -4);  b(-2, -5, 4, 13);
  } else if (kind === 1) {                 // turn right
    b(-8, -2, 4, 10);  b(-8, -6, 12, 4);  hRight(4, -4);
  } else if (kind === 3) {                 // turn left
    b(4, -2, 4, 10);   b(-4, -6, 12, 4);  hLeft(-4, -4);
  } else if (kind === 2) {                 // u-turn
    b(3, -4, 4, 12);   b(-5, -8, 12, 4);  b(-5, -4, 4, 5);  hDown(-3, 1);
  } else {                                 // arriving — bobbing marker
    const bob = (Math.sin(time * 6) * 1.5) | 0;
    hDown(0, 3 + bob);  b(-2, -6 + bob, 4, 9);
    if ((time * 4 | 0) % 2) { b(-6, 7, 12, 2); }
  }
}

function triArrow(x, cx, cy, a, r, col, outline) {
  const c = Math.cos(a), s = Math.sin(a);
  const P = [[r, 0], [-r * 0.7, -r * 0.75], [-r * 0.7, r * 0.75]];
  x.beginPath();
  P.forEach(([lx, ly], i) => {
    const px = cx + lx * c - ly * s, py = cy + lx * s + ly * c;
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  });
  x.closePath();
  x.fillStyle = col; x.fill();
  x.strokeStyle = outline; x.lineWidth = 1; x.stroke();
}


/* ===== 80_game.js ===== */
/* ============================================================
   TACO SHOP: CARNAGE ASADA  --  game loop, shift structure, render pipeline
   ============================================================ */
'use strict';

const SHIFT_START  = 110;
const TIME_PER_JOB = 9;
const TIME_PERFECT = 3;
const TIP_MAX = 1500, TIP_FLOOR = 200, TIP_DECAY = 55;
const PERFECT_BONUS = 500;
const REMAKE_FEE = 150, PED_FINE = 200, TICKET = 1500;
const HEAT_MAX = 100;
const BAG_MAX = 3;
const THROW_CD = 0.34;

const G = {
  state: 'boot', time: 0, shift: 0, earned: 0,
  combo: 1, comboPop: 0, heat: 0, heatMax: HEAT_MAX,
  bag: BAG_MAX, bagMax: BAG_MAX, needPickup: false,
  player: null, traffic: [], peds: [], flying: [], cop: null, copT: 0,
  cam: { x: 0, y: 0 }, shake: 0, hitstop: 0,
  order: null, banner: '', bannerT: 0, bannerCol: PAL.bone,
  throwCd: 0, restock: 0, tipPop: 0, infraction: 0,
  stats: null, titleCam: 0, paused: false, flash: 0,
  rl: [],

  /* ---------------- setup ------------------------------- */
  boot(seed) {
    const rng = makeRng(seed);
    Art.build(makeRng(seed ^ 0x5eed));
    City.gen(rng);
    Hud.buildMap();
    this.toTitle();
  },

  toTitle() {
    this.state = 'title';
    this.titleCam = 0;
    this.player = new Player(City.shop.dock.x, City.shop.dock.y + 70, -PI / 2);
    this.traffic.length = 0; this.peds.length = 0; this.flying.length = 0;
    this.cop = null; Nav.clear(); Fx.clear();
    this.cam.x = clamp(City.shop.x - VW / 2, 0, WW - VW);
    this.cam.y = clamp(City.shop.y - VH / 2, 0, WH - VH);
    this.seedTraffic(26); this.seedPeds(20);
  },

  startShift() {
    this.state = 'play';
    this.time = 0; this.shift = SHIFT_START; this.earned = 0;
    this.combo = 1; this.comboPop = 0; this.heat = 0;
    this.bag = BAG_MAX; this.needPickup = false;
    this.cop = null; this.copT = 0; this.shake = 0; this.hitstop = 0;
    this.throwCd = 0; this.restock = 0; this.infraction = 0;
    this.stats = { delivered: 0, perfect: 0, splat: 0, best: 0, peds: 0, tickets: 0 };
    this.flying.length = 0; Fx.clear();
    const d = City.shop.dock;
    this.player = new Player(d.x, d.y + 40, PI / 2);
    this.cam.x = clamp(d.x - VW / 2, 0, WW - VW);
    this.cam.y = clamp(d.y - VH / 2, 0, WH - VH);
    this.traffic.length = 0; this.peds.length = 0;
    this.seedTraffic(30); this.seedPeds(24);
    this.newOrder();
    this.say('CLOCK IN!', PAL.amber);
    Audio5.sfx('start');
  },

  /* ---------------- orders ------------------------------- */
  newOrder() {
    const p = this.player;
    let best = null, bestScore = -1;
    for (let i = 0; i < 90; i++) {
      const h = City.houses[(Math.random() * City.houses.length) | 0];
      if (this.order && this.order.house === h) continue;
      const d = hyp(h.cx - p.x, h.cy - p.y);
      if (d < 230 || d > 980) continue;
      const s = Math.random();
      if (s > bestScore) { bestScore = s; best = h; }
    }
    if (!best) best = City.houses[(Math.random() * City.houses.length) | 0];
    this.order = {
      house: best, label: best.addr,
      tip: TIP_MAX, max: TIP_MAX, floor: TIP_FLOOR, decay: TIP_DECAY,
    };
    this.syncNav();
    Fx.pop(p.x, p.y - 22, 'NEW ORDER', PAL.amber);
  },

  syncNav() {
    if (this.needPickup) {
      const z = City.shop;
      Nav.setGoal({ x: z.dock.x, y: z.dock.y, node: z.node, label: 'TACO SHOP' });
    } else if (this.order) {
      const h = this.order.house;
      Nav.setGoal({ x: h.porch.x + h.porch.w / 2, y: h.porch.y + h.porch.h / 2, node: h.node, label: h.addr });
    }
  },

  say(msg, col) { this.banner = msg; this.bannerCol = col || PAL.bone; this.bannerT = 1.6; },

  /* ---------------- spawning ----------------------------- */
  seedTraffic(n) { for (let i = 0; i < n; i++) this.spawnCar(true); },
  spawnCar(anywhere) {
    const p = this.player;
    for (let a = 0; a < 24; a++) {
      const dir = (Math.random() * 4) | 0;
      const perp = dir % 2 === 0 ? p.y : p.x;
      const lane = clamp(Math.round((perp - SEG0) / PITCH) + ((Math.random() * 3) | 0) - 1, 0, BLOCKS);
      const fixed = Traffic.laneFixed(lane, dir);
      const alongP = dir % 2 === 0 ? p.x : p.y;
      const off = anywhere ? rand(-620, 620) : (Math.random() < 0.5 ? -1 : 1) * rand(300, 600);
      const along = alongP + off;
      if (along < SEG0 + 40 || along > SEG0 + BLOCKS * PITCH + 40) continue;
      const x = dir % 2 === 0 ? along : fixed;
      const y = dir % 2 === 0 ? fixed : along;
      if (hyp(x - p.x, y - p.y) < 120) continue;
      let clash = false;
      for (const c of this.traffic) if (hyp(c.x - x, c.y - y) < 42) { clash = true; break; }
      if (clash) continue;
      this.traffic.push(new Traffic(x, y, dir, lane, (Math.random() * Art.car.length) | 0));
      return;
    }
  },
  seedPeds(n) { for (let i = 0; i < n; i++) this.spawnPed(); },
  spawnPed() {
    const p = this.player;
    const pbx = clamp(Math.floor((p.x / TS - BORDER) / SPAN), 0, BLOCKS - 1);
    const pby = clamp(Math.floor((p.y / TS - BORDER) / SPAN), 0, BLOCKS - 1);
    const bx = clamp(pbx + ((Math.random() * 5) | 0) - 2, 0, BLOCKS - 1);
    const by = clamp(pby + ((Math.random() * 5) | 0) - 2, 0, BLOCKS - 1);
    this.peds.push(new Ped(bx, by));
  },

  nearScreen(x, y) {
    return x > this.cam.x - 40 && x < this.cam.x + VW + 40 && y > this.cam.y - 40 && y < this.cam.y + VH + 40;
  },

  /* ---------------- throwing ----------------------------- */
  aimPoint() {
    const p = this.player;
    let ax, ay;
    if (Input.hasMouse) { ax = this.cam.x + Input.mx; ay = this.cam.y + Input.my; }
    else { ax = p.x + Math.cos(p.ang) * 84; ay = p.y + Math.sin(p.ang) * 84; }
    const dx = ax - p.x, dy = ay - p.y, d = hyp(dx, dy);
    if (d > MAXTHROW) { ax = p.x + dx / d * MAXTHROW; ay = p.y + dy / d * MAXTHROW; }
    if (d < 14) { ax = p.x + Math.cos(p.ang) * 14; ay = p.y + Math.sin(p.ang) * 14; }
    return { x: ax, y: ay };
  },

  tryThrow() {
    if (this.throwCd > 0 || this.bag <= 0 || this.player.spinT > 0) {
      if (this.bag <= 0) { this.say('OUT OF TACOS - BACK TO THE SHOP', PAL.bad); Audio5.sfx('recalc'); }
      return;
    }
    const p = this.player, a = this.aimPoint();
    // accuracy falls off with speed — slowing down is the skill, not a chore
    const spread = clamp(p.speed / MAXSPD, 0, 1) * 22;
    this.flying.push(new Bag(p.x, p.y, a.x, a.y, spread));
    this.bag--;
    this.throwCd = THROW_CD;
    if (this.bag === 0) { this.needPickup = true; this.syncNav(); }
    Audio5.sfx('throw');
  },

  onLand(z) {
    const o = this.order;
    const hit = (r) => z.x > r.x && z.x < r.x + r.w && z.y > r.y && z.y < r.y + r.h;

    if (o && hit(o.house.porch)) {
      const perfect = hit(o.house.door);
      this.complete(perfect, z);
      return;
    }
    /* wrong address? */
    let wrong = null;
    for (const h of City.houses) {
      if (Math.abs(h.cx - z.x) > 120 || Math.abs(h.cy - z.y) > 120) continue;
      if (z.x > h.porch.x && z.x < h.porch.x + h.porch.w && z.y > h.porch.y && z.y < h.porch.y + h.porch.h) { wrong = h; break; }
    }
    this.miss(z, wrong);
  },

  complete(perfect, z) {
    const o = this.order;
    const base = Math.round(o.tip) + (perfect ? PERFECT_BONUS : 0);
    const paid = Math.round(base * this.combo);
    this.earned += paid;
    this.shift += TIME_PER_JOB + (perfect ? TIME_PERFECT : 0);
    this.stats.delivered++;
    if (perfect) this.stats.perfect++;
    this.stats.best = Math.max(this.stats.best, paid);
    this.combo = Math.min(3, this.combo + 0.25);
    this.comboPop = 0.4;

    Fx.cash(z.x, z.y);
    Fx.pop(z.x, z.y - 10, money(paid), PAL.good, true);
    if (perfect) Fx.pop(z.x, z.y - 26, 'ON THE DOORSTEP! +' + money(PERFECT_BONUS), PAL.amber);
    Fx.pop(z.x, z.y - 40, '+' + (TIME_PER_JOB + (perfect ? TIME_PERFECT : 0)) + 'S', PAL.cyan);
    this.say(perfect ? 'PERFECT TOSS!' : 'DELIVERED!', perfect ? PAL.amber : PAL.good);
    Audio5.sfx(perfect ? 'perfect' : 'deliver');
    Audio5.sfx('cash');
    this.flash = 0.14;

    this.order = null;
    if (this.bag > 0) this.newOrder();
    else { this.needPickup = true; this.syncNav(); }
  },

  miss(z, wrong) {
    Fx.splat(z.x, z.y);
    Fx.spill(z.x, z.y);
    Audio5.sfx('splat');
    this.stats.splat++;
    this.earned = Math.max(0, this.earned - REMAKE_FEE);
    this.combo = 1;
    if (wrong && this.order && wrong !== this.order.house) {
      Fx.pop(z.x, z.y - 10, 'WRONG HOUSE! ' + wrong.num, PAL.bad);
      this.say('THAT IS NOT ' + (this.order ? this.order.house.num : ''), PAL.bad);
    } else {
      Fx.pop(z.x, z.y - 10, 'SPLAT! -' + money(REMAKE_FEE), PAL.bad);
      this.say('SPLAT!', PAL.bad);
    }
    if (this.bag === 0 && this.order) { this.needPickup = true; this.syncNav(); }
  },

  onCrash() { this.bumpHeat(7); },

  bumpHeat(n) {
    this.heat = clamp(this.heat + n, 0, HEAT_MAX);
    this.infraction = 1.2;
    if (this.heat >= HEAT_MAX && !this.cop) this.spawnCop();
  },

  spawnCop() {
    const p = this.player;
    const a = Math.random() * TAU;
    let x = p.x + Math.cos(a) * 210, y = p.y + Math.sin(a) * 210;
    x = clamp(x, 40, WW - 40); y = clamp(y, 40, WH - 40);
    for (let i = 0; i < 30 && City.isSolid(x, y); i++) { x = clamp(p.x + rand(-260, 260), 40, WW - 40); y = clamp(p.y + rand(-260, 260), 40, WH - 40); }
    this.cop = new Cop(x, y, Math.atan2(p.y - y, p.x - x));
    this.copT = 26;
    this.say('HEAT! LOSE THE COP', PAL.bad);
    Audio5.sirenOn();
  },
  dropCop() { this.cop = null; this.heat = Math.min(this.heat, 45); Audio5.sirenOff(); },

  /* ---------------- update ------------------------------- */
  update(dt) {
    this.time += dt;
    this.flash = Math.max(0, this.flash - dt);

    if (this.state === 'title') {
      this.titleCam += dt * 26;
      const r = 300;
      this.cam.x = clamp(City.shop.x - VW / 2 + Math.cos(this.titleCam / 62) * r, 0, WW - VW);
      this.cam.y = clamp(City.shop.y - VH / 2 + Math.sin(this.titleCam / 41) * r * 0.7, 0, WH - VH);
      this.player.x = this.cam.x + VW / 2; this.player.y = this.cam.y + VH / 2;
      this.simCrowd(dt);
      if (Input.p('Enter', 'NumpadEnter', 'Space')) { Audio5.sfx('select'); this.startShift(); }
      return;
    }

    if (this.state === 'results') {
      this.simCrowd(dt);
      if (Input.p('Enter', 'NumpadEnter', 'KeyR')) { Audio5.sfx('select'); this.startShift(); }
      if (Input.p('Escape')) this.toTitle();
      return;
    }

    /* ---- play ---- */
    if (Input.p('Escape', 'KeyP')) this.paused = !this.paused;
    if (this.paused) return;

    if (this.hitstop > 0) { this.hitstop -= dt; dt *= 0.15; }

    const wasSec = Math.ceil(this.shift);
    this.shift -= dt;
    if (this.shift > 0 && this.shift < 6 && Math.ceil(this.shift) !== wasSec) Audio5.sfx('tick');
    if (this.shift <= 0) { this.endShift(); return; }

    this.bannerT -= dt;
    this.comboPop = Math.max(0, this.comboPop - dt);
    this.tipPop = Math.max(0, this.tipPop - dt);
    this.throwCd -= dt;
    this.infraction = Math.max(0, this.infraction - dt);

    /* tip decay */
    if (this.order) {
      const before = this.order.tip;
      this.order.tip = Math.max(this.order.floor, this.order.tip - this.order.decay * dt);
      if (((before / 25) | 0) !== ((this.order.tip / 25) | 0)) this.tipPop = 0.07;
    }

    /* player */
    const p = this.player;
    p.control(Input);
    p.update(dt, this);

    if (Input.mhit || Input.p('Space')) this.tryThrow();

    /* engine audio */
    const sf = clamp(p.speed / MAXSPD, 0, 1);
    Audio5.engineSet(sf, p.throttle > 0 ? 1 : 0);

    /* heat from bad driving */
    const surf = City.surfaceAt(p.x, p.y);
    if ((surf === S_GRASS || surf === S_WALK) && p.speed > 40) this.bumpHeat(9 * dt);
    else if (this.infraction <= 0) this.heat = Math.max(0, this.heat - 7 * dt);

    /* traffic */
    for (let i = this.traffic.length - 1; i >= 0; i--) {
      const c = this.traffic[i];
      c.update(dt, this);
      if (hyp(c.x - p.x, c.y - p.y) > 1000 || c.x < SEG0 - 60 || c.y < SEG0 - 60 ||
          c.x > SEG0 + BLOCKS * PITCH + 90 || c.y > SEG0 + BLOCKS * PITCH + 90) {
        this.traffic.splice(i, 1); continue;
      }
      /* player vs traffic */
      const d = hyp(c.x - p.x, c.y - p.y);
      if (d < 15 && c.stun <= 0) {
        const rel = hyp(p.vx - DIRV[c.dir][0] * c.spd, p.vy - DIRV[c.dir][1] * c.spd);
        if (rel > 55) {
          c.stun = 1.1; c.spd *= 0.3;
          p.spinOut(Math.random() < 0.5 ? -1 : 1);
          this.shake = 8; this.hitstop = 0.08;
          Audio5.sfx('crash');
          for (let k = 0; k < 16; k++) Fx.spark(p.x, p.y, rand(-90, 90), rand(-90, 90));
          Fx.pop(p.x, p.y - 20, 'CRUNCH!', PAL.bad);
          this.bumpHeat(15);
          this.combo = 1;
        }
        const nx2 = (p.x - c.x) / (d || 1), ny2 = (p.y - c.y) / (d || 1);
        p.x += nx2 * 2; p.y += ny2 * 2;
      }
    }
    while (this.traffic.length < 30) { const n = this.traffic.length; this.spawnCar(false); if (this.traffic.length === n) break; }

    /* peds */
    for (let i = this.peds.length - 1; i >= 0; i--) {
      const q = this.peds[i];
      q.update(dt, this);
      if (hyp(q.x - p.x, q.y - p.y) > 780) { this.peds.splice(i, 1); continue; }
      if (q.tumble <= 0 && hyp(q.x - p.x, q.y - p.y) < 11 && p.speed > 42) {
        q.hitBy(p.x, p.y, p.vx, p.vy);
        this.earned = Math.max(0, this.earned - PED_FINE);
        this.stats.peds++;
        this.combo = 1;
        this.bumpHeat(34);
        Fx.star(q.x, q.y - 8);
        Fx.pop(q.x, q.y - 18, 'OW! -' + money(PED_FINE), PAL.bad);
        this.shake = 5; this.hitstop = 0.05;
        Audio5.sfx('ped');
      }
    }
    while (this.peds.length < 24) this.spawnPed();

    /* cop */
    if (this.cop) {
      this.cop.update(dt, this);
      this.copT -= dt;
      const d = hyp(this.cop.x - p.x, this.cop.y - p.y);
      Audio5.sirenSet(clamp(1 - d / 420, 0, 1));
      if (d < 16 && this.cop.hitCd <= 0) {
        this.cop.hitCd = 3;
        this.earned = Math.max(0, this.earned - TICKET);
        this.stats.tickets++;
        this.combo = 1;
        p.spinOut(1);
        this.shake = 9; this.hitstop = 0.1;
        Fx.pop(p.x, p.y - 22, 'TICKET! -' + money(TICKET), PAL.bad, true);
        this.say('PULLED OVER', PAL.bad);
        Audio5.sfx('ticket');
        this.heat = 0;
        this.dropCop();
      } else if (this.copT <= 0 || (d > 620 && this.heat < 55)) {
        this.say('LOST THEM', PAL.good);
        this.dropCop();
      }
    }

    /* bags in flight */
    for (let i = this.flying.length - 1; i >= 0; i--) {
      const z = this.flying[i];
      z.update(dt);
      if (z.dead) { this.flying.splice(i, 1); this.onLand(z); }
    }

    /* restock at the shop */
    const dock = City.shop.dock;
    if (this.needPickup && hyp(p.x - dock.x, p.y - dock.y) < 54 && p.speed < 62) {
      this.restock += dt;
      if (this.restock >= 1.0) {
        this.restock = 0;
        this.bag = this.bagMax;
        this.needPickup = false;
        Audio5.sfx('restock');
        Fx.pop(p.x, p.y - 22, 'TACOS LOADED', PAL.amber);
        if (!this.order) this.newOrder(); else this.syncNav();
      }
    } else this.restock = Math.max(0, this.restock - dt * 2);

    Nav.update(dt, p);
    Fx.update(dt);

    /* camera */
    const lead = 46;
    const tx = p.x + clamp(p.vx / MAXSPD, -1, 1) * lead - VW / 2;
    const ty = p.y + clamp(p.vy / MAXSPD, -1, 1) * lead - VH / 2;
    const k = 1 - Math.exp(-7 * dt);
    this.cam.x = clamp(this.cam.x + (tx - this.cam.x) * k, 0, WW - VW);
    this.cam.y = clamp(this.cam.y + (ty - this.cam.y) * k, 0, WH - VH);
    this.shake = Math.max(0, this.shake - dt * 22);
  },

  simCrowd(dt) {
    for (const c of this.traffic) c.update(dt, this);
    for (const q of this.peds) q.update(dt, this);
    Fx.update(dt);
  },

  endShift() {
    this.state = 'results';
    this.shift = 0;
    Audio5.engineOff(); Audio5.sirenOff();
    this.cop = null;
    Nav.clear();
    Audio5.sfx('over');
  },

  rank() {
    const e = this.earned;
    return e < 4000 ? 'TRAINEE' : e < 9000 ? 'DRIVER' : e < 15000 ? 'ACE' : e < 23000 ? 'SALSA BARON' : 'LEGEND OF THE ASADA';
  },

  /* ---------------- render ------------------------------- */
  render(x) {
    const sh = this.shake;
    const cx = Math.round(this.cam.x + (sh > 0 ? rand(-sh, sh) : 0));
    const cy = Math.round(this.cam.y + (sh > 0 ? rand(-sh, sh) : 0));
    const cam = { x: cx, y: cy };

    x.fillStyle = PAL.void; x.fillRect(0, 0, VW, VH);
    x.drawImage(City.ground, cx, cy, VW, VH, 0, 0, VW, VH);

    if (this.state === 'play' || this.state === 'results') Nav.drawRoute(x, cam, this.time);
    if (this.state === 'play') this.drawBeacon(x, cam);

    /* ---- y-sorted sprite pass ---- */
    const rl = this.rl; rl.length = 0;
    City.collect(cx - 140, cy - 150, cx + VW + 140, cy + VH + 150, rl);
    if (this.state !== 'title') rl.push({ sortY: this.player.y, e: this.player });
    for (const c of this.traffic) if (this.nearScreen(c.x, c.y)) rl.push({ sortY: c.y, e: c });
    for (const q of this.peds)    if (this.nearScreen(q.x, q.y)) rl.push({ sortY: q.y, e: q });
    if (this.cop) rl.push({ sortY: this.cop.y, e: this.cop });
    for (const z of this.flying) rl.push({ sortY: z.y, e: z });
    rl.sort((a, b) => a.sortY - b.sortY);
    for (const it of rl) {
      if (it.e) it.e.draw(x, cam);
      else x.drawImage(it.img, it.x - cx, it.y - it.oy - cy);
    }

    Fx.draw(x, cam);

    if (this.state === 'play') {
      this.drawAim(x, cam);
      Hud.draw(x, this);
      if (this.restock > 0) this.drawRestock(x, cam);
      if (this.paused) this.overlayPause(x);
    }
    if (this.state === 'title')   this.overlayTitle(x);
    if (this.state === 'results') this.overlayResults(x);

    if (this.flash > 0) {
      x.globalAlpha = this.flash * 2.4;
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, VW, VH);
      x.globalAlpha = 1;
    }
    Post.apply(x);
  },

  drawBeacon(x, cam) {
    if (!this.order || this.needPickup) {
      if (this.needPickup) {
        const d = City.shop.dock;
        const sx = d.x - cam.x, sy = d.y - cam.y;
        if (sx > -40 && sx < VW + 40 && sy > -40 && sy < VH + 40) {
          const b = Math.sin(this.time * 5) * 3;
          x.globalAlpha = 0.5 + 0.35 * Math.sin(this.time * 6);
          triArrow(x, sx, sy - 34 + b, PI / 2, 8, PAL.amber, PAL.ink);
          x.globalAlpha = 1;
          textOut(x, 'PICK UP', sx, sy - 52, PAL.amber, 1, 1);
        }
      }
      return;
    }
    const h = this.order.house, r = h.porch;
    const sx = r.x - cam.x, sy = r.y - cam.y;
    if (sx < -80 || sy < -80 || sx > VW + 80 || sy > VH + 80) return;
    const pu = 0.45 + 0.4 * Math.sin(this.time * 6);
    x.globalAlpha = pu;
    x.strokeStyle = PAL.amber; x.lineWidth = 1;
    x.strokeRect((sx | 0) + 0.5, (sy | 0) + 0.5, r.w - 1, r.h - 1);
    x.strokeRect((sx | 0) - 1.5, (sy | 0) - 1.5, r.w + 2, r.h + 2);
    x.globalAlpha = 0.16 * pu + 0.06;
    x.fillStyle = PAL.amber; x.fillRect(sx | 0, sy | 0, r.w, r.h);
    x.globalAlpha = 1;

    const bob = Math.sin(this.time * 5) * 3;
    const ax = h.cx - cam.x, ay = h.y - cam.y - 22 + bob;
    triArrow(x, ax, ay, PI / 2, 8, PAL.amber, PAL.ink);
    textOut(x, '' + h.num, ax, ay - 16, PAL.amber, 1, 1);
  },

  drawAim(x, cam) {
    const p = this.player;
    if (this.bag <= 0) return;
    const a = this.aimPoint();
    const sx0 = p.x - cam.x, sy0 = p.y - cam.y;
    const sx1 = a.x - cam.x, sy1 = a.y - cam.y;

    /* target lock test */
    let lock = false;
    if (this.order && !this.needPickup) {
      const r = this.order.house.porch;
      lock = a.x > r.x && a.x < r.x + r.w && a.y > r.y && a.y < r.y + r.h;
    }
    const col = lock ? PAL.good : PAL.bone;

    /* arc of dots */
    for (let i = 1; i <= 7; i++) {
      const t = i / 8;
      const px = lerp(sx0, sx1, t), py = lerp(sy0, sy1, t);
      const z = Z0 + (0 - Z0 + 0.5 * GRAV * THROW_T * THROW_T) / THROW_T * (t * THROW_T) - 0.5 * GRAV * (t * THROW_T) ** 2;
      x.globalAlpha = 0.18 + t * 0.32;
      x.fillStyle = col;
      x.fillRect(px | 0, (py - z) | 0, 2, 2);
    }
    x.globalAlpha = 1;

    /* reticle */
    const rx = sx1 | 0, ry = sy1 | 0;
    x.fillStyle = col;
    for (const [dx, dy] of [[-5, 0], [4, 0], [0, -5], [0, 4]]) x.fillRect(rx + dx, ry + dy, dx ? 2 : 1, dy ? 2 : 1);
    if (lock) {
      const b = (this.time * 8 | 0) % 2;
      x.globalAlpha = b ? 1 : 0.45;
      x.strokeStyle = PAL.good; x.lineWidth = 1;
      x.strokeRect(rx - 6.5, ry - 6.5, 13, 13);
      x.globalAlpha = 1;
    }
    if (this.throwCd > 0) {
      x.globalAlpha = 0.4; x.fillStyle = PAL.ink;
      x.fillRect(rx - 4, ry - 4, 9, 9); x.globalAlpha = 1;
    }
  },

  drawRestock(x, cam) {
    const p = this.player;
    const sx = (p.x - cam.x) | 0, sy = ((p.y - cam.y) | 0) - 26;
    R(x, PAL.ink, sx - 21, sy - 4, 42, 11);
    text(x, 'LOADING', sx, sy - 2, PAL.amber, 1, 1);
    R(x, '#2c2338', sx - 18, sy + 5, 36, 3);
    R(x, PAL.amber, sx - 18, sy + 5, Math.round(36 * clamp(this.restock, 0, 1)), 3);
  },

  /* ---------------- overlays ----------------------------- */
  overlayTitle(x) {
    x.fillStyle = 'rgba(20,12,28,0.62)'; x.fillRect(0, 0, VW, VH);
    const t = this.time;
    // the shop badge, baked once at boot
    const bw = Art.badge.width;
    x.drawImage(Art.badge, ((VW - bw) / 2) | 0, 2);

    text(x, 'CARNAGE ASADA', VW / 2 + 2, 120, PAL.ink2, 2, 1);
    text(x, 'CARNAGE ASADA', VW / 2, 118, PAL.red, 2, 1);
    text(x, 'SUNDAY NIGHT DELIVERY SHIFT', VW / 2, 137, PAL.bone, 1, 1);

    const rows = [
      'WASD / ARROWS   DRIVE      SHIFT  HANDBRAKE',
      'MOUSE AIM  +  CLICK / SPACE   TOSS THE BAG',
      'THE TIP SHRINKS EVERY SECOND. THE NAV IS DUMB.',
    ];
    rows.forEach((r, i) => text(x, r, VW / 2, 152 + i * 10, i === 2 ? PAL.cyan : PAL.boneDim, 1, 1));

    if ((t * 2 | 0) % 2) text(x, 'PRESS ENTER TO CLOCK IN', VW / 2, VH - 26, PAL.amber, 2, 1);
    text(x, 'M MUTE    N MUSIC    P PAUSE', VW / 2, VH - 10, '#6b5f84', 1, 1);
  },

  overlayResults(x) {
    x.fillStyle = 'rgba(20,12,28,0.78)'; x.fillRect(0, 0, VW, VH);
    const s = this.stats || { delivered: 0, perfect: 0, splat: 0, best: 0, peds: 0, tickets: 0 };
    const w = 250, h = 154, px = (VW - w) / 2 | 0, py = 24;
    R(x, PAL.ink, px, py, w, h);
    R(x, '#241a2e', px + 2, py + 2, w - 4, h - 4);
    x.strokeStyle = PAL.amber; x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);

    text(x, 'SHIFT OVER', VW / 2, py + 10, PAL.red, 3, 1);
    R(x, PAL.red, px + 16, py + 34, w - 32, 1);

    const rows = [
      ['DELIVERED', s.delivered + ''],
      ['PERFECT TOSSES', s.perfect + ''],
      ['ORDERS DROPPED', s.splat + ''],
      ['PEDESTRIANS CLIPPED', s.peds + ''],
      ['TICKETS', s.tickets + ''],
      ['BEST SINGLE TIP', money(s.best)],
    ];
    rows.forEach((r, i) => {
      const y = py + 42 + i * 11;
      text(x, r[0], px + 16, y, PAL.boneDim, 1);
      text(x, r[1], px + w - 16, y, PAL.bone, 1, 2);
    });

    R(x, '#3a2c48', px + 16, py + 112, w - 32, 1);
    text(x, 'TAKE HOME', px + 16, py + 118, PAL.boneDim, 1);
    text(x, money(this.earned), px + w - 16, py + 116, PAL.good, 2, 2);
    text(x, this.rank(), VW / 2, py + 134, PAL.amber, 2, 1);

    if ((this.time * 2 | 0) % 2) text(x, 'ENTER - RUN IT BACK', VW / 2, VH - 22, PAL.bone, 1, 1);
    text(x, 'ESC - TITLE', VW / 2, VH - 11, '#6b5f84', 1, 1);
  },

  overlayPause(x) {
    x.fillStyle = 'rgba(20,12,28,0.7)'; x.fillRect(0, 0, VW, VH);
    text(x, 'PAUSED', VW / 2, VH / 2 - 14, PAL.amber, 3, 1);
    text(x, 'P OR ESC TO RESUME', VW / 2, VH / 2 + 10, PAL.boneDim, 1, 1);
  },
};

/* ---------------- CRT-ish post ----------------------------- */
const Post = {
  lines: null, vig: null,
  build() {
    let t = mkCanvas(VW, VH);
    t.x.fillStyle = 'rgba(10,6,16,0.13)';
    for (let y = 0; y < VH; y += 2) t.x.fillRect(0, y, VW, 1);
    this.lines = t.c;
    t = mkCanvas(VW, VH);
    const g = t.x.createRadialGradient(VW / 2, VH / 2, VH * 0.34, VW / 2, VH / 2, VH * 0.92);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(12,6,20,0.5)');
    t.x.fillStyle = g; t.x.fillRect(0, 0, VW, VH);
    this.vig = t.c;
  },
  apply(x) {
    if (!this.lines) this.build();
    x.drawImage(this.lines, 0, 0);
    x.drawImage(this.vig, 0, 0);
  },
};


/* ===== 90_main.js ===== */
/* ============================================================
   BOOT  --  canvas scaling, fixed-step loop, audio unlock
   ============================================================ */
'use strict';

(function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  canvas.width = VW; canvas.height = VH;
  ctx.imageSmoothingEnabled = false;

  let scale = 3;
  function resize() {
    const wrap = document.getElementById('stage');
    const availW = wrap.clientWidth || window.innerWidth;
    const availH = wrap.clientHeight || window.innerHeight;
    // Integer scaling keeps pixels perfectly square, but a window only a few
    // px short of the next step throws away a third of the picture. Above 2x
    // the unevenness of a fractional step is imperceptible, so take the fit.
    const raw = Math.min(availW / VW, availH / VH);
    scale = raw >= 2 ? Math.floor(raw * 20) / 20   // fit; unevenness invisible this dense
          : raw >= 1 ? 1                           // crisp 1:1 on small viewports
          : raw;                                   // below 1:1, fit rather than overflow
    canvas.style.width = (VW * scale) + 'px';
    canvas.style.height = (VH * scale) + 'px';
  }
  addEventListener('resize', resize);

  Input.init(canvas, () => scale);

  /* first gesture unlocks WebAudio */
  const unlock = () => {
    Audio5.init(); Audio5.resume();
    removeEventListener('keydown', unlock);
    removeEventListener('mousedown', unlock);
  };
  addEventListener('keydown', unlock);
  addEventListener('mousedown', unlock);

  /* splash while the city bakes */
  ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, VW, VH);
  text(ctx, 'TACO SHOP', VW / 2, VH / 2 - 22, PAL.gold, 4, 1);
  text(ctx, 'PAVING THE STREETS...', VW / 2, VH / 2 + 14, PAL.amber, 1, 1);
  resize();

  const params = new URLSearchParams(location.search);
  const seed = (parseInt(params.get('seed'), 10) || 20260816) >>> 0;

  setTimeout(() => {
    const t0 = performance.now();
    G.boot(seed);
    console.log('[taco shop] city built in ' + Math.round(performance.now() - t0) + 'ms, ' +
                City.statics.length + ' props, ' + City.houses.length + ' addresses');
    resize();
    requestAnimationFrame(frame);
  }, 30);

  const STEP = 1 / 60;
  let acc = 0, last = 0;

  // coming back from a hidden tab hands us one enormous frame; drop it rather
  // than fast-forwarding the shift the player was not watching
  addEventListener('visibilitychange', () => { if (!document.hidden) { last = 0; acc = 0; } });

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;
    acc = Math.min(acc + dt, 0.25);   // never let the catch-up loop spiral

    let guard = 0;
    while (acc >= STEP && guard++ < 5) {
      acc -= STEP;
      G.update(STEP);
      handleGlobalKeys();
      Input.endFrame();
    }
    /* engine voice only while a shift is live */
    if (Audio5.ready) {
      if (G.state === 'play' && !G.paused) Audio5.engineOn();
      else if (Audio5.engine) Audio5.engineOff();
    }
    G.render(ctx);
  }

  /* Console bridge. Browsers pause requestAnimationFrame in a hidden tab, so
     this also makes the game steppable when it cannot self-drive. */
  window.TacoShop = {
    G, City, Nav, Art, Audio5, Input, ctx,
    step(n = 1) {
      for (let i = 0; i < n; i++) { G.update(STEP); handleGlobalKeys(); Input.endFrame(); }
      G.render(ctx);
    },
  };

  function handleGlobalKeys() {
    if (Input.p('KeyM')) {
      const m = Audio5.toggleMute();
      G.say(m ? 'SOUND OFF' : 'SOUND ON', PAL.boneDim);
    }
    if (Input.p('KeyN')) {
      const m = Audio5.toggleMusic();
      G.say(m ? 'MUSIC ON' : 'MUSIC OFF', PAL.boneDim);
    }
  }
})();

</script>
