    /* ---- 2. block programme ----------------------------- */
    /* Hand-authored in content/hays.json, not rolled: this is a real place.
       build.mjs has already checked the table is 8x8, that every kind is known,
       and that exactly one cell is the shop. */
    /* City.map is set by G per era (Map 1/2/3 = content/hays*.json). The
       streets are the same in every era; only the zoning moves. */
    const kinds = (this.map || HAYS).zoning.map((row) => row.slice());
    this.kinds = kinds;

    /* ---- 3. paint block ground surfaces ------------------ */
    for (let by = 0; by < BLOCKS; by++) for (let bx = 0; bx < BLOCKS; bx++) {
      const k = kinds[by][bx];
      if (k === 'com' || k === 'lot' || k === 'shop') {
        for (let ly = 1; ly <= 8; ly++) for (let lx = 1; lx <= 8; lx++) {
          const tx = BORDER + bx * SPAN + 2 + lx, ty = BORDER + by * SPAN + 2 + ly;
          this.surf[ty * GW + tx] = S_ROAD;
          cls[ty * GW + tx] = 100;              // lot asphalt marker
        }
      }
    }

    const pick = (arr, tx, ty) => arr[((tx * 73856093) ^ (ty * 19349663)) & 3];
    for (let ty = 0; ty < GH; ty++) for (let tx = 0; tx < GW; tx++) {
      const c = cls[ty * GW + tx];
      const set = c === T_EDGE ? Art.tile.field : c === T_WALK ? Art.tile.walk
                : c === T_LOT ? Art.tile.grass : c === 100 ? Art.tile.lot : Art.tile.road;
      x.drawImage(pick(set, tx, ty), tx * TS, ty * TS);
    }

    /* ---- 5. road markings -------------------------------- */
    this.drawRoadMarkings(x);

    /* ---- 6. build each block ----------------------------- */
    for (let by = 0; by < BLOCKS; by++) for (let bx = 0; bx < BLOCKS; bx++) {
      const k = kinds[by][bx];
      if (k === 'res')         this.genResidential(rng, bx, by);
      else if (k === 'retail') this.genRetail(rng, bx, by);
      else if (k === 'rail')   this.genRail(rng, bx, by);
      else if (k === 'civic')  this.genCivic(rng, bx, by);
      else if (k === 'apts')   this.genApts(rng, bx, by);
      else if (k === 'church') this.genChurch(rng, bx, by);
      else if (k === 'auto')   this.genAuto(rng, bx, by);
      else if (k === 'com')    this.genCommercial(rng, bx, by);
      else if (k === 'park')   this.genPark(rng, bx, by);
      else if (k === 'lot')    this.genParking(rng, bx, by);
      else if (k === 'shop')   this.genShop(rng, bx, by);
    }

    /* ---- 6b. the edge of the built world ----------------- */
    /* After the blocks, not before: it draws the railway running out
       through the border, and genRail is what sets `tracks`. */
    this.drawEdge(x);

    /* ---- 7. street furniture ----------------------------- */
    this.genFurniture(rng);

    /* ---- 8. bake static shadows, sort draw order --------- */
    x.fillStyle = 'rgba(18,10,26,0.26)';
    for (const s of this.statics) {
      if (s.noShadow) continue;
      x.fillRect(s.x + 6, s.y + 7, s.w, s.h);
    }
    this.statics.sort((a, b) => a.sortY - b.sortY);
    this.buildBuckets();
  },

  /* ---------- coarse spatial index for the draw pass ------ */
  BS: 128,
  buildBuckets() {
    this.BC = Math.ceil(WW / this.BS);
    this.buckets = [];
    for (let i = 0; i < this.BC * this.BC; i++) this.buckets.push([]);
    for (const s of this.statics) {
      s._seen = -1;
      const x0 = clamp((s.x / this.BS) | 0, 0, this.BC - 1);
      const y0 = clamp(((s.y - s.oy) / this.BS) | 0, 0, this.BC - 1);
      const x1 = clamp(((s.x + s.w) / this.BS) | 0, 0, this.BC - 1);
      const y1 = clamp(((s.y + s.h) / this.BS) | 0, 0, this.BC - 1);
      for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++)
        this.buckets[by * this.BC + bx].push(s);
    }
    this._stamp = 0;
  },

  /** push every static overlapping the rect into `out` */
  collect(x0, y0, x1, y1, out) {
    const st = ++this._stamp;
    const bx0 = clamp((x0 / this.BS) | 0, 0, this.BC - 1), bx1 = clamp((x1 / this.BS) | 0, 0, this.BC - 1);
    const by0 = clamp((y0 / this.BS) | 0, 0, this.BC - 1), by1 = clamp((y1 / this.BS) | 0, 0, this.BC - 1);
    for (let by = by0; by <= by1; by++) for (let bx = bx0; bx <= bx1; bx++) {
      const b = this.buckets[by * this.BC + bx];
      for (let i = 0; i < b.length; i++) {
        const s = b[i];
        if (s._seen === st) continue;
        s._seen = st;
        if (s.x > x1 || s.x + s.w < x0 || s.y - s.oy > y1 || s.y + s.h < y0) continue;
        out.push(s);
      }
    }
  },

  /* ---------- sea wall ------------------------------------ */
  /* A stock fence where the streets stop, and the railway running out through
     it. Called AFTER the block generators, because it needs `tracks`, which
     genRail sets. The corridor crosses the full width of the map and has to
     leave it: stopping the ballast dead at the border would make the line read
     as ending in a field rather than going to Kansas City. genRail deliberately
     skips `tx < BORDER || tx >= GW - BORDER`, so this fills exactly the gap it
     leaves, with the same four rows and the same tiles.

     The fence breaks for the corridor on the east and west, which is both
     correct and the reason it is worth drawing a fence rather than a wall. */
  drawEdge(x) {
    const a = BORDER * TS, b = (BORDER + SPANEND + 1) * TS;

    if (this.tracks) {
      const MID = 6, by = 2;
      for (let ly = MID - 2; ly <= MID + 1; ly++) {
        const ty = BORDER + by * SPAN + ly;
        const set = (ly === MID - 1 || ly === MID) ? Art.tile.rail : Art.tile.ballast;
        for (let tx = 0; tx < GW; tx++) {
          if (tx >= BORDER && tx < GW - BORDER) continue;
          x.drawImage(set[(tx + ly) & 3], tx * TS, ty * TS);
        }
      }
    }
    const gap = this.tracks ? [this.tracks[0] - 20, this.tracks[1] + 20] : null;

    const post = (px, py) => { R(x, PAL.fence, px, py, 2, 3); R(x, PAL.fenceLo, px, py + 3, 2, 1); };
    const wire = (px, py, w, h) => { R(x, PAL.fenceLo, px, py, w, h); R(x, PAL.fence, px, py, w, 1); };

    wire(a - 5, a - 5, b - a + 10, 2);              // north
    wire(a - 5, b + 3, b - a + 10, 2);              // south
    for (let i = a - 5; i < b + 5; i += 9) { post(i, a - 7); post(i, b + 3); }

    for (let yy = a - 5; yy < b + 5; yy++) {        // west and east, broken for the rails
      if (gap && yy > gap[0] && yy < gap[1]) continue;
      R(x, PAL.fence, a - 5, yy, 2, 1); R(x, PAL.fence, b + 3, yy, 2, 1);
    }
    for (let i = a - 5; i < b + 5; i += 9) {
      if (gap && i > gap[0] && i < gap[1]) continue;
      post(a - 7, i); post(b + 5, i);
    }
  },

  /* ---------- lane lines, crosswalks ---------------------- */
  drawRoadMarkings(x) {
    const lo = BORDER * TS, hi = (BORDER + SPANEND + 1) * TS;
    // centre dashes on every road, skipping intersections
    for (let n = 0; n <= BLOCKS; n++) {
      const cx = (BORDER + n * SPAN) * TS + TS;
      for (let y = lo; y < hi; y += 22) {
        if (this.inIntersection(cx, y + 6)) continue;
        R(x, PAL.lineY, cx - 1, y, 2, 12);
      }
      const cy = (BORDER + n * SPAN) * TS + TS;
      for (let px = lo; px < hi; px += 22) {
        if (this.inIntersection(px + 6, cy)) continue;
        R(x, PAL.lineY, px, cy - 1, 12, 2);
      }
    }
    // crosswalks on every intersection approach
    for (let ny = 0; ny <= BLOCKS; ny++) for (let nx = 0; nx <= BLOCKS; nx++) {
      const ix = (BORDER + nx * SPAN) * TS, iy = (BORDER + ny * SPAN) * TS;
      for (let s = 0; s < 4; s++) {
        const vert = s < 2;
        const px = vert ? ix : (s === 2 ? ix - 7 : ix + 32);
        const py = vert ? (s === 0 ? iy - 7 : iy + 32) : iy;
        if (px < lo - 8 || py < lo - 8 || px > hi || py > hi) continue;
        for (let i = 2; i < 32; i += 6) {
          if (vert) R(x, PAL.lineW, px + i, py, 4, 7);
          else      R(x, PAL.lineW, px, py + i, 7, 4);
        }
      }
    }
    // curb line where sidewalk meets road
    x.fillStyle = PAL.curb;
    for (let b = 0; b < BLOCKS; b++) {
      for (let n = 0; n <= BLOCKS; n++) {
        const s = (BORDER + b * SPAN + 2) * TS, len = 10 * TS;
        const e = (BORDER + n * SPAN) * TS;
        x.fillRect(s, e + 32 - 1, len, 1);
        x.fillRect(s, e - 1, len, 1);
        x.fillRect(e + 32 - 1, s, 1, len);
        x.fillRect(e - 1, s, 1, len);
      }
    }
  },

  inIntersection(wx, wy) {
    const ax = (wx / TS | 0) - BORDER, ay = (wy / TS | 0) - BORDER;
    return (ax % SPAN) < 2 && (ay % SPAN) < 2;
  },

  markSolid(tx0, ty0, w, h) {
    for (let ty = ty0; ty < ty0 + h; ty++) for (let tx = tx0; tx < tx0 + w; tx++)
      if (tx >= 0 && ty >= 0 && tx < GW && ty < GH) this.solid[ty * GW + tx] = 1;
  },

  /* markSolid obeys blindly, which is how a generator buries a porch and makes
     an address unwinnable. Block generators should use this instead: it refuses
     keep tiles and returns how many it refused, so a generator that is fighting
     the porch mask shows up rather than silently winning. */
  markSolidSafe(tx0, ty0, w, h) {
    let refused = 0;
    for (let ty = ty0; ty < ty0 + h; ty++) for (let tx = tx0; tx < tx0 + w; tx++) {
      if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) continue;
      const i = ty * GW + tx;
      if (this.keep[i]) { refused++; continue; }
      this.solid[i] = 1;
    }
    return refused;
  },

  /* ---------- an address, wherever it is ------------------ */
  /* Turns a building footprint into a deliverable address: porch, kerb point,
     nav node, house number, the `keep` reservation and the ground paint.

     This lives here rather than inside genResidential because section 7 of the
     neighbourhood spec deferred downtown deliveries specifically to avoid a
     SECOND address path -- so the way to have them is to make sure there is
     still only one. genResidential, genRetail and genApts all come through
     here, which is also why a downtown door cannot drift out of step with a
     suburban porch: there is nothing to keep in step.

     The geometry generalises for free. Every offset below is measured from the
     footprint, so a building flush to the lot line -- which is what downtown
     storefronts are -- puts its porch in the sidewalk ring, exactly where a
     street door belongs, with no special case. The target stays 28px wide
     everywhere; downtown is nearer the kerb and therefore a softer throw, and
     that is deliberate, being the payoff for driving the spine and crossing
     the tracks. `newOrder` issues addresses rather than letting the player
     pick, so it cannot be farmed.

     `along` positions the number within the block; `odd` keeps the two sides
     of a street on opposite parities so blocks facing each other never
     collide.

     `b` is the building: {x, y, w, h, oy}, where `oy` is the fake wall height
     the sprite draws above its footprint. */
  addAddress(bx, by, b, dir, along, kind) {
    const wx = b.x, wy = b.y, w = b.w, h = b.h;
    let porch, curb;
    // the porch is the delivery target, so it is sized to stay hittable from
    // a moving car: wide along the street, one yard-tile deep
    //
    // A NORTH-facing porch is the one case where the building's own fake height
    // rises into its target: statics draw from `y - oy`, so the wall covers the
    // porch from the top down. A house has oy 9 against a 15px porch and leaves
    // a 6px sliver, which is the look the game shipped with. A store run has oy
    // 14 and left 1px -- present, hittable, invisible. So a taller wall pushes
    // its porch further out to keep that same 6px, and anything oy 9 or under
    // lands exactly where it always did.
    const clear0 = Math.max(0, (b.oy || 0) - 9);
    if (dir === 0)      porch = { x: wx + w / 2 - 14, y: wy - 15 - clear0, w: 28, h: 15 };
    else if (dir === 2) porch = { x: wx + w / 2 - 14, y: wy + h,  w: 28, h: 15 };
    else if (dir === 1) porch = { x: wx + w,          y: wy + h / 2 - 14, w: 15, h: 28 };
    else                porch = { x: wx - 15,         y: wy + h / 2 - 14, w: 15, h: 28 };

    const pcx = porch.x + porch.w / 2, pcy = porch.y + porch.h / 2;
    if (dir === 0)      curb = { x: pcx, y: (BORDER + by * SPAN) * TS + TS };
    else if (dir === 2) curb = { x: pcx, y: (BORDER + (by + 1) * SPAN) * TS + TS };
    else if (dir === 3) curb = { x: (BORDER + bx * SPAN) * TS + TS, y: pcy };
    else                curb = { x: (BORDER + (bx + 1) * SPAN) * TS + TS, y: pcy };
    const node = [this.nearNodeX(curb.x), this.nearNodeY(curb.y)];

    /* address — real Hays convention.
       Fronting a NUMBERED street: a W/E prefix and a hundred-block from the
       distance to Main. Main-Fort is the 100 block, Fort-Ash the 200, and so
       on outward in both directions.
       Fronting a NAMED street: the hundred-block is the numbered street on
       the south edge of the block, which is how 1507 Main lands between 15th
       and 16th, and the courthouse at 1204 Fort between 12th and 13th. */
    const odd = (dir === 0 || dir === 3) ? 1 : 0;
    let street, hundred;
    if (dir === 0 || dir === 2) {
      street  = ((bx < 4) ? 'W ' : 'E ') + ((dir === 0) ? HSTREETS[by] : HSTREETS[by + 1]);
      hundred = ((bx < 4) ? 4 - bx : bx - 3) * 100;
    } else {
      street  = (dir === 3) ? VSTREETS[bx] : VSTREETS[bx + 1];
      hundred = parseInt(HSTREETS[by + 1], 10) * 100;
    }
    const num = hundred + along * 22 + 6 + odd;

    const house = {
      x: wx, y: wy, w, h, dir, porch, street, num, kind,
      addr: num + ' ' + street,
      door: { x: pcx - 6, y: pcy - 5, w: 12, h: 10 },
      cx: wx + w / 2, cy: wy + h / 2, curb, node,
    };
    this.houses.push(house);

    /* reserve the porch and its walkway out to the kerb */
    const clr = dir === 0 ? { x: porch.x, y: (BORDER + by * SPAN + 2) * TS, w: porch.w, h: porch.y + porch.h - (BORDER + by * SPAN + 2) * TS }
              : dir === 2 ? { x: porch.x, y: porch.y, w: porch.w, h: (BORDER + (by + 1) * SPAN) * TS - porch.y }
              : dir === 3 ? { x: (BORDER + bx * SPAN + 2) * TS, y: porch.y, w: porch.x + porch.w - (BORDER + bx * SPAN + 2) * TS, h: porch.h }
              :             { x: porch.x, y: porch.y, w: (BORDER + (bx + 1) * SPAN) * TS - porch.x, h: porch.h };
    for (let ty2 = (clr.y / TS) | 0; ty2 <= ((clr.y + clr.h - 1) / TS) | 0; ty2++)
      for (let tx2 = (clr.x / TS) | 0; tx2 <= ((clr.x + clr.w - 1) / TS) | 0; tx2++)
        if (tx2 >= 0 && ty2 >= 0 && tx2 < GW && ty2 < GH) this.keep[ty2 * GW + tx2] = 1;
    house.clear = clr;

    /* ground: porch pad + walkway to the sidewalk */
    const g = this.gx;
    R(g, PAL.porch, porch.x, porch.y, porch.w, porch.h);
    R(g, shade(PAL.porch, -0.22), porch.x, porch.y + porch.h - 1, porch.w, 1);
    R(g, shade(PAL.porch, 0.15), porch.x, porch.y, porch.w, 1);
    g.strokeStyle = 'rgba(20,14,28,0.35)'; g.lineWidth = 1;
    g.strokeRect(porch.x + 0.5, porch.y + 0.5, porch.w - 1, porch.h - 1);

    const pathC = '#c2b697';
    if (dir === 0)      R(g, pathC, pcx - 5, (BORDER + by * SPAN + 2) * TS, 10, porch.y - (BORDER + by * SPAN + 2) * TS);
    else if (dir === 2) R(g, pathC, pcx - 5, porch.y + porch.h, 10, (BORDER + (by + 1) * SPAN - 1) * TS + TS - (porch.y + porch.h));
    else if (dir === 3) R(g, pathC, (BORDER + bx * SPAN + 2) * TS, pcy - 5, porch.x - (BORDER + bx * SPAN + 2) * TS, 10);
    else                R(g, pathC, porch.x + porch.w, pcy - 5, (BORDER + (bx + 1) * SPAN - 1) * TS + TS - (porch.x + porch.w), 10);

    return house;
  },

  /* ---------- residential block --------------------------- */
  genResidential(rng, bx, by) {
    const ns = rng.chance(0.5);
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
      const lotAX = bx * SPAN + 3 + i * 4;      // grid-space tile of lot origin
      const lotAY = by * SPAN + 3 + j * 4;
      let dir, ax, ay, tw, th;
      if (ns) {
        dir = j === 0 ? 0 : 2;
        tw = 4; th = 3;
        ax = lotAX; ay = j === 0 ? lotAY + 1 : lotAY;
      } else {
        dir = i === 0 ? 3 : 1;
        tw = 3; th = 4;
        ax = i === 0 ? lotAX + 1 : lotAX; ay = lotAY;
      }
      const tx = BORDER + ax, ty = BORDER + ay;
      this.markSolid(tx, ty, tw, th);

      const wx = tx * TS, wy = ty * TS, w = tw * TS, h = th * TS;
      const variant = rng.int(Art.house.length);
      const spr = Art.house[variant][dir];
      this.statics.push({ img: spr.c, x: wx, y: wy, oy: spr.oy, w, h, sortY: wy + h });

      const addr = this.addAddress(bx, by, { x: wx, y: wy, w, h, oy: spr.oy }, dir, (dir === 0 || dir === 2) ? i : j, 'res');
      const porch = addr.porch, curb = addr.curb;
      const pcx = porch.x + porch.w / 2, pcy = porch.y + porch.h / 2;
      const g = this.gx;

      /* mailbox at the kerb */
      const mb = Art.prop.mailbox;
      let mx2 = curb.x, my2 = curb.y;
      if (dir === 0)      { mx2 = pcx + 12; my2 = (BORDER + by * SPAN + 2) * TS + 4; }
      else if (dir === 2) { mx2 = pcx + 12; my2 = (BORDER + (by + 1) * SPAN) * TS - 4; }
      else if (dir === 3) { mx2 = (BORDER + bx * SPAN + 2) * TS + 4; my2 = pcy + 12; }
      else                { mx2 = (BORDER + (bx + 1) * SPAN) * TS - 4; my2 = pcy + 12; }
      this.statics.push({ img: mb.c, x: mx2, y: my2, oy: mb.oy, w: mb.w, h: mb.h, sortY: my2 + mb.h, noShadow: true });

      /* a bush in the yard — never on the porch or its walkway */
      if (rng.chance(0.75)) {
        const bu = Art.prop.bush;
        for (let a = 0; a < 6; a++) {
          const bxp = wx + rng.int(Math.max(1, w - bu.w)), byp = wy + h - 4 + rng.int(6);
          const kt = (((byp + bu.h / 2) / TS) | 0) * GW + (((bxp + bu.w / 2) / TS) | 0);
          if (this.keep[kt]) continue;
          this.statics.push({ img: bu.c, x: bxp, y: byp, oy: bu.oy, w: bu.w, h: bu.h, sortY: byp + bu.h });
          break;
        }
      }
    }
  },

  /* ---------- commercial block ---------------------------- */
  genCommercial(rng, bx, by) {
    const b = Art.bldg[rng.int(Art.bldg.length)];
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS;
    const lotW = 8 * TS;
    const wx = lotX + ((lotW - b.w) >> 1), wy = lotY + ((lotW - b.h) >> 1);
    this.markSolid((wx / TS) | 0, (wy / TS) | 0, Math.ceil(b.w / TS), Math.ceil(b.h / TS));
    this.statics.push({ img: b.c, x: wx, y: wy, oy: b.oy, w: b.w, h: b.h, sortY: wy + b.h });

    // painted stalls in the apron
    const g = this.gx;
    g.fillStyle = '#c9cede88';
    if (wy - lotY > 20) for (let i = 0; i < 8; i++) g.fillRect(lotX + 6 + i * 15, lotY + 2, 1, 14);
    if (lotY + lotW - (wy + b.h) > 20) for (let i = 0; i < 8; i++) g.fillRect(lotX + 6 + i * 15, lotY + lotW - 16, 1, 14);
  },

  /* ---------- the Union Pacific corridor ------------------ */
  /* Runs the full width of the map through this block row, solid along its
     whole length except where the nine north-south streets cross it. That is
     what makes the tracks a barrier rather than scenery: you cross where Hays
     lets you cross. Ballast bakes into the ground once and never changes. */
  genRail(rng, bx, by) {
    const g = this.gx;
    const MID = 6;                                    // corridor centre, block-local tiles
    this.railY = (BORDER + by * SPAN + MID) * TS;
    /* The corridor carries two tracks: each rail tile bakes a pair of rails,
       and genRail lays two rows of them. A train running down railY would
       straddle both and read as floating, so it has to pick one. Right-hand
       running, the same convention Traffic.laneFixed uses for the road:
       eastbound keeps to the south track. */
    this.tracks = [this.railY - 8, this.railY + 8];
    const lastCol = bx === BLOCKS - 1;
    const lxMax = lastCol ? SPAN + 1 : SPAN - 1;      // the far kerb carries the ninth crossing

    for (let ly = MID - 2; ly <= MID + 1; ly++) {
      const ty = BORDER + by * SPAN + ly;
      for (let lx = 0; lx <= lxMax; lx++) {
        const tx = BORDER + bx * SPAN + lx;
        if (tx < BORDER || tx >= GW - BORDER) continue;
        const onRoad = (lx % SPAN) < 2;
        const isRail = ly === MID - 1 || ly === MID;
        const set = onRoad ? (isRail ? Art.tile.plank : Art.tile.road)
                           : (isRail ? Art.tile.rail : Art.tile.ballast);
        g.drawImage(set[(lx + ly) & 3], tx * TS, ty * TS);
        this.surf[ty * GW + tx] = onRoad ? S_ROAD : S_GRASS;
        if (!onRoad) this.markSolidSafe(tx, ty, 1, 1);
      }
    }

    const addCrossing = (col) => {
      const cx = (BORDER + col * SPAN) * TS + TS;
      if (this.crossings.some((c) => Math.abs(c.x - cx) < 4)) return;
      /* A crossbuck on each approach, diagonally opposed like the real thing,
         44px off the centre line rather than ~20. The mast sprite is 28 tall
         with oy = 26, so its head sits 26px ABOVE the anchor: at +22 the south
         crossbuck landed on the south track and the train drew straight
         through it. 44 is the first offset that clears the rails, and it puts
         both masts outside the ballast band rather than in it. */
      const s = Art.signal, masts = [];
      for (const [ox, oy] of [[-24, 44], [22, -44]]) {
        const px = cx + ox, py = this.railY + oy;
        this.statics.push({ img: s.c, x: px, y: py, oy: s.oy, w: s.w, h: s.h, sortY: py + s.h, noShadow: true });
        masts.push([px + 5, py]);            // the mast centre line, at its base
      }
      this.crossings.push({ x: cx, y: this.railY, masts });
    };
    addCrossing(bx);
    if (lastCol) addCrossing(bx + 1);
  },

  /* ---------- auto / industrial block --------------------- */
  /* A shed at the back and rows of stock out front — which is what a car lot
     and a metal works both look like from above. The parked cars are the same
     statics genParking uses; no new art needed for them. */
  genAuto(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;

    /* asphalt across the whole lot */
    for (let ly = 3; ly <= 10; ly++) for (let lx = 3; lx <= 10; lx++) {
      const tx = BORDER + bx * SPAN + lx, ty = BORDER + by * SPAN + ly;
      this.surf[ty * GW + tx] = S_ROAD;
      g.drawImage(Art.tile.lot[(lx + ly) & 3], tx * TS, ty * TS);
    }

    /* shed hard against the back line */
    const s = Art.shed[rng.int(Art.shed.length)];
    const wx = lotX + ((L - s.w) >> 1), wy = lotY + TS;
    this.markSolidSafe((wx / TS) | 0, (wy / TS) | 0, Math.ceil(s.w / TS), Math.ceil(s.h / TS));
    this.statics.push({ img: s.c, x: wx, y: wy, oy: s.oy, w: s.w, h: s.h, sortY: wy + s.h });

    /* ONE row of stock, flush to the front lot line, with a wide aisle behind.
       Two rows 26px apart left a 4px pocket between them, and because each car
       marks 2x2 tiles the neighbouring marks merged into walls either side of
       it — a genuine trap the wedge sweep caught. Keep the aisle wider than a
       car and keep the row flush, so there is no gap to be caught in. */
    const ry = lotY + L - 32;
    g.fillStyle = '#c9cedeaa';
    for (let i = 0; i <= 6; i++) g.fillRect(lotX + 6 + i * 18, ry, 1, 22);
    for (let i = 0; i < 6; i++) {
      if (!rng.chance(0.72)) continue;
      const fr = Art.car[rng.int(Art.car.length)];
      const px = lotX + 8 + i * 18;
      this.statics.push({ img: fr[ROT / 4], x: px - 2, y: ry, oy: 4, w: 18, h: 22, sortY: ry + 22, isCar: true, fw: fr.size });
      this.markSolidSafe((px / TS) | 0, (ry / TS) | 0, 2, 2);
    }
  },

  /* ---------- church block -------------------------------- */
  /* Nave set in a lawn, steeple at the street end. The steeple is placed as a
     separate static so its huge overhang sorts against the nave correctly. */
  genChurch(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    const c = Art.church[rng.int(Art.church.length)];
    const wx = lotX + ((L - c.w) >> 1), wy = lotY + TS;

    this.markSolidSafe((wx / TS) | 0, (wy / TS) | 0, Math.ceil(c.w / TS), Math.ceil(c.h / TS));
    this.statics.push({ img: c.c, x: wx, y: wy, oy: c.oy, w: c.w, h: c.h, sortY: wy + c.h });

    /* Steeple at the south-WEST corner, clear of the centre door. Its overhang
       is the largest in the game, so anything it stands in front of is hidden —
       putting it over the entrance buried the doors it is meant to announce. */
    const s = Art.steeple;
    const sx = wx - 10, sy = wy + c.h - 2;
    this.markSolidSafe((sx / TS) | 0, (sy / TS) | 0, 2, 1);
    this.statics.push({ img: s.c, x: sx, y: sy, oy: s.oy, w: s.w, h: s.h, sortY: sy + s.h });

    /* path from the door to the pavement */
    const px = wx + (c.w >> 1);
    R(g, '#c2b697', px - 6, wy + c.h, 12, lotY + L - (wy + c.h));

    /* a tree at each front corner */
    for (const tx0 of [lotX + 4, lotX + L - 26]) {
      const t = Art.tree[rng.int(Art.tree.length)];
      const py = lotY + L - 30;
      this.markSolidSafe((tx0 / TS) | 0, (py / TS) | 0, 1, 1);
      this.statics.push({ img: t.c, x: tx0, y: py, oy: t.oy, w: t.w, h: t.h, sortY: py + t.h });
    }
  },

  /* ---------- apartment block ----------------------------- */
  /* Two blocks of flats with a shared apron behind, each with a street door.
     These used to be scenery, on the grounds that a second address path was
     not worth the branch; they are deliverable now because there is no second
     path -- see addAddress. */
  genApts(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;

    /* apron across the back half */
    for (let ly = 3; ly <= 10; ly++) for (let lx = 3; lx <= 10; lx++) {
      const tx = BORDER + bx * SPAN + lx, ty = BORDER + by * SPAN + ly;
      if (ly > 7) continue;
      this.surf[ty * GW + tx] = S_ROAD;
      g.drawImage(Art.tile.lot[(lx + ly) & 3], tx * TS, ty * TS);
    }

    /* Two blocks facing the street, a gap between them. Both front the same
       south street, so they take along 0 and 1 to keep their numbers apart. */
    for (let ai = 0; ai < 2; ai++) {
      const b = Art.apts[rng.int(Art.apts.length)];
      const wx = lotX + ai * 4 * TS, wy = lotY + L - b.h;
      this.markSolidSafe((wx / TS) | 0, (wy / TS) | 0, Math.ceil(b.w / TS), Math.ceil(b.h / TS));
      this.statics.push({ img: b.c, x: wx, y: wy, oy: b.oy, w: b.w, h: b.h, sortY: wy + b.h });
      this.addAddress(bx, by, { x: wx, y: wy, w: b.w, h: b.h, oy: b.oy }, 2, ai, 'apts');
    }

    /* bins and a bench on the apron */
    for (let i = 0; i < 3; i++) {
      const pr = Art.prop[rng.chance(0.5) ? 'trash' : 'bench'];
      const px = lotX + 8 + rng.int(L - 24), py = lotY + 10 + rng.int(40);
      this.statics.push({ img: pr.c, x: px, y: py, oy: pr.oy, w: pr.w, h: pr.h, sortY: py + pr.h, noShadow: true });
    }
  },

  /* ---------- civic block --------------------------------- */
  /* Post office, bank, county offices. Set back behind a paved forecourt
     rather than built to the pavement: downtown crowds the street, civic
     buildings stand off it, and that setback is the whole read. */
  genCivic(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    const b = Art.civic[rng.int(Art.civic.length)];
    const wx = lotX + ((L - b.w) >> 1), wy = lotY + TS;

    this.markSolidSafe((wx / TS) | 0, (wy / TS) | 0, Math.ceil(b.w / TS), Math.ceil(b.h / TS));
    this.statics.push({ img: b.c, x: wx, y: wy, oy: b.oy, w: b.w, h: b.h, sortY: wy + b.h });

    /* paved forecourt between the steps and the pavement */
    for (let ty = ((wy + b.h) / TS) | 0; ty < ((lotY + L) / TS) | 0; ty++)
      for (let tx = (lotX / TS) | 0; tx < ((lotX + L) / TS) | 0; tx++) {
        this.surf[ty * GW + tx] = S_WALK;
        g.drawImage(Art.tile.walk[(tx + ty) & 3], tx * TS, ty * TS);
      }

    /* a tree either side of the forecourt */
    for (const sx of [lotX + 8, lotX + L - 28]) {
      const t = Art.tree[rng.int(Art.tree.length)];
      const py = wy + b.h + 8;
      this.markSolidSafe((sx / TS) | 0, (py / TS) | 0, 1, 1);
      this.statics.push({ img: t.c, x: sx, y: py, oy: t.oy, w: t.w, h: t.h, sortY: py + t.h });
    }
  },

  /* ---------- downtown retail block ----------------------- */
  /* Built to the lot line north and south, with a service court between. The
     read that matters from directly above is "no yards, no gaps" — that is what
     separates downtown from the residential blocks, far more than which way a
     shopfront happens to face. */
  genRetail(rng, bx, by) {
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    const g = this.gx;

    /* service court behind the runs: asphalt, not lawn */
    for (let ly = 3; ly <= 10; ly++) for (let lx = 3; lx <= 10; lx++) {
      const tx = BORDER + bx * SPAN + lx, ty = BORDER + by * SPAN + ly;
      this.surf[ty * GW + tx] = S_ROAD;
      g.drawImage(Art.tile.lot[(lx + ly) & 3], tx * TS, ty * TS);
    }

    /* two runs, hard against the north and south lot lines. Each carries one
       street door for the flat above it -- which is what a downtown Hays
       storefront actually has, and what gives the Fort/Main spine somewhere to
       deliver to. The runs face opposite streets, so both take along=0 and the
       parity rule keeps their numbers off each other. */
    for (const side of [0, 1]) {
      const s = Art.store[rng.int(Art.store.length)];
      const wx = lotX;
      const wy = side === 0 ? lotY + TS : lotY + L - s.h;
      this.markSolidSafe((wx / TS) | 0, (wy / TS) | 0, 8, Math.ceil(s.h / TS));
      this.statics.push({ img: s.c, x: wx, y: wy, oy: s.oy, w: s.w, h: s.h, sortY: wy + s.h });
      this.addAddress(bx, by, { x: wx, y: wy, w: s.w, h: s.h, oy: s.oy }, side === 0 ? 0 : 2, 0, 'retail');
    }

    /* painted bays in the service court */
    g.fillStyle = '#c9cede55';
    for (let i = 0; i < 7; i++) g.fillRect(lotX + 8 + i * 17, lotY + L / 2 - 8, 1, 16);
  },

  /* ---------- park block ---------------------------------- */
  genPark(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    // winding path
    g.fillStyle = '#c2b697';
    g.fillRect(lotX, lotY + L / 2 - 6, L, 12);
    g.fillRect(lotX + L / 2 - 6, lotY, 12, L);
    // pond
    if (rng.chance(0.6)) {
      const px = lotX + 8 + rng.int(30), py = lotY + 8 + rng.int(30), pw = 40 + rng.int(24), ph = 30 + rng.int(16);
      g.fillStyle = PAL.pond; g.beginPath(); g.ellipse(px + pw / 2, py + ph / 2, pw / 2, ph / 2, 0, 0, TAU); g.fill();
      g.fillStyle = PAL.pondLite; g.beginPath(); g.ellipse(px + pw / 2, py + ph / 2 - 2, pw / 2 - 4, ph / 2 - 4, 0, 0, TAU); g.fill();
      g.fillStyle = PAL.pondFoam;
      for (let i = 0; i < 6; i++) g.fillRect(px + 8 + rng.int(pw - 16), py + 6 + rng.int(ph - 12), 4, 1);
      this.markSolid(((px + 6) / TS) | 0, ((py + 6) / TS) | 0, Math.max(1, ((pw - 12) / TS) | 0), Math.max(1, ((ph - 12) / TS) | 0));
    }
    for (let i = 0; i < 7 + rng.int(5); i++) {
      const t = Art.tree[rng.int(Art.tree.length)];
      const tx = lotX + rng.int(L - t.w), ty = lotY + rng.int(L - t.h);
      this.markSolid(((tx + t.w / 2 - 4) / TS) | 0, ((ty + t.h / 2 - 4) / TS) | 0, 1, 1);
      this.statics.push({ img: t.c, x: tx, y: ty, oy: t.oy, w: t.w, h: t.h, sortY: ty + t.h });
    }
    for (let i = 0; i < 2; i++) {
      const bn = Art.prop.bench;
      const tx = lotX + 10 + rng.int(L - 30), ty = lotY + L / 2 + 10 + rng.int(20);
      this.statics.push({ img: bn.c, x: tx, y: ty, oy: bn.oy, w: bn.w, h: bn.h, sortY: ty + bn.h, noShadow: true });
    }
  },

  /* ---------- parking lot block --------------------------- */
  genParking(rng, bx, by) {
    const g = this.gx;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    g.fillStyle = '#c9cedeaa';
    for (let row = 0; row < 3; row++) {
      const ry = lotY + 10 + row * 40;
      for (let i = 0; i <= 6; i++) g.fillRect(lotX + 8 + i * 18, ry, 1, 26);
      g.fillRect(lotX + 8, ry, 109, 1);
    }
    for (let i = 0; i < 6 + rng.int(6); i++) {
      const ci = rng.int(Art.car.length), fr = Art.car[ci];
      const row = rng.int(3);
      const px = lotX + 10 + rng.int(6) * 18, py = lotY + 12 + row * 40;
      const d = fr.size;
      this.statics.push({ img: fr[ROT / 4], x: px - 2, y: py, oy: 4, w: 18, h: 22, sortY: py + 22, noShadow: false, isCar: true, fw: d });
      this.markSolid((px / TS) | 0, (py / TS) | 0, 2, 2);
    }
  },

  /* ---------- the shop ------------------------------------ */
  genShop(rng, bx, by) {
    const p = Art.taqueria;
    const lotX = (BORDER + bx * SPAN + 3) * TS, lotY = (BORDER + by * SPAN + 3) * TS, L = 8 * TS;
    const wx = lotX + ((L - p.w) >> 1), wy = lotY;
    this.markSolid((wx / TS) | 0, (wy / TS) | 0, Math.ceil(p.w / TS), Math.ceil(p.h / TS));
    this.statics.push({ img: p.c, x: wx, y: wy, oy: p.oy, w: p.w, h: p.h, sortY: wy + p.h });

    const g = this.gx;
    const dockX = wx + p.w / 2, dockY = wy + p.h + 24;

    /* The apron and the driveway are declared as rectangles once and then used
       twice -- to paint, and to pave. They used to be two separate sets of
       numbers: the paint was here and the `surf` array was never touched at
       all, so the ground was drawn as tarmac while the data underneath it
       still said sidewalk. Nothing on screen showed it, because the picture
       was right; it surfaced as the car crawling on and off the dock at
       SURF_MUL[S_WALK] = 0.60 -- 60% of top speed AND acceleration -- which
       reads as bad handling rather than as a bug. This is the one place in the
       game the player is required to leave the road, and every restock trip
       crosses it twice, so it was the most-driven wrong tile in the city.
       Keep the paint and the pave reading from the same rect. */
    const apron = { x: dockX - 30, y: dockY - 16, w: 60, h: 32 };
    const drive = { x: dockX - 20, y: dockY + 16, w: 40,
                    h: (BORDER + (by + 1) * SPAN) * TS - (dockY + 16) };

    // apron with a bold painted pickup bay
    R(g, PAL.amber, apron.x, apron.y, apron.w, apron.h);
    R(g, '#3a3040', apron.x + 3, apron.y + 3, apron.w - 6, apron.h - 6);
    for (let i = 0; i < apron.w; i += 8) R(g, PAL.amber, apron.x + i, apron.y, 4, 3);
    text(g, 'PICKUP', dockX, dockY - 8, PAL.amber, 1, 1);
    text(g, 'ONLY', dockX, dockY + 2, PAL.amber, 1, 1);

    this.shop = {
      x: wx, y: wy, w: p.w, h: p.h,
      dock: { x: dockX, y: dockY },
      node: [this.nearNodeX(dockX), this.nearNodeY(wy + p.h + 60)],
      curb: { x: dockX, y: (BORDER + (by + 1) * SPAN) * TS + TS },
    };
    this.shop.node = [this.nearNodeX(this.shop.curb.x), this.nearNodeY(this.shop.curb.y)];

    // driveway out to the street
    R(g, '#5a5e70', drive.x, drive.y, drive.w, drive.h);

    /* Pave what we just painted: every tile the apron or the driveway touches
       is drivable road, and is reserved in `keep` so no later generator can
       put a tree or a prop in the one loading bay in the game. genFurniture
       runs after every block generator and only tests `keep`. */
    for (const r of [apron, drive]) {
      for (let ty = (r.y / TS) | 0; ty <= ((r.y + r.h - 1) / TS) | 0; ty++)
        for (let tx = (r.x / TS) | 0; tx <= ((r.x + r.w - 1) / TS) | 0; tx++) {
          if (tx < 0 || ty < 0 || tx >= GW || ty >= GW) continue;
          this.surf[ty * GW + tx] = S_ROAD;
          this.keep[ty * GW + tx] = 1;
        }
    }
  },

  /* ---------- street furniture along sidewalks ------------ */
  genFurniture(rng) {
    for (let by = 0; by <= BLOCKS; by++) for (let bx = 0; bx <= BLOCKS; bx++) {
      // lamps at intersection corners
      const ix = (BORDER + bx * SPAN) * TS, iy = (BORDER + by * SPAN) * TS;
      for (const [ox, oy] of [[-10, -10], [36, -10], [-10, 36], [36, 36]]) {
        const px = ix + ox, py = iy + oy;
        if (px < BORDER * TS || py < BORDER * TS || px > (BORDER + SPANEND) * TS || py > (BORDER + SPANEND) * TS) continue;
        const l = Art.prop.lamp;
        this.statics.push({ img: l.c, x: px, y: py, oy: l.oy, w: l.w, h: l.h, sortY: py + l.h, noShadow: true });
      }
    }
    // hydrants / trash / cones scattered on sidewalks
    for (let i = 0; i < 190; i++) {
      const bx = rng.int(BLOCKS), by = rng.int(BLOCKS);
      const side = rng.int(4);
      const base = rng.int(8) + 1;
      let ax, ay;
      if (side === 0) { ax = bx * SPAN + 2 + base; ay = by * SPAN + 2; }
      else if (side === 2) { ax = bx * SPAN + 2 + base; ay = by * SPAN + 11; }
      else if (side === 3) { ax = bx * SPAN + 2; ay = by * SPAN + 2 + base; }
      else { ax = bx * SPAN + 11; ay = by * SPAN + 2 + base; }
      if (this.keep[(BORDER + ay) * GW + (BORDER + ax)]) continue;
      const px = (BORDER + ax) * TS + 4, py = (BORDER + ay) * TS + 3;
      const kind = rng() < 0.4 ? 'hydrant' : rng() < 0.7 ? 'trash' : 'cone';
      const pr = Art.prop[kind];
      this.statics.push({ img: pr.c, x: px, y: py, oy: pr.oy, w: pr.w, h: pr.h, sortY: py + pr.h, noShadow: true });
    }
    // street trees in the grass strip
    for (let i = 0; i < 140; i++) {
      const bx = rng.int(BLOCKS), by = rng.int(BLOCKS);
      const ax = bx * SPAN + 3 + rng.int(8), ay = by * SPAN + 3 + rng.int(8);
      const tx = BORDER + ax, ty = BORDER + ay;
      if (this.solid[ty * GW + tx] || this.keep[ty * GW + tx] || this.surf[ty * GW + tx] !== S_GRASS) continue;
      const t = Art.tree[rng.int(Art.tree.length)];
      const px = tx * TS - 2, py = ty * TS - 4;
      this.markSolid(tx, ty, 1, 1);
      this.statics.push({ img: t.c, x: px, y: py, oy: t.oy, w: t.w, h: t.h, sortY: py + t.h });
    }
  },
};


/* ===== 50_entities.js ===== */
/* ============================================================
   ENTITIES  --  player, traffic, pedestrians, cop, taco bag, fx
   ============================================================ */
'use strict';

const SEG0  = BORDER * TS;          // world px where the road grid starts
const PITCH = SPAN * TS;            // 192 px between parallel roads
const DIRV  = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // 0=E 1=S 2=W 3=N

const MAXSPD  = 176;
// how far a car's shadow falls south of it. The offset is the light
// direction, so it is fixed in WORLD space and must not rotate with the car —
// only the silhouette turns. Was implicit in the old hard-coded rect, whose
// centre sat 2.5px below the sprite's.
const CAR_SHADOW_DY = 3;
const ACC     = 285;
const BRAKE   = 460;
const REVMAX  = 78;
const TURNRATE = 3.25;
const SURF_MUL = [1, 0.60, 0.54, 0.4];   // road, walk, grass, open ground

/* ---------------- generic car body collision -------------- */
const CORNERS = [[9, 4.5], [9, -4.5], [-9, 4.5], [-9, -4.5], [0, 5.5], [0, -5.5]];
function carBlocked(x, y, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = 0; i < CORNERS.length; i++) {
    const lx = CORNERS[i][0], ly = CORNERS[i][1];
    if (City.isSolid(x + lx * c - ly * s, y + lx * s + ly * c)) return true;
  }
  return false;
}

const UNWEDGE_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1],
                      [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]];
/**
 * Depenetration. carBlocked() is tested at the DESTINATION, so once a body is
 * already overlapping geometry every nearby destination overlaps too —
 * including the ones that would free it. Both axis moves are rejected, speed
 * is killed every frame, and steering is speed-gated, so the car can neither
 * drive nor turn out: it is stuck permanently, not merely awkwardly. Nudge it
 * toward whichever direction has clear space.
 */
function unwedge(e, dt) {
  if (!carBlocked(e.x, e.y, e.ang)) return false;
  const step = 90 * dt;
  // widening search: a deep corner has nothing clear close by, and giving up
  // at one radius leaves exactly those cases permanently stuck
  for (const r of [12, 22, 34]) {
    for (let i = 0; i < UNWEDGE_DIRS.length; i++) {
      const dx = UNWEDGE_DIRS[i][0], dy = UNWEDGE_DIRS[i][1];
      if (!carBlocked(e.x + dx * r, e.y + dy * r, e.ang)) {
        e.x += dx * step; e.y += dy * step;
        return true;
      }
    }
  }
  return false;
}

/* ---------------- the player ------------------------------ */
/* gripMul is set by G per level: 1 in summer, under 1 on winter snow. A
   static on the class rather than a module const, so it adds no top-level
   name to the bundle. */
class Player {
  static gripMul = 1;
  constructor(x, y, ang) {
    this.x = x; this.y = y; this.ang = ang;
    this.vx = 0; this.vy = 0;
    this.slip = 0; this.spinT = 0; this.impact = 0;
    this.throttle = 0; this.steer = 0; this.hb = false;
    this.skidT = 0;
  }
  get speed() { return hyp(this.vx, this.vy); }
  get fwdSpeed() { return this.vx * Math.cos(this.ang) + this.vy * Math.sin(this.ang); }

  control(inp) {
    if (this.spinT > 0) { this.throttle = 0; this.steer = 0; return; }
    const up = inp.k('KeyW', 'ArrowUp'), dn = inp.k('KeyS', 'ArrowDown');
    this.throttle = up ? 1 : dn ? -1 : 0;
    const lf = inp.k('KeyA', 'ArrowLeft'), rt = inp.k('KeyD', 'ArrowRight');
    this.steer = (rt ? 1 : 0) - (lf ? 1 : 0);
    this.hb = inp.k('ShiftLeft', 'ShiftRight');
  }

  update(dt, G) {
    if (this.spinT > 0) {
      this.spinT -= dt;
      this.ang += 11 * dt * this.spinDir;
    }
    const surf = City.surfaceAt(this.x, this.y);
    const mul = SURF_MUL[surf] || 1;

    /* steering */
    const spd = this.speed;
    const back = this.fwdSpeed < -2 ? -1 : 1;
    const turn = this.steer * TURNRATE * clamp(spd / 46, 0, 1) * (1 - 0.28 * clamp(spd / MAXSPD, 0, 1)) * back;
    if (this.spinT <= 0) this.ang += turn * dt;

    /* longitudinal */
    const fx = Math.cos(this.ang), fy = Math.sin(this.ang);
    let vf = this.vx * fx + this.vy * fy;
    let vl = -this.vx * fy + this.vy * fx;

    if (this.throttle > 0) vf += ACC * mul * dt;
    else if (this.throttle < 0) vf -= (vf > 0 ? BRAKE : ACC * 0.6) * dt;
    if (this.hb) vf -= sign(vf) * 210 * dt;

    vf -= vf * 0.85 * dt;
    vf = clamp(vf, -REVMAX, MAXSPD * mul);

    /* grip / drift */
    /* Player.gripMul is the season: winter packs the streets with snow, so
       the back steps out sooner and a handbrake turn carries further. */
    const grip = (this.hb ? 1.35 : (surf === S_ROAD ? 8.5 : 5.2)) * Player.gripMul;
    const before = vl;
    vl *= Math.exp(-grip * dt);
    this.slip = Math.abs(before - vl);

    this.vx = fx * vf - fy * vl;
    this.vy = fy * vf + fx * vl;

    /* move with axis separation */
    unwedge(this, dt);
    let bump = 0;
    const nx = this.x + this.vx * dt;
    if (!carBlocked(nx, this.y, this.ang)) this.x = nx;
    else { bump = Math.abs(this.vx); this.vx *= -0.3; this.vy *= 0.72; }
    const ny = this.y + this.vy * dt;
    if (!carBlocked(this.x, ny, this.ang)) this.y = ny;
    else { bump = Math.max(bump, Math.abs(this.vy)); this.vy *= -0.3; this.vx *= 0.72; }

    this.x = clamp(this.x, 12, WW - 12);
    this.y = clamp(this.y, 12, WH - 12);

    if (bump > 40) {
      this.impact = 1;
      G.shake = Math.max(G.shake, clamp(bump / 26, 1, 7));
      G.hitstop = Math.max(G.hitstop, bump > 110 ? 0.07 : 0.03);
      Audio5.sfx(bump > 110 ? 'crash' : 'bump');
      for (let i = 0; i < (bump > 110 ? 14 : 6); i++)
        Fx.spark(this.x + rand(-8, 8), this.y + rand(-8, 8), rand(-60, 60), rand(-60, 60));
      if (bump > 110) { G.onCrash(); }
    }

    /* skid marks */
    this.skidT -= dt;
    if (this.slip > 26 && spd > 40 && this.skidT <= 0 && surf === S_ROAD) {
      this.skidT = 0.012;
      const c = Math.cos(this.ang), s = Math.sin(this.ang);
      City.gx.fillStyle = 'rgba(22,16,30,0.30)';
      for (const ly of [-4.5, 4.5]) {
        City.gx.fillRect((this.x - 7 * c - ly * s) | 0, (this.y - 7 * s + ly * c) | 0, 2, 2);
      }
    }
    /* dust off-road */
    if (spd > 50 && (surf === S_GRASS || surf === S_WALK) && Math.random() < 0.4)
      Fx.dust(this.x - Math.cos(this.ang) * 8, this.y - Math.sin(this.ang) * 8, surf === S_GRASS ? '#6b8f4a' : '#a8adba');
  }

  spinOut(dir) { this.spinT = 0.55; this.spinDir = dir || 1; this.vx *= 0.35; this.vy *= 0.35; }

  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    drawRot(x, Art.carShadow, sx, sy + CAR_SHADOW_DY, this.ang);
    drawRot(x, Art.player, sx, sy, this.ang);
  }
}

/* Static geometry PLUS the cars actually on the road.

   `City.isSolid` is baked at generation and knows nothing about traffic, so
   every obstacle probe built on it alone is blind to the one obstacle in this
   city that can arrive after the city was built. The demo and the cruiser both
   steered confidently into the back of moving cars because of it.

   Traffic is rail-bound and therefore always axis-aligned, so the body test is
   an oriented box rather than a radius: 18x11 plus a couple of pixels, which
   is tighter than a circle round the long axis and stops the probe flinching
   at cars in the next lane. */
function trafficBlocked(wx, wy, G) {
  if (City.isSolid(wx, wy)) return true;
  if (!G || !G.traffic) return false;
  for (const c of G.traffic) {
    const dx = Math.abs(c.x - wx), dy = Math.abs(c.y - wy);
    if (dx > 11 || dy > 11) continue;
    if ((c.dir & 1) === 0 ? (dx < 11 && dy < 7) : (dx < 7 && dy < 11)) return true;
  }
  return false;
}

/* ---------------- traffic --------------------------------- */
class Traffic {
  constructor(x, y, dir, laneNode, ci) {
    this.x = x; this.y = y; this.dir = dir; this.laneNode = laneNode;
    this.spd = rand(58, 96); this.want = this.spd;
    this.frames = Art.car[ci];
    this.dec = null; this.decN = -1;
    this.stun = 0; this.honk = 0;
  }
  static laneFixed(node, dir) {
    return SEG0 + node * PITCH + ((dir === 0 || dir === 3) ? 24 : 8);
  }
  update(dt, G) {
    if (this.stun > 0) { this.stun -= dt; this.spd *= 0.9; }
    const axis = this.dir % 2 === 0 ? 'x' : 'y';
    const pos  = axis === 'x' ? this.x : this.y;
    const posDir = (this.dir === 0 || this.dir === 1) ? 1 : -1;

    /* --- intersection decision --- */
    const rel = pos - SEG0;
    let n = Math.floor(rel / PITCH);
    const off = rel - n * PITCH;
    const atEdge = posDir > 0 ? (n >= BLOCKS) : (n <= 0);
    if (off >= -2 && off <= 34) {
      if (this.dec === null || this.decN !== n) {
        this.decN = n;
        const r = Math.random();
        if (atEdge) this.dec = r < 0.5 ? 'R' : 'L';
        else this.dec = r < 0.62 ? 'S' : (r < 0.81 ? 'R' : 'L');
        // keep turns inside the grid
        const lane2 = this.laneNode;
        if (this.dec === 'R' || this.dec === 'L') {
          const nd = this.dec === 'R' ? (this.dir + 1) % 4 : (this.dir + 3) % 4;
          const goPos = (nd === 0 || nd === 1);
          if ((goPos && lane2 >= BLOCKS) || (!goPos && lane2 <= 0)) this.dec = atEdge ? (this.dec === 'R' ? 'L' : 'R') : 'S';
        }
      }
      if (this.dec !== 'S') {
        const A = SEG0 + n * PITCH;
        const isR = this.dec === 'R';
        const tOff = ((this.dir === 0 || this.dir === 1) ? (isR ? 8 : 24) : (isR ? 24 : 8));
        const tp = A + tOff;
        const reached = posDir > 0 ? pos >= tp : pos <= tp;
        if (reached) {
          const nd = isR ? (this.dir + 1) % 4 : (this.dir + 3) % 4;
          if (axis === 'x') this.x = tp; else this.y = tp;
          this.laneNode = n;
          this.dir = nd;
          this.dec = 'S';
          const f = Traffic.laneFixed(this.laneNode, nd);
          if (nd % 2 === 0) this.y = f; else this.x = f;
        }
      }
    } else if (off > 40) this.dec = null;

    /* --- keep to the lane --- */
    const fixed = Traffic.laneFixed(this.laneNode, this.dir);
    if (this.dir % 2 === 0) this.y = approach(this.y, fixed, 90 * dt);
    else                    this.x = approach(this.x, fixed, 90 * dt);

    /* --- car ahead / player ahead --- */
    const d = DIRV[this.dir];
    let block = 999;
    for (const o of G.traffic) {
      if (o === this) continue;
      if (o.dir !== this.dir || o.laneNode !== this.laneNode) continue;
      const dx = (o.x - this.x) * d[0] + (o.y - this.y) * d[1];
      const side = Math.abs((o.x - this.x) * d[1] - (o.y - this.y) * d[0]);
      if (dx > 0 && dx < block && side < 12) block = dx;
    }
    const pdx = (G.player.x - this.x) * d[0] + (G.player.y - this.y) * d[1];
    const pside = Math.abs((G.player.x - this.x) * d[1] - (G.player.y - this.y) * d[0]);
    if (pdx > 0 && pdx < 46 && pside < 14) {
      block = Math.min(block, pdx);
      this.honk -= dt;
      if (this.honk <= 0 && pdx < 34 && G.nearScreen(this.x, this.y)) { Audio5.sfx('horn'); this.honk = 2.4; }
    }
    /* --- a closed crossing ahead --- */
    // Only north-south traffic meets the corridor. Nothing in the rules stops
    // a car driving into a moving train, but it looks like a bug, so treat a
    // lowered gate as a stopped car on the tracks. The 34px floor matters: a
    // car already between the gates is committed, and braking there would park
    // it on the rails instead of clearing them.
    if (this.dir % 2 === 1 && G.crossings) {
      const toRail = (City.railY - this.y) * DIRV[this.dir][1];
      if (toRail > 34 && toRail < 150) {
        for (const c of G.crossings) {
          if (!c.down || Math.abs(c.x - this.x) > 30) continue;
          block = Math.min(block, toRail - 30);
          break;
        }
      }
    }

    this.spd = block < 40 ? approach(this.spd, block < 22 ? 0 : 26, 320 * dt)
                          : approach(this.spd, this.want, 90 * dt);

    this.x += d[0] * this.spd * dt;
    this.y += d[1] * this.spd * dt;
  }
  get ang() { return this.dir * (PI / 2); }
  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    drawRot(x, Art.carShadow, sx, sy + CAR_SHADOW_DY, this.ang);
    drawRot(x, this.frames, sx, sy, this.ang);
  }
}

/* ---------------- the Union Pacific ----------------------- */
/* Rail-bound in the same sense Traffic is: fixed y, constant speed, no
   steering, no interpolation. It is the one hazard in the game that cannot be
   negotiated with, which is exactly why the crossings matter. */
const TRAIN_SPD = 250;              // px/s — about 8s to clear the 1632px map
const LOCO_LEN = 58, CAR_LEN = 48, CAR_GAP = 5;
const TRAIN_HH = 7;                 // hit-box half-height: the body, not the trucks

class Train {
  /* dir is +1 east, -1 west. `x` is always the NOSE, whichever way it runs. */
  constructor(dir, y) {
    this.dir = dir; this.y = y;
    this.cars = [];
    let off = 0;
    this.cars.push({ len: LOCO_LEN, img: Art.loco[dir > 0 ? 1 : 0], off });
    off += LOCO_LEN + CAR_GAP;
    const n = 5 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const b = Art.boxcar[(Math.random() * Art.boxcar.length) | 0];
      this.cars.push({ len: CAR_LEN, img: b[dir > 0 ? 1 : 0], off });
      off += CAR_LEN + CAR_GAP;
    }
    this.len = off - CAR_GAP;
    this.x = dir > 0 ? -20 : WW + 20;
    this.horn = 0.4;
    this.dead = false;
  }
  get x0() { return this.dir > 0 ? this.x - this.len : this.x; }
  get x1() { return this.x0 + this.len; }

  /* One box, nose to tail, gaps included. A 5px coupler gap is not a hole a
     car can be inside, and pretending it is would invite a threaded-the-needle
     bug on the one hazard that must never be survivable by accident. */
  hits(e) {
    const c = Math.cos(e.ang), s = Math.sin(e.ang), x0 = this.x0, x1 = this.x1;
    for (let i = 0; i < CORNERS.length; i++) {
      const lx = CORNERS[i][0], ly = CORNERS[i][1];
      const px = e.x + lx * c - ly * s, py = e.y + lx * s + ly * c;
      if (px > x0 && px < x1 && py > this.y - TRAIN_HH && py < this.y + TRAIN_HH) return true;
    }
    return false;
  }

  update(dt, G) {
    this.x += this.dir * TRAIN_SPD * dt;
    if (this.dir > 0 ? this.x0 > WW + 40 : this.x1 < -40) this.dead = true;
    this.horn -= dt;
    if (this.horn <= 0 && G.nearScreen(this.x, this.y)) { Audio5.sfx('trainhorn'); this.horn = 3.4; }
  }

  draw(x, cam) {
    for (const c of this.cars) {
      const nose = this.dir > 0 ? this.x - c.off : this.x + c.off;
      const left = this.dir > 0 ? nose - c.len : nose;
      const sx = (left - cam.x) | 0;
      if (sx > VW + 8 || sx + c.len < -8) continue;
      const sy = (this.y - cam.y - 8) | 0;
      x.fillStyle = PAL.shadow;
      x.fillRect(sx, sy + 5, c.len, 14);
      x.drawImage(c.img, sx, sy);
    }
  }
}

/* ---------------- level crossing -------------------------- */
/* The gates are DRAWN, never solid. You can always run one, which is the
   gamble the whole corridor is built around; what running one costs you is
   handled in 80_game. This class only knows how to watch a train and swing
   two arms. */
const GATE_LOWER = 0.7;     // seconds, up to down
const GATE_WARN  = 520;     // px of approach before the arms start moving
const GATE_CLEAR = 40;      // px past the tail before they lift
const BELL_T     = 0.55;

class Crossing {
  constructor(c) {
    this.x = c.x; this.y = c.y; this.masts = c.masts;
    this.t = 0; this.down = false; this.bell = 0; this.lamp = 0;
  }

  update(dt, G) {
    const tr = G.train;
    let want = false;
    if (tr) {
      // how far the crossing is AHEAD of the nose, along the way it is going
      const ahead = tr.dir > 0 ? this.x - tr.x1 : tr.x0 - this.x;
      want = ahead < GATE_WARN && ahead > -(tr.len + GATE_CLEAR);
    }
    this.t = clamp(this.t + (want ? dt : -dt) / GATE_LOWER, 0, 1);
    this.down = this.t > 0.55;
    this.lamp += dt;
    this.bell -= dt;
    if (!want) this.bell = 0;
    else if (this.bell <= 0 && G.nearScreen(this.x, this.y)) { Audio5.sfx('bell'); this.bell = BELL_T; }
  }

  /* The arm swings in the GROUND plane, not up and down. A raised arm in a
     top-down view points at the sky and foreshortens to nothing, so animating
     it vertically reads as a gate that vanished; swinging it from
     parallel-with-the-track to across-the-road is what every top-down game
     does, and what a player reads instantly. */
  drawArm(x, cam, m, a0, a1) {
    const a = a0 + (a1 - a0) * this.t;
    x.save();
    x.translate((m[0] - cam.x) | 0, (m[1] - cam.y) | 0);
    x.rotate(a);
    for (let i = 0; i < 5; i++) {                 // 4 + 5*6 = 34px, across the road
      x.fillStyle = i & 1 ? '#e8e4d8' : PAL.red;
      x.fillRect(4 + i * 6, -1, 6, 3);
    }
    x.fillStyle = '#3c4250'; x.fillRect(-2, -2, 6, 5);
    x.restore();
  }

  /* The crossbuck's two red lamps are baked into the static, so the flashing
     pair is drawn over them rather than animated in place. */
  drawLamps(x, cam, m) {
    if (this.t <= 0) return;
    const on = ((this.lamp * 3) | 0) & 1;
    const ly = (m[1] - 18 - cam.y) | 0;
    x.fillStyle = on ? '#ff6a52' : '#5a1a12';
    x.fillRect((m[0] - 4 - cam.x) | 0, ly, 3, 3);
    x.fillStyle = on ? '#5a1a12' : '#ff6a52';
    x.fillRect((m[0] + 2 - cam.x) | 0, ly, 3, 3);
  }

  draw(x, cam) {
    /* Raised is parallel to the TRACK, folded back away from the road — not
       parallel to the road. Pointing an arm along the road puts a raised gate
       lying in the carriageway, and on the north mast it draws the striped
       arm straight up through its own crossbuck. Each mast stands just
       outside its kerb, so "away from the road" is west for the south mast
       and east for the north one; each swings the way that keeps it clear of
       the rails mid-sweep. */
    this.drawArm(x, cam, this.masts[0], PI, 0);
    this.drawArm(x, cam, this.masts[1], 0, -PI);
    this.drawLamps(x, cam, this.masts[0]);
    this.drawLamps(x, cam, this.masts[1]);
  }
}

/* ---------------- pedestrian ------------------------------ */
class Ped {
  constructor(bx, by, rng) {
    const a = (BORDER + bx * SPAN + 2) * TS + 8;
    const b = (BORDER + by * SPAN + 2) * TS + 8;
    this.r = { x: a, y: b, w: 9 * TS, h: 9 * TS };
    this.per = 2 * (this.r.w + this.r.h);
    this.t = Math.random() * this.per;
    this.cw = Math.random() < 0.5 ? 1 : -1;
    this.spd = rand(17, 27);
    this.set = Art.ped[(Math.random() * Art.ped.length) | 0];
    this.f = 0; this.ft = 0; this.dir = 2;
    this.tumble = 0; this.vx = 0; this.vy = 0; this.spin = 0; this.pause = 0;
    this.place();
  }
  place() {
    const t = ((this.t % this.per) + this.per) % this.per;
    const { x, y, w, h } = this.r;
    let seg;
    if (t < w)              { this.x = x + t;                   this.y = y;                       seg = 0; }
    else if (t < w + h)     { this.x = x + w;                   this.y = y + (t - w);             seg = 1; }
    else if (t < 2 * w + h) { this.x = x + w - (t - w - h);     this.y = y + h;                   seg = 2; }
    else                    { this.x = x;                       this.y = y + h - (t - 2 * w - h); seg = 3; }
    // walking clockwise the edges face E,S,W,N; anticlockwise is the reverse
    const cwDir = [1, 2, 3, 0][seg];
    this.dir = this.cw > 0 ? cwDir : (cwDir + 2) % 4;
  }
  update(dt, G) {
    if (this.tumble > 0) {
      this.tumble -= dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= 0.93; this.vy *= 0.93; this.spin += dt * 16;
      if (this.tumble <= 0) { this.t = Math.random() * this.per; this.place(); }
      return;
    }
    if (this.pause > 0) { this.pause -= dt; return; }
    if (Math.random() < 0.0015) { this.pause = rand(0.6, 2); return; }
    this.t += this.spd * this.cw * dt;
    this.place();
    this.ft += dt;
    if (this.ft > 0.19) { this.ft = 0; this.f ^= 1; }
  }
  hitBy(px, py, vx, vy) {
    this.tumble = 1.5;
    const d = hyp(vx, vy) || 1;
    this.vx = vx / d * 130; this.vy = vy / d * 130 - 30;
    this.spin = 0;
  }
  draw(x, cam) {
    const sx = (this.x - cam.x) | 0, sy = (this.y - cam.y) | 0;
    x.fillStyle = PAL.shadow;
    x.fillRect(sx - 4, sy - 1, 9, 4);
    const img = this.set[this.dir][this.f];
    if (this.tumble > 0) {
      x.save();
      x.translate(sx, sy - 6);
      x.rotate(this.spin);
      x.drawImage(img, -4, -8);
      x.restore();
    } else x.drawImage(img, sx - 4, sy - 13);
  }
}

/* ---------------- cop ------------------------------------- */
class Cop {
  constructor(x, y, ang) {
    this.x = x; this.y = y; this.ang = ang; this.vx = 0; this.vy = 0;
    this.flash = 0; this.hitCd = 0; this.life = 0;
  }
  get speed() { return hyp(this.vx, this.vy); }
  update(dt, G) {
    this.life += dt; this.flash += dt; this.hitCd -= dt;
    const t = G.player;
    let want = Math.atan2(t.y - this.y, t.x - this.x);

    /* crude obstacle probe — geometry and traffic both */
    const probe = (a, d) => trafficBlocked(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, G);
    if (probe(this.ang, 30)) {
      const l = probe(this.ang - 0.7, 30), r = probe(this.ang + 0.7, 30);
      want = this.ang + (l && !r ? 0.9 : r && !l ? -0.9 : (this.life % 2 < 1 ? 1.2 : -1.2));
    }
    const err = angDiff(this.ang, want);
    const steer = clamp(err * 2.4, -1, 1);
    const spd = this.speed;
    this.ang += steer * TURNRATE * clamp(spd / 46, 0, 1) * (1 - 0.28 * clamp(spd / MAXSPD, 0, 1)) * dt;

    const fx = Math.cos(this.ang), fy = Math.sin(this.ang);
    let vf = this.vx * fx + this.vy * fy;
    let vl = -this.vx * fy + this.vy * fx;
    const surf = City.surfaceAt(this.x, this.y);
    const mul = SURF_MUL[surf] || 1;
    vf += ACC * mul * dt * (Math.abs(err) > 1.5 ? 0.45 : 1);
    vf -= vf * 0.85 * dt;
    vf = clamp(vf, -REVMAX, MAXSPD * mul * 1.02);
    vl *= Math.exp(-7.5 * dt);
    this.vx = fx * vf - fy * vl; this.vy = fy * vf + fx * vl;

    /* The cruiser needs this for exactly the reason the player does: carBlocked
       tests the DESTINATION, so a body already overlapping geometry has every
       nearby destination blocked too, both axis moves rejected, and steering
       speed-gated to nothing. Without it a wedged cop is stuck permanently —
       0 of 12 test sites were escapable, and it is the same defect unwedge()
       was written for. It went unnoticed because a stuck cop still despawns on
       its own timer, so it reads as "lost them" rather than as a bug. */
    unwedge(this, dt);

    const nx = this.x + this.vx * dt;
    if (!carBlocked(nx, this.y, this.ang)) this.x = nx; else this.vx *= -0.35;
    const ny = this.y + this.vy * dt;
    if (!carBlocked(this.x, ny, this.ang)) this.y = ny; else this.vy *= -0.35;
    this.x = clamp(this.x, 12, WW - 12); this.y = clamp(this.y, 12, WH - 12);
  }
  draw(x, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    drawRot(x, Art.carShadow, sx, sy + CAR_SHADOW_DY, this.ang);
    drawRot(x, Art.cop, sx, sy, this.ang);
    const on = (this.flash * 6 | 0) % 2;
    x.fillStyle = on ? PAL.siren1 : PAL.siren2;
    x.fillRect((sx - 2) | 0, (sy - 2) | 0, 4, 4);
    x.globalAlpha = 0.30;
    x.fillRect((sx - 7) | 0, (sy - 7) | 0, 14, 14);
    x.globalAlpha = 1;
  }
}

/* ---------------- taco bag projectile --------------------- */
const THROW_T = 0.5, GRAV = 260, Z0 = 5;
const MAXTHROW = 132;

class Bag {
  constructor(x, y, tx, ty, spread) {
    this.x = x; this.y = y; this.z = Z0;
    const dx = tx - x, dy = ty - y;
    const sp = spread || 0;
    this.vx = dx / THROW_T + rand(-sp, sp);
    this.vy = dy / THROW_T + rand(-sp, sp);
    this.vz = (0 - Z0 + 0.5 * GRAV * THROW_T * THROW_T) / THROW_T;
    this.f = 0; this.dead = false; this.tx = tx; this.ty = ty;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vz -= GRAV * dt; this.z += this.vz * dt;
    this.f += dt * 14;
    if (this.z <= 0) { this.z = 0; this.dead = true; }
  }
  draw(x, cam) {
    const sx = (this.x - cam.x) | 0, sy = (this.y - cam.y) | 0;
    const sc = clamp(1 - this.z / 90, 0.4, 1);
    x.globalAlpha = 0.22 + sc * 0.2;
    x.fillStyle = '#100c18';
    x.fillRect(sx - 4, sy - 2, 9, 5);
    x.globalAlpha = 1;
    x.drawImage(Art.bag[(this.f | 0) % 4], sx - 6, (sy - this.z - 6) | 0);
  }
}

function rand(a, b) { return a + Math.random() * (b - a); }


/* ===== 60_nav.js ===== */
/* ============================================================
   NAV  --  "TACO-NAV 2000", a rudimentary guidance unit
   ============================================================ */
'use strict';

const TURN_NAMES = ['CONTINUE', 'TURN RIGHT', 'MAKE A U-TURN', 'TURN LEFT'];

const Nav = {
  goal: null,          // {x, y, node:[nx,ny], label}
  route: [],           // [[nx,ny], ...] nodes still ahead
  recalcT: 0,
  glitch: 0,           // >0 => panel shows RECALCULATING
  chirp: 0,
  turn: 0, dist: 0, arriving: false, lost: false,
  lastKey: '',

  setGoal(g) {
    this.goal = g;
    this.route = [];
    this.recalcT = 0;
    this.glitch = 0.85;
    this.lastKey = '';
    Audio5.sfx('recalc');
  },
  clear() { this.goal = null; this.route = []; },

  update(dt, p) {
    this.glitch = Math.max(0, this.glitch - dt);
    this.chirp = Math.max(0, this.chirp - dt);
    if (!this.goal) return;

    this.recalcT -= dt;
    if (this.recalcT <= 0) {
      this.recalcT = 0.4;
      this.recompute(p);
    }

    const gx2 = this.goal.x, gy2 = this.goal.y;
    const straight = hyp(gx2 - p.x, gy2 - p.y);
    this.arriving = straight < 165 || this.route.length === 0;

    if (this.arriving) {
      this.dist = straight;
      const want = Math.atan2(gy2 - p.y, gx2 - p.x);
      this.turn = relTurn(cardinal(p.ang), cardinal(want));
    } else {
      const a = this.route[0];
      const ax = City.nodeX(a[0]), ay = City.nodeY(a[1]);
      this.dist = hyp(ax - p.x, ay - p.y);
      const b = this.route[1];
      let exit;
      if (b) exit = cardinal(Math.atan2(City.nodeY(b[1]) - ay, City.nodeX(b[0]) - ax));
      else   exit = cardinal(Math.atan2(gy2 - ay, gx2 - ax));
      const approach = hyp(p.vx, p.vy) > 22 ? cardinal(Math.atan2(p.vy, p.vx)) : cardinal(p.ang);
      this.turn = relTurn(approach, exit);
      if (this.dist < 44 && this.turn !== 0 && this.chirp <= 0) { Audio5.sfx('nav'); this.chirp = 1.6; }
    }

    // off the tarmac == the unit loses its mind
    const s = City.surfaceAt(p.x, p.y);
    this.lost = (s === S_GRASS || s === S_WALK);
  },

  /* The junction the car is heading TOWARD, which is not always the nearest
     one. Seeding the search from the nearest node lets the route start at a
     junction the car has already driven past, and then every number on the
     panel describes somewhere behind you: the distance counts UP as you drive,
     and the instruction names the turn you just missed instead of admitting
     you missed it.

     This used to be patched afterwards by dropping the head node when the car
     was closer to the SECOND node than the two nodes are to each other. That
     works on a straight — it fires 12px past the junction — but on a TURN the
     second node is perpendicular and a full PITCH away wherever the car is, so
     it never fired at all. Measured driving straight through a junction the
     route wanted a turn at: 91 of 151 frames had the head node behind the car,
     and in 89 of them the panel's distance was growing while it still read
     TURN LEFT.

     Dropping the head node is not the fix either — on a turn the node after it
     is perpendicular, so you would be pointed at somewhere you cannot reach in
     a straight line. Seed the search correctly instead and Dijkstra does the
     rest: given where the car actually is and which way it is pointing, it
     will route on around the block, because a U-turn costs 1.8 against three
     turns at 0.45. Which is what a real unit does when you miss one. */
  aheadNode(p) {
    const moving = hyp(p.vx, p.vy) > 22;
    const hx = moving ? p.vx : Math.cos(p.ang);
    const hy = moving ? p.vy : Math.sin(p.ang);
    let nx = City.nearNodeX(p.x), ny = City.nearNodeY(p.y);
    // step one along whichever axis the car is travelling, but only if the
    // nearest junction on that axis is already behind it
    if (Math.abs(hx) >= Math.abs(hy)) {
      if ((City.nodeX(nx) - p.x) * hx < 0) nx = clamp(nx + (hx > 0 ? 1 : -1), 0, BLOCKS);
    } else {
      if ((City.nodeY(ny) - p.y) * hy < 0) ny = clamp(ny + (hy > 0 ? 1 : -1), 0, BLOCKS);
    }
    return [nx, ny];
  },

  recompute(p) {
    const s = this.aheadNode(p);
    const g = this.goal.node;
    const initDir = cardinal(hyp(p.vx, p.vy) > 22 ? Math.atan2(p.vy, p.vx) : p.ang);
    const path = solve(s, g, initDir);

    const key = path.map((n) => n[0] + ',' + n[1]).join('|');
    if (key !== this.lastKey) {
      if (this.lastKey && this.route.length > 1) this.glitch = 0.45;
      this.lastKey = key;
    }
    this.route = path;
  },

  /* route painted on the tarmac as chunky chevrons */
  drawRoute(x, cam, time) {
    if (!this.goal || this.glitch > 0.25) return;
    const pts = [];
    for (const n of this.route) pts.push([City.nodeX(n[0]), City.nodeY(n[1])]);
    pts.push([this.goal.cx || this.goal.x, this.goal.cy || this.goal.y]);
    if (!pts.length) return;

    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const len = hyp(bx - ax, by - ay);
      if (len < 1) continue;
      const ux = (bx - ax) / len, uy = (by - ay) / len;
      const ang = Math.atan2(uy, ux);
      for (let d = 10; d < len - 6; d += 22) {
        const px = ax + ux * d, py = ay + uy * d;
        const sx = px - cam.x, sy = py - cam.y;
        if (sx < -14 || sy < -14 || sx > VW + 14 || sy > VH + 14) continue;
        const ph = ((d * 0.02 - time * 1.5) % 1 + 1) % 1;
        x.globalAlpha = 0.30 + 0.42 * (1 - ph);
        chevron(x, sx, sy, ang, PAL.cyan);
      }
    }
    x.globalAlpha = 1;
  },
};

function chevron(x, sx, sy, ang, col) {
  const c = Math.cos(ang), s = Math.sin(ang);
  x.fillStyle = col;
  // two nested arrow bars, drawn as 2x2 blocks so it stays chunky
  for (let i = -4; i <= 4; i++) {
    const t = 4 - Math.abs(i);
    for (const off of [0, 5]) {
      const lx = t - 4 + off, ly = i;
      x.fillRect(Math.round(sx + lx * c - ly * s) - 1, Math.round(sy + lx * s + ly * c) - 1, 2, 2);
    }
  }
}

/* cardinal index for an angle: 0=E 1=S 2=W 3=N */
function cardinal(a) {
  let i = Math.round(a / (PI / 2)) % 4;
  if (i < 0) i += 4;
  return i;
}
/* 0 straight, 1 right, 2 u-turn, 3 left */
function relTurn(from, to) { return ((to - from) % 4 + 4) % 4; }

/* ---- dijkstra over (intersection, arrival direction) ------ */
function solve(start, goal, initDir) {
  const N = NODES * NODES * 4;
  const cost = new Float32Array(N).fill(Infinity);
  const prev = new Int32Array(N).fill(-1);
  const done = new Uint8Array(N);
  const idx = (nx, ny, d) => ((ny * NODES + nx) * 4 + d);

  for (let d = 0; d < 4; d++) cost[idx(start[0], start[1], d)] = d === initDir ? 0 : 0.35;

  let best = -1;
  for (;;) {
    let u = -1, c = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && cost[i] < c) { c = cost[i]; u = i; }
    if (u < 0) break;
    done[u] = 1;
    const d = u & 3, node = u >> 2, nx = node % NODES, ny = (node / NODES) | 0;
    if (nx === goal[0] && ny === goal[1]) { best = u; break; }
    for (let nd = 0; nd < 4; nd++) {
      const mx = nx + DIRV[nd][0], my = ny + DIRV[nd][1];
      if (mx < 0 || my < 0 || mx >= NODES || my >= NODES) continue;
      const step = 1 + (nd === d ? 0 : nd === (d + 2) % 4 ? 1.8 : 0.45);
      const v = idx(mx, my, nd);
      if (c + step < cost[v]) { cost[v] = c + step; prev[v] = u; }
    }
  }
  if (best < 0) return [];
  const out = [];
  for (let u = best; u >= 0; u = prev[u]) {
    const node = u >> 2;
    out.push([node % NODES, (node / NODES) | 0]);
  }
  out.reverse();
  return out;
}


/* ===== 70_hud.js ===== */
/* ============================================================
   HUD  --  order card, tip meter, TACO-NAV panel, minimap
   ============================================================ */
'use strict';

const MM = 52;                      // minimap edge in px

const Hud = {
  mapImg: null,

  buildMap() {
    const t = mkCanvas(MM, MM);
    const x = t.x;
    R(x, PAL.field, 0, 0, MM, MM);   // past the last street, same as the ground
    // roads are 2 tiles wide but a minimap pixel covers ~2 tiles, so point
    // sampling drops whole streets — take the most important class in the cell
    const step = GW / MM;
    for (let my = 0; my < MM; my++) for (let mx = 0; mx < MM; mx++) {
      const tx0 = (mx * step) | 0, ty0 = (my * step) | 0;
      let road = false, walk = false, land = false;
      for (let dy = 0; dy < Math.ceil(step); dy++) for (let dx = 0; dx < Math.ceil(step); dx++) {
        const c = classify(tx0 + dx, ty0 + dy);
        if (c === T_ROAD || c === T_INTER) road = true;
        else if (c === T_WALK) walk = true;
        else if (c === T_LOT) land = true;
      }
      const col = road ? '#828799' : walk ? '#4a4e5e' : land ? '#343848' : PAL.field;
      R(x, col, mx, my, 1, 1);
    }
    this.mapImg = t.c;
  },

  panel(x, px, py, w, h, accent) {
    R(x, PAL.ink, px, py, w, h);
    R(x, '#2c2338', px + 1, py + 1, w - 2, h - 2);
    x.strokeStyle = accent || '#5b5170'; x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
    R(x, 'rgba(255,255,255,0.07)', px + 1, py + 1, w - 2, 1);
  },

  draw(x, G) {
    if (!this.mapImg) this.buildMap();
    const o = G.order;

    /* ---------- order + tip ----------
       44 tall, matching the clock card opposite. It has to be: the scale-2
       money readout occupies y23..36, so a 37-tall card left no room and the
       decay bar was painted over the bottom 3px of the digits. */
    this.panel(x, 3, 3, 140, 44, '#6b5f84');
    if (o) {
      // Text starts at x=8 in a 140-wide card, so a scale-1 line has ~131px:
      // 22 characters. The restock lines used to read "OUT OF TACOS - RESTOCK
      // AT" / "TACO SHOP (<addr> WAITING)" — 149px and up to 203px, both
      // spilling well past the card. Longest address the generator makes is 13
      // chars ("408 WALNUT ST"), so "<addr> WAITING" tops out at 125px.
      text(x, G.needPickup ? 'OUT OF TACOS - RESTOCK' : 'DELIVER TO', 8, 7,
        G.needPickup ? PAL.bad : PAL.boneDim, 1);
      text(x, G.needPickup ? o.label + ' WAITING' : o.label, 8, 15, PAL.bone, 1);
      const pop = G.tipPop > 0 ? 1 : 0;
      text(x, money(o.tip), 8, 23, o.tip <= o.floor + 1 ? PAL.bad : PAL.amber, 2);
      text(x, 'TIP', 8 + textW(money(o.tip), 2) + 5, 29, PAL.boneDim, 1);
      if (pop) { x.globalAlpha = 0.5; text(x, money(o.tip), 8, 23, PAL.bone, 2); x.globalAlpha = 1; }
      // decay bar
      const f = clamp((o.tip - o.floor) / (o.max - o.floor), 0, 1);
      R(x, '#1b1425', 7, 39, 132, 4);
      const bw = Math.round(130 * f);
      R(x, f > 0.5 ? PAL.amber : f > 0.22 ? '#e07a1f' : PAL.bad, 8, 40, bw, 2);
      for (let i = 8; i < 138; i += 6) R(x, 'rgba(0,0,0,0.35)', i, 40, 1, 2);
    } else {
      text(x, 'NO ACTIVE ORDER', 8, 15, PAL.boneDim, 1);
    }

    /* ---------- clock + earnings ----------
       widths are tight at 384px: labels sit left at 1x, values right at 2x,
       sized so a 7-char "$999.99" still clears the label */
    const pw = 128, px0 = VW - pw + 1;
    this.panel(x, VW - pw - 3, 3, pw, 44, '#6b5f84');
    text(x, 'SHIFT', px0, 8, PAL.boneDim, 1);
    const low = G.shift < 20;
    text(x, clockStr(G.shift), VW - 7, 5, low && (G.time * 4 | 0) % 2 ? PAL.bad : PAL.bone, 2, 2);
    text(x, 'PAID', px0, 23, PAL.boneDim, 1);
    text(x, money(G.earned), VW - 7, 20, PAL.good, 2, 2);
    // Hays PD attention. "HAYS PD" is 41px at scale 1 where "HEAT" was 23, so
    // the meter starts 18px further right and is shortened by the same amount
    // — its right edge stays put, and the 3px label gap is preserved.
    text(x, 'HAYS PD', px0, 37, PAL.boneDim, 1);
    R(x, '#1b1425', px0 + 44, 36, 72, 5);
    const hf = clamp(G.heat / G.heatMax, 0, 1);
    R(x, hf > 0.75 ? PAL.bad : hf > 0.4 ? '#e07a1f' : '#5b6a8a', px0 + 45, 37, Math.round(70 * hf), 3);
    if (G.cop) textOut(x, 'IN PURSUIT', px0 + 44, 36, PAL.bad, 1);

    /* The combo moved under the level line, which G.drawLevelLine draws in
       both shifts. The nav ladder (difficulty.md) decides which of the five
       guidance aids draw; the demo always shows them all. */
    const nav = G.state === 'demo' || !G.nav ? { panel: 1, line: 1, dot: 1, edge: 1, beacon: 1 } : G.nav;

    /* ---------- minimap ---------- */
    const mx0 = 4, my0 = VH - MM - 4;
    R(x, PAL.ink, mx0 - 2, my0 - 2, MM + 4, MM + 4);
    x.globalAlpha = 0.88; x.drawImage(this.mapImg, mx0, my0); x.globalAlpha = 1;
    const w2m = (wx) => mx0 + wx / WW * MM, h2m = (wy) => my0 + wy / WH * MM;
    // route breadcrumbs
    if (Nav.goal && nav.line) {
      x.fillStyle = PAL.cyanLo;
      for (const n of Nav.route) x.fillRect(w2m(City.nodeX(n[0])) | 0, h2m(City.nodeY(n[1])) | 0, 1, 1);
    }
    // shop
    R(x, PAL.red, w2m(City.shop.x + 60) - 1, h2m(City.shop.y + 40) - 1, 3, 3);
    // goal
    if (Nav.goal && nav.dot) {
      const blink = (G.time * 5 | 0) % 2;
      R(x, blink ? PAL.amber : PAL.bone, w2m(Nav.goal.x) - 2, h2m(Nav.goal.y) - 2, 5, 5);
      R(x, PAL.ink, w2m(Nav.goal.x) - 1, h2m(Nav.goal.y) - 1, 3, 3);
    }
    // cop
    if (G.cop) R(x, (G.time * 6 | 0) % 2 ? PAL.siren1 : PAL.siren2, w2m(G.cop.x) - 1, h2m(G.cop.y) - 1, 3, 3);
    // player
    R(x, PAL.bone, w2m(G.player.x) - 1, h2m(G.player.y) - 1, 3, 3);
    R(x, PAL.ink2, w2m(G.player.x), h2m(G.player.y), 1, 1);
    x.strokeStyle = '#6b5f84'; x.lineWidth = 1;
    x.strokeRect(mx0 - 1.5, my0 - 1.5, MM + 3, MM + 3);

    /* ---------- TACO-NAV ---------- */
    if (nav.panel) this.drawNav(x, G);

    /* ---------- taco bag ---------- */
    /* Mode C's GAS and REV buttons sit on the bag's corner, so on a phone the
       bag moves up under the order card where nothing is pressed. */
    const touchC = typeof Pad !== 'undefined' && Pad.mode === 'C';
    const bx0 = touchC ? 6 : VW - 76, by0 = touchC ? 61 : VH - 20;
    text(x, 'DELIVERIES', bx0, by0 - 9, PAL.boneDim, 1);
    for (let i = 0; i < G.bagMax; i++) {
      const px = bx0 + i * 15, py = by0;
      if (i < G.bag) {
        R(x, PAL.ink, px, py, 13, 13);
        R(x, BAG_MID, px + 1, py + 1, 11, 11);
        R(x, BAG_HI, px + 1, py + 1, 11, 1);
        R(x, BAG_LO, px + 1, py + 3, 11, 1);
        R(x, BAG_LO, px + 1, py + 10, 11, 2);
        R(x, PAL.jade, px + 4, py + 5, 5, 4);
        R(x, PAL.gold, px + 5, py + 6, 3, 1);
      } else {
        R(x, '#2c2338', px, py, 13, 13);
        x.strokeStyle = '#4a4058'; x.strokeRect(px + 0.5, py + 0.5, 12, 12);
      }
    }

    /* ---------- edge arrow to target ---------- */
    if (nav.edge) this.edgeArrow(x, G);

    /* ---------- banners ---------- */
    if (G.banner && G.bannerT > 0) {
      const a = clamp(G.bannerT / 0.4, 0, 1);
      x.globalAlpha = a;
      const w = textW(G.banner, 2) + 16;
      R(x, PAL.ink, (VW - w) / 2 | 0, 60, w, 20);
      x.strokeStyle = G.bannerCol; x.strokeRect(((VW - w) / 2 | 0) + 0.5, 60.5, w - 1, 19);
      // y is the TOP of the run, not its centre: the box is 20 tall from y=60
      // and the 5x7 font at scale 2 is 14, so y=66 put the final glyph row on
      // the bottom border stroke. 63 centres it with 3px either side.
      text(x, G.banner, VW / 2, 63, G.bannerCol, 2, 1);
      x.globalAlpha = 1;
    }
  },

  drawNav(x, G) {
    /* No unit name in the box. "TACO-NAV 2000" cost 10 of the panel's 34
       rows to say something the player reads once and never needs again, and
       the panel sits over the road you are trying to see. The identity lives
       in the LCD treatment — cyan on near-black with scan lines — not in a
       caption. Sized to the longest thing it can ever say: MAKE A U-TURN at
       77px from px+32, and RETURN TO ROADWAY at 101px centred. */
    const w = 118, h = 24, px = (VW - w) / 2 | 0, py = VH - h - 4;
    R(x, PAL.ink, px, py, w, h);
    R(x, '#0e1c1c', px + 1, py + 1, w - 2, h - 2);
    x.strokeStyle = PAL.cyanLo; x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
    // LCD scan lines
    x.fillStyle = 'rgba(63,184,176,0.055)';
    for (let i = py + 2; i < py + h - 1; i += 2) x.fillRect(px + 1, i, w - 2, 1);

    if (!Nav.goal) { text(x, 'STANDBY', px + w / 2, py + 5, PAL.cyanLo, 2, 1); return; }

    if (Nav.glitch > 0 || Nav.lost) {
      const flick = (G.time * 9 | 0) % 2;
      text(x, flick ? 'RECALCULATING' : 'RECALCULATING.', px + w / 2, py + 4, flick ? PAL.cyan : PAL.cyanLo, 1, 1);
      text(x, Nav.lost ? 'RETURN TO ROADWAY' : 'PLEASE WAIT', px + w / 2, py + 13, PAL.cyanLo, 1, 1);
      return;
    }

    const arrowX = px + 16, arrowY = py + 12;
    navArrow(x, arrowX, arrowY, Nav.arriving ? 4 : Nav.turn, PAL.cyan, G.time);

    const label = Nav.arriving ? 'ARRIVING' : TURN_NAMES[Nav.turn];
    text(x, label, px + 32, py + 4, PAL.cyan, 1);
    const m = Math.max(0, Math.round(Nav.dist / 8 / 5) * 5);
    text(x, Nav.arriving ? 'TOSS THE BAG' : ('IN ' + m + ' M'), px + 32, py + 13, PAL.cyanLo, 1);
    if (Nav.arriving) {
      const b = (G.time * 6 | 0) % 2;
      R(x, b ? PAL.cyan : PAL.cyanLo, px + w - 6, py + 3, 3, 3);
    }
  },

  edgeArrow(x, G) {
    if (!Nav.goal) return;
    const cam = G.cam;
    const sx = Nav.goal.x - cam.x, sy = Nav.goal.y - cam.y;
    const pad = 16;
    if (sx > pad && sx < VW - pad && sy > pad && sy < VH - pad) return;
    // keep the arrow inside the clear band: below the top panels,
    // above the nav unit, clear of the minimap
    const cx = VW / 2, cy = VH / 2;
    const a = Math.atan2(sy - cy, sx - cx);
    // Mode C: keep it above the on-screen controls, which start at y146
    const touchC = typeof Pad !== 'undefined' && Pad.mode === 'C';
    const hw = VW / 2 - 26, hh = VH / 2 - (touchC ? 70 : 52);
    const t = Math.min(Math.abs(hw / Math.cos(a)), Math.abs(hh / Math.sin(a)));
    const ex = cx + Math.cos(a) * t, ey = cy + Math.sin(a) * t;
    const pulse = 0.6 + 0.4 * Math.sin(G.time * 7);
    x.globalAlpha = pulse;
    triArrow(x, ex, ey, a, 9, PAL.amber, PAL.ink);
    x.globalAlpha = 1;
