<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- shell.html has no <head>, so no <meta charset>: an em dash here would be
     decoded as Latin-1 when the file is opened directly. Entity = ASCII bytes. -->
<title>Taco Shop &mdash; Carnage Asada</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#120d1a;
    overflow:hidden;
    display:flex;
  }

  /* No page chrome by design — the canvas is the whole product. #stage is
     kept because 90_main.js measures it to size the canvas; removing it
     would silently fall back to window.innerWidth. */
  #stage{
    flex:1 1 auto;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }

  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#120d1a;
    cursor:crosshair;
    outline:none;
  }
  canvas:focus-visible{box-shadow:0 0 0 2px #3fb8b0;}
</style>
</head>
<body>


<div id="stage">
  <canvas id="screen" width="384" height="216" tabindex="0" aria-label="Taco Shop: Carnage Asada, a top-down taco delivery arcade game"></canvas>
</div>

<script src="src/00_core.js"></script>
<script src="src/10_font.js"></script>
<script src="src/20_audio.js"></script>
<script src="src/30_art.js"></script>
<script src="src/40_city.js"></script>
<script src="src/50_entities.js"></script>
<script src="src/60_nav.js"></script>
<script src="src/70_hud.js"></script>
<script src="src/80_game.js"></script>
<script src="src/90_main.js"></script>

</body>
</html>
